, "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s17", "extra": false}, {"id": 605, "q": "In ethnography, who is the influential person with social status who assists researchers in gaining access to the site and community?", "options": ["Key Informant", "Participant", "Gatekeeper", "Facilitator"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s08", "extra": false}, {"id": 606, "q": "Which of the following is NOT considered good ethnography, even if the researcher actively participates in daily activities?", "options": ["Maintaining a critical stance", "Providing an independent reflection on observations", "Becoming a member of the group to the point of losing objectivity", "Keeping personal distance"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s07", "extra": false}, {"id": 607, "q": "Cultural Probes are typically designed to inspire:", "options": ["Design for utility", "Design for pleasure", "Design for profit", "Design for science"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s08", "extra": false}, {"id": 608, "q": "In Confidentiality, who knows the participant's personal data but does not disclose their identity?", "options": ["No one", "Only the participant", "The researcher and investigator", "The public"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s09", "extra": false}, {"id": 609, "q": "When should qualitative research be used?", "options": ["When simplifying or generalizing phenomena", "When testing an existing theory", "When collecting numerical, statistical data", "When little is known about the topic, variables are unclear, or theory is incomplete"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s13", "extra": false}, {"id": 610, "q": "Which of the following is required in a Case Study?", "options": ["Using only quantitative data", "Focusing on one single independent variable", "Collecting and analyzing data from multiple sources to gain deep understanding", "Studying only past events"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s10", "extra": false}, {"id": 611, "q": "What main question does Phenomenology try to answer?", "options": ["How often does this behavior occur?", "What is the causal relationship between two variables?", "What past events led to this situation?", "What is it like to do or experience something?"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s11", "extra": false}, {"id": 612, "q": "What does Historical Research focus on?", "options": ["Predicting future sales", "Explaining past events, trends, and developments to understand their impact today", "Developing new theories from user data", "Measuring consumer attitudes"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s11", "extra": false}, {"id": 613, "q": "The goal of Grounded Theory is to:", "options": ["Test existing theories", "Use established frameworks to explain data", "Develop theory inductively from collected data", "Prove causal relationships"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s12", "extra": false}, {"id": 614, "q": "What is the correct order of Coding in Grounded Theory?", "options": ["Axial → Open → Selective", "Open → Axial → Selective", "Selective → Axial → Open", "Axial → Selective → Open"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "WARNING: Quizlet's answer is C. The teacher's slides (Session 12) give the order Open → Axial → Selective (B).", "ls": "s12", "extra": false}, {"id": 615, "q": "What is Quantitative Research?", "options": ["Deep research using narrative data", "Experimental research using numerical data", "Research that builds new theories", "Research always influenced by researcher bias"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s15", "extra": false}, {"id": 616, "q": "Research in Controlled Lab Environments improves which type of validity?", "options": ["External Validity", "Internal Validity (isolating causal relationships)", "Reliability", "Generalization"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s15", "extra": false}, {"id": 617, "q": "What is the main purpose of an Experimental Study?", "options": ["Describe behavior and trends", "Statistically synthesize other studies", "Explore lived experiences", "Establish cause-and-effect by manipulating independent variables"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s15", "extra": false}, {"id": 618, "q": "Quantitative Observational Studies describe patterns and behaviors by measuring which two elements?", "options": ["Lived experiences and cultural meanings", "Frequency (how often) and conditions under which it occurs", "Internal and external validity", "Subjectivity and objectivity"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s11", "extra": false}, {"id": 619, "q": "Which question type allows participants to choose multiple answers?", "options": ["Dichotomous", "Single Selection", "Multi-Selection / Checklist", "Ranking"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s14", "extra": false}, {"id": 620, "q": "Likert Scale and Semantic Differential Scale are examples of:", "options": ["Single-choice Questions", "Ranking Questions", "Open Questions", "Scale Questions"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s14", "extra": false}, {"id": 621, "q": "Visual Research studies and interprets which elements?", "options": ["Numerical data and statistics", "Personal narratives and lived experiences", "Images, forms, and objects in visual and material culture", "Historical records"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s16", "extra": false}, {"id": 622, "q": "Which visual analysis method is a quantitative approach involving counting and summarizing phenomena in images or text?", "options": ["Compositional Interpretation", "Semiotics", "Visual Connoisseurship", "Content Analysis"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s16", "extra": false}, {"id": 623, "q": "In Semiotics, which type of sign has a direct relationship to its object (e.g., smoke indicating fire)?", "options": ["Symbol", "Index", "Icon", "Variable"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s16", "extra": false}, {"id": 624, "q": "Which applied research approach uses a creative artefact as the central part of the investigation?", "options": ["Practice-led Research", "Action Research", "Practice-based Research", "Ethnographic Research"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s17", "extra": false}, {"id": 625, "q": "Action Research is a cyclical process consisting of which steps?", "options": ["Act, Observe, Reflect, Plan", "Observe, Plan, Act, Reflect", "Plan, Act, Observe, Reflect", "Reflect, Plan, Observe, Act"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s17", "extra": false}, {"id": 626, "q": "Which innovation strategy introduces new and superior products and shifts a company into a new market category (e.g., the first iPhone)?", "options": ["Incremental Innovation", "Breakthrough Innovation", "Disruptive Innovation", "Product-based Innovation"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s52", "extra": false}, {"id": 627, "q": "Which strategy targets non-consumers with simple, affordable solutions to create new markets?", "options": ["Incremental Innovation", "Breakthrough Innovation", "Disruptive Innovation", "Product-based Innovation"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set A)", "note": "", "ls": "s52", "extra": false}];
const GL = {"s01": [{"t": "Research", "d": "RE + SEARCH: a careful, repeated, systematic process of inquiry to discover facts that are hidden or not yet discovered.", "vi": "nghiên cứu"}, {"t": "Research methods (in design)", "d": "The specific ways designers collect data, analyse it and interpret its meaning (observation, case study, experiments, tests, surveys…).", "vi": "phương pháp nghiên cứu (trong thiết kế)"}, {"t": "Purpose of design research", "d": "To inform design practice and support well-reasoned, evidence-based design decisions.", "vi": "mục đích của nghiên cứu thiết kế"}], "s02": [{"t": "Human-centric design", "d": "Design that places people's needs at the centre of decisions – 'You cannot understand good design if you do not understand people' (Dieter Rams).", "vi": "thiết kế lấy con người làm trung tâm"}, {"t": "Industry 4.0", "d": "The 4th industrial revolution: cyber-physical systems, IoT, robotics, AI and ML.", "vi": "cách mạng công nghiệp 4.0"}, {"t": "Creator → Curator", "d": "With generative design and AI, the designer's role shifts from producing/creating to curating.", "vi": "người sáng tạo → người tuyển chọn"}, {"t": "9 intellectual standards", "d": "Clarity, Accuracy, Precision, Relevance, Depth, Breadth, Logic, Significance, Fairness.", "vi": "9 tiêu chuẩn tư duy"}, {"t": "Intradisciplinary", "d": "Working within one discipline (e.g. architect + architect).", "vi": "nội ngành"}, {"t": "Cross-disciplinary", "d": "Viewing one discipline from the perspective of another.", "vi": "xuyên ngành (nhìn ngành này qua góc ngành khác)"}, {"t": "Multidisciplinary", "d": "Several disciplines from the same field working in parallel.", "vi": "đa ngành (song song)"}, {"t": "Interdisciplinary", "d": "Integrating knowledge across disciplines; can create a new discipline.", "vi": "liên ngành (tích hợp)"}, {"t": "Transdisciplinary", "d": "A 'fusion of disciplines' that goes beyond disciplinary norms to create a new framework; for complex problems no single discipline can solve.", "vi": "siêu ngành / vượt ngành"}, {"t": "Problem-based learning", "d": "No brief is given – students build their own brief through exploratory research, in teams.", "vi": "học dựa trên vấn đề"}, {"t": "Process-based learning", "d": "All students get the same brief and the same process; results are similar.", "vi": "học dựa trên quy trình"}], "s03": [{"t": "Design research", "d": "Moves design from a 'rough, ambiguous territory' to an 'arena of reasoned inquiry'; evidence-based and built on critical thinking.", "vi": "nghiên cứu thiết kế"}, {"t": "Design thinking", "d": "Combining creative + critical reasoning; a human-centred approach integrating people's needs, technology's possibilities and business requirements (Tim Brown, IDEO).", "vi": "tư duy thiết kế"}, {"t": "Raymond Loewy", "d": "'Father of Industrial Design' / 'Father of Streamlining'; 1934 Sears Coldspot refrigerator.", "vi": "cha đẻ thiết kế công nghiệp"}, {"t": "Human factors & ergonomics", "d": "The WWII-era focus of industrial designers on fitting machines to people.", "vi": "yếu tố con người & công thái học"}, {"t": "4 steps of research analysis", "d": "Observation → Description → Explanation → Prescription.", "vi": "4 bước phân tích nghiên cứu"}], "s04": [{"t": "Research problem", "d": "The core issue: a condition to improve, a difficulty to eliminate, or a question to answer. A design problem is also a research problem.", "vi": "vấn đề nghiên cứu"}, {"t": "Research statement", "d": "States the single goal of the whole study and its aims & objectives.", "vi": "tuyên bố nghiên cứu"}, {"t": "Delimit", "d": "The focus and scope – what is included in the study (its boundaries).", "vi": "giới hạn phạm vi"}, {"t": "Limit", "d": "Weaknesses or shortcomings that may affect the results.", "vi": "hạn chế / điểm yếu"}, {"t": "Hypothesis", "d": "'A logical supposition, a reasonable guess, an educated conjecture' (Leedy & Ormrod) – a tentative answer; used in experimental research.", "vi": "giả thuyết"}, {"t": "Research question", "d": "The question the study sets out to answer; common in qualitative research.", "vi": "câu hỏi nghiên cứu"}, {"t": "Literature review", "d": "Describes theoretical perspectives and previous findings to identify the 'gap' in the knowledge.", "vi": "tổng quan tài liệu"}, {"t": "Knowledge gap", "d": "What is not yet known – the reason the research is needed.", "vi": "khoảng trống kiến thức"}, {"t": "Chronological review", "d": "Literature ordered by publication date, oldest → newest.", "vi": "tổng quan theo thứ tự thời gian xuất bản"}, {"t": "Historical review", "d": "How ideas/theories developed over time (historical trends, not publication dates).", "vi": "tổng quan theo lịch sử phát triển"}, {"t": "Thematic review", "d": "Organised around common themes/topics.", "vi": "tổng quan theo chủ đề"}, {"t": "Methodological review", "d": "Compares the methods/procedures of studies.", "vi": "tổng quan theo phương pháp"}, {"t": "Theoretical review", "d": "Examines how theories have framed the problem; used to critique theories.", "vi": "tổng quan lý thuyết"}, {"t": "Meta-analysis", "d": "A quantitative review that statistically combines the results of several studies on the same question.", "vi": "phân tích tổng hợp (thống kê)"}, {"t": "Saturation", "d": "The point where new data only repeats what is already known (repetitive patterns) – time to stop.", "vi": "bão hòa dữ liệu"}, {"t": "Glossary of key terms", "d": "'For the purpose of this research, [term] will be defined as…'; placed at the start of the proposal or in the appendix.", "vi": "bảng thuật ngữ"}], "s05": [{"t": "Method", "d": "The techniques and procedures used to solve research problems (narrower; part of the methodology).", "vi": "phương pháp"}, {"t": "Methodology", "d": "The overall theoretical framework that logically justifies why a method is used (broader).", "vi": "phương pháp luận"}, {"t": "Ethnographic research", "d": "Studies groups of people by observing or participating in their lives.", "vi": "nghiên cứu dân tộc học"}, {"t": "Qualitative research", "d": "How individuals see and experience the world, in natural settings.", "vi": "nghiên cứu định tính"}, {"t": "Quantitative research", "d": "Describes, simplifies and generalises using numbers; verifies existing theories.", "vi": "nghiên cứu định lượng"}, {"t": "Visual research", "d": "Analyses 'found' images and objects – things that already exist.", "vi": "nghiên cứu hình ảnh"}, {"t": "Applied research", "d": "Enables practitioners to investigate and evaluate their own work (inner-directed).", "vi": "nghiên cứu ứng dụng"}, {"t": "Triangulation", "d": "Cross-checking multiple sources of evidence to make research credible, valid and reliable (data, investigator, theory, methodological).", "vi": "kiểm chứng chéo (tam giác hóa)"}, {"t": "Multimethod research", "d": "= methodological triangulation: combining qual and quant in one study.", "vi": "nghiên cứu đa phương pháp"}, {"t": "Ethics", "d": "A system of universal moral standards covering planning, engaging with participants and publishing.", "vi": "đạo đức nghiên cứu"}, {"t": "Data fabrication", "d": "Altering data without recording it, or inventing data.", "vi": "bịa đặt dữ liệu"}, {"t": "Elimination of data", "d": "Removing data that doesn't fit (must be recorded and explained if done).", "vi": "loại bỏ dữ liệu"}, {"t": "Exploitation of data", "d": "Exaggerating / overclaiming the significance of results.", "vi": "thổi phồng dữ liệu"}, {"t": "Plagiarism", "d": "Presenting someone else's work or data as your own.", "vi": "đạo văn"}, {"t": "Respect", "d": "Ethical principle: human worth, autonomy, right to withdraw, privacy, confidentiality.", "vi": "tôn trọng"}, {"t": "Research merit & integrity", "d": "Ethical principle: genuine benefit, suitable methods, honesty, publish results good or bad.", "vi": "giá trị & liêm chính nghiên cứu"}, {"t": "Justice", "d": "Ethical principle: fair selection, fair distribution of benefits, no exploitation.", "vi": "công bằng"}, {"t": "Beneficence", "d": "Ethical principle: benefits must justify the risks; minimise risks.", "vi": "lợi ích vượt rủi ro (hướng thiện)"}], "s06": [{"t": "Research proposal", "d": "An outline of what researchers propose to do; approval confirms a clear plan.", "vi": "đề cương nghiên cứu"}, {"t": "Stakeholders", "d": "Who benefits from or is affected by the research.", "vi": "các bên liên quan"}, {"t": "Research implications", "d": "The social, cultural, environmental and economic significance of the research.", "vi": "ý nghĩa của nghiên cứu"}, {"t": "Heaviest proposal sections", "d": "Knowledge gap (3/16) and Research methods & methodologies (3/16).", "vi": "phần nặng nhất của đề cương"}], "s07": [{"t": "Ethnography", "d": "Greek 'ethnos' (people) + 'graphy' (writing): an in-depth, systematic study of groups of people by observing or participating in their lives.", "vi": "dân tộc học"}, {"t": "Fieldwork", "d": "Collecting data in the participants' own setting: observation, participation, interviews.", "vi": "nghiên cứu thực địa"}, {"t": "Auto-ethnography", "d": "The researcher's own thoughts and perspectives are central.", "vi": "tự dân tộc học"}, {"t": "Cyber-ethnography", "d": "Ethnography of online communities and social networks.", "vi": "dân tộc học trực tuyến"}, {"t": "Outsider / Insider", "d": "Outsider = observer, interviewer, listener; insider = takes part in activities.", "vi": "người ngoài / người trong cuộc"}, {"t": "Over-integrated", "d": "Too emotionally involved → results become subjective and biased.", "vi": "hòa nhập quá mức"}, {"t": "Step-in-step-out", "d": "Shorter ethnography in familiar settings (instead of 12–18 months).", "vi": "vào ra ngắn hạn"}, {"t": "Cultural interpretation", "d": "The ethnographer's main goal – presented without prejudice.", "vi": "diễn giải văn hóa"}], "s08": [{"t": "Gatekeeper", "d": "An influential community leader who helps the researcher gain access.", "vi": "người gác cổng (người có ảnh hưởng)"}, {"t": "Key informant", "d": "A person who gives information and introduces the researcher to others.", "vi": "người cung cấp thông tin chính"}, {"t": "Rapport", "d": "Trust built with the community ('big net' approach).", "vi": "sự tin tưởng / quan hệ thân thiện"}, {"t": "Field notes", "d": "Detailed written records made during fieldwork.", "vi": "ghi chép thực địa"}, {"t": "Structured interview", "d": "Rigid, fixed questions; suits quantitative surveys; no further clarification.", "vi": "phỏng vấn có cấu trúc"}, {"t": "Semi-structured interview", "d": "Predefined main questions + flexible follow-ups.", "vi": "phỏng vấn bán cấu trúc"}, {"t": "In-depth interview", "d": "Open, conversational; explores deeper feelings.", "vi": "phỏng vấn sâu"}, {"t": "Focus group", "d": "A group discussion showing what people think in the light of others' opinions.", "vi": "nhóm tập trung (thảo luận nhóm)"}, {"t": "Oral history", "d": "Participants recount past experiences and memories as narratives.", "vi": "lịch sử truyền miệng"}, {"t": "Participant observation", "d": "Taking part in the group's normal activities while keeping a critical position.", "vi": "quan sát tham dự"}, {"t": "Cultural probes", "d": "Tasks/kits (postcards, maps, cameras, diaries) that collect inspirational responses from users; 'design for pleasure'.", "vi": "bộ công cụ thăm dò văn hóa"}, {"t": "Rapid ethnography", "d": "Shorter ethnography when time and budget are limited.", "vi": "dân tộc học nhanh"}], "s09": [{"t": "Informed consent", "d": "A document stating the nature of the research, the risks and the right to withdraw at any time.", "vi": "sự đồng ý có hiểu biết"}, {"t": "Deception", "d": "Withholding information or misleading participants; only allowed with strong justification + immediate debriefing.", "vi": "lừa dối (che giấu mục đích)"}, {"t": "Debriefing", "d": "Telling participants the real purpose and results afterwards.", "vi": "giải thích sau nghiên cứu"}, {"t": "Confidentiality", "d": "The researcher knows the identity but does not disclose it.", "vi": "bảo mật (biết nhưng không tiết lộ)"}, {"t": "Anonymity", "d": "No one, not even the researcher, knows who the participant is.", "vi": "ẩn danh (không ai biết danh tính)"}, {"t": "Describe → Categorize → Interpret", "d": "The 3 steps of analysing ethnographic data.", "vi": "mô tả → phân loại → diễn giải"}], "s10": [{"t": "Qualitative research (definition)", "d": "In-depth research used when little is known, variables are unknown or theory is lacking; gives a rich picture of a complex situation.", "vi": "nghiên cứu định tính (định nghĩa)"}, {"t": "Iterative analysis", "d": "Collecting and analysing data at the same time.", "vi": "phân tích lặp (thu thập và phân tích cùng lúc)"}, {"t": "Case study", "d": "In-depth study of a complex subject in a defined time and context, using multiple data sources.", "vi": "nghiên cứu tình huống"}, {"t": "Exploratory case study", "d": "A starting point / precursor to larger research.", "vi": "tình huống khám phá"}, {"t": "Descriptive case study", "d": "A comprehensive description of a phenomenon.", "vi": "tình huống mô tả"}, {"t": "Explanatory case study", "d": "Explains cause and effect.", "vi": "tình huống giải thích (nhân quả)"}, {"t": "Instrumental case study", "d": "One case used to understand a wider issue.", "vi": "tình huống công cụ"}, {"t": "Intrinsic case study", "d": "The unique case itself is the focus.", "vi": "tình huống nội tại"}, {"t": "Comparative case study", "d": "Compares several cases to find patterns.", "vi": "tình huống so sánh"}, {"t": "Chain of evidence", "d": "Links research question – data – conclusions.", "vi": "chuỗi bằng chứng"}, {"t": "Archival records", "d": "Existing records (service, organisational, maps, registers, personal records) used as data.", "vi": "hồ sơ lưu trữ"}], "s11": [{"t": "Phenomenology", "d": "Understands participants' perspectives on social realities – 'What is it like to experience something?' (Husserl; Leedy & Ormrod).", "vi": "hiện tượng học"}, {"t": "Lived experience", "d": "A person's first-hand experience of a phenomenon.", "vi": "trải nghiệm sống"}, {"t": "Essence", "d": "The core themes shared across participants' experiences.", "vi": "bản chất (chủ đề cốt lõi)"}, {"t": "Purposeful sampling", "d": "Selecting participants who have direct experience of the phenomenon.", "vi": "chọn mẫu có chủ đích"}, {"t": "Snowball sampling", "d": "Participants recruit/introduce further participants.", "vi": "chọn mẫu quả cầu tuyết"}, {"t": "Data segmentation", "d": "Splitting data into segments, one idea per segment (phenomenology analysis step 1).", "vi": "phân đoạn dữ liệu"}, {"t": "Historical research", "d": "Interprets the 'currents and counter-currents' of past events to understand the present and future.", "vi": "nghiên cứu lịch sử"}, {"t": "Design history", "d": "Studies the past of design (artefacts, practices) – Huppatz & Lees-Maffei.", "vi": "lịch sử thiết kế"}, {"t": "Trend forecasting", "d": "Analyses changes to identify macro trends for the future.", "vi": "dự báo xu hướng"}, {"t": "Historical time / space", "d": "What happened at the same time / in other places.", "vi": "thời gian / không gian lịch sử"}, {"t": "Primary source", "d": "Original material, direct evidence (e.g. Le Corbusier's original drawings).", "vi": "nguồn sơ cấp (gốc)"}, {"t": "Secondary source", "d": "Interprets, analyses or critiques primary sources.", "vi": "nguồn thứ cấp"}], "s12": [{"t": "Grounded theory", "d": "Develops theory directly from the data, inductively, not from an existing framework (Glaser & Strauss).", "vi": "lý thuyết nền (lý thuyết rút ra từ dữ liệu)"}, {"t": "Inductive", "d": "Building theory up from the data.", "vi": "quy nạp"}, {"t": "Open coding", "d": "Breaking raw data into codes and labelling them.", "vi": "mã hóa mở"}, {"t": "Axial coding", "d": "Finding links between codes to form categories.", "vi": "mã hóa trục"}, {"t": "Selective coding", "d": "Combining categories into a storyline → theory.", "vi": "mã hóa chọn lọc"}, {"t": "Coding order", "d": "Open → Axial → Selective.", "vi": "thứ tự mã hóa"}, {"t": "9 hallmarks of good qualitative research", "d": "Purpose, Disclosure, Rigor, Open-mindedness, Completeness, Coherence, Persuasiveness, Usefulness, Consensus.", "vi": "9 dấu hiệu của nghiên cứu định tính tốt"}], "s13": [{"t": "Quantitative research (definition)", "d": "Empirical research using numerical data: experimentation, objective observation, statistics.", "vi": "nghiên cứu định lượng (định nghĩa)"}, {"t": "External validity", "d": "Results apply to the real world (field study).", "vi": "giá trị ngoại tại (áp dụng ra thực tế)"}, {"t": "Internal validity", "d": "Cause and effect can be isolated (controlled lab).", "vi": "giá trị nội tại (xác định nhân quả)"}, {"t": "Sampling", "d": "Selecting participants from a larger population.", "vi": "chọn mẫu"}, {"t": "Population", "d": "The whole group the study wants to generalise to.", "vi": "tổng thể"}, {"t": "Representative sample", "d": "A sample that reflects the population's characteristics.", "vi": "mẫu đại diện"}, {"t": "Stratification", "d": "Keeping the proportions of key groups in the sample (e.g. 60% women – 40% men).", "vi": "phân tầng"}, {"t": "Random sampling", "d": "Everyone in the population has an equal chance of being selected.", "vi": "chọn mẫu ngẫu nhiên"}, {"t": "Independent variable", "d": "The variable that is manipulated and causes change.", "vi": "biến độc lập (nguyên nhân)"}, {"t": "Dependent variable", "d": "The variable that is measured – it changes in response.", "vi": "biến phụ thuộc (kết quả)"}, {"t": "Experimental study", "d": "Manipulates independent variables to see the effect on dependent variables (cause & effect).", "vi": "nghiên cứu thực nghiệm"}, {"t": "Observational study", "d": "Observes and records without manipulating variables; measures how often and under what conditions.", "vi": "nghiên cứu quan sát"}, {"t": "Survey", "d": "A structured tool with closed questions that collects numerical data.", "vi": "khảo sát"}], "s14": [{"t": "6 steps of a questionnaire", "d": "Define purpose → Prepare questions → Specify sequence → Outline distribution → Decide how to administer → Pre-test & review.", "vi": "6 bước làm bảng hỏi"}, {"t": "Dichotomous question", "d": "Two options (Yes/No).", "vi": "câu hỏi hai lựa chọn"}, {"t": "Single selection", "d": "Choose one category from a predefined list.", "vi": "chọn một"}, {"t": "Checklist / multi-selection", "d": "Choose several answers.", "vi": "chọn nhiều"}, {"t": "Ranking question", "d": "Order items by priority.", "vi": "câu hỏi xếp hạng"}, {"t": "Likert scale", "d": "Strongly disagree → Strongly agree.", "vi": "thang đo Likert (mức độ đồng ý)"}, {"t": "Semantic differential", "d": "A scale between two opposite adjectives (Unpleasant □□□□□ Pleasant).", "vi": "thang đo cặp tính từ đối lập"}, {"t": "Open-ended question", "d": "Free answer; adds qualitative insight.", "vi": "câu hỏi mở"}, {"t": "Leading question", "d": "A question that pushes the respondent toward an answer – avoid it.", "vi": "câu hỏi dẫn dắt"}, {"t": "Pilot testing", "d": "Trying the survey on a small group first.", "vi": "thử nghiệm trước"}, {"t": "Self-selection bias", "d": "Only people who choose to respond are included (online surveys).", "vi": "thiên lệch tự chọn"}], "s15": [{"t": "Lab-based experiment", "d": "Controlled environment, e.g. usability lab with one-way mirror and hidden cameras.", "vi": "thực nghiệm trong phòng lab"}, {"t": "Data cleaning", "d": "Fixing missing values, duplicates and outliers.", "vi": "làm sạch dữ liệu"}, {"t": "Descriptive statistics", "d": "Describe the data: mean, median, mode.", "vi": "thống kê mô tả"}, {"t": "Mean / Median / Mode", "d": "Average / middle value / most frequent value.", "vi": "trung bình / trung vị / yếu vị"}, {"t": "Inferential statistics", "d": "Generalise from a sample to a population: t-test, ANOVA.", "vi": "thống kê suy luận"}, {"t": "Correlation", "d": "A statistical relationship between two variables.", "vi": "tương quan"}, {"t": "Quantitative hallmark", "d": "Observation → Research question → Hypothesis → Prediction → Test → Negative/Positive results.", "vi": "quy trình 7 bước định lượng"}], "s16": [{"t": "Visual research (definition)", "d": "The study and interpretation of IMAGES, FORMS and OBJECTS in visual and material culture.", "vi": "nghiên cứu hình ảnh (định nghĩa)"}, {"t": "Visual culture", "d": "The role of images in everyday life; visual literacy (Mirzoeff).", "vi": "văn hóa thị giác"}, {"t": "Material culture", "d": "The social relationship between people and objects (Woodward).", "vi": "văn hóa vật chất"}, {"t": "Visual connoisseurship", "d": "'Good Eye' principle – judging with a trained, intuitive eye.", "vi": "thẩm định hình ảnh bằng con mắt chuyên gia"}, {"t": "Compositional interpretation", "d": "Describing visual elements precisely with correct terminology; ignores social ways of seeing.", "vi": "diễn giải bố cục"}, {"t": "Content analysis", "d": "Quantitative: counting and adding up occurrences in images/texts; suits mass media.", "vi": "phân tích nội dung (đếm)"}, {"t": "Semiotics", "d": "Interpretive study of how signs/images create meaning within wider systems of meaning.", "vi": "ký hiệu học"}, {"t": "Sign / Object / Interpretant", "d": "Peirce: the sign stands for an object and produces a meaning (interpretant) in the viewer.", "vi": "ký hiệu / đối tượng / nghĩa diễn giải"}, {"t": "Icon", "d": "A sign based on visual resemblance.", "vi": "biểu tượng giống hình"}, {"t": "Index", "d": "A sign with a direct connection to its object (smoke → fire, footprints).", "vi": "chỉ dấu (liên hệ trực tiếp)"}, {"t": "Symbol", "d": "A sign whose meaning is cultural/conventional.", "vi": "biểu trưng (quy ước văn hóa)"}, {"t": "Denotation", "d": "The literal meaning of a sign.", "vi": "nghĩa đen"}, {"t": "Connotation", "d": "The implied, associated meaning of a sign.", "vi": "nghĩa hàm ẩn"}, {"t": "Capitalist realism", "d": "Advertising's idealised picture of reality (Schudson).", "vi": "chủ nghĩa hiện thực tư bản"}, {"t": "Product-information format", "d": "Ad that explains the product and its use (early 20th century).", "vi": "quảng cáo thông tin sản phẩm"}, {"t": "Product-image format", "d": "Ad that places the product in a symbolic context.", "vi": "quảng cáo hình ảnh sản phẩm"}, {"t": "Personalized format", "d": "Ad where people are the focus (admiration, pride, anxiety).", "vi": "quảng cáo cá nhân hóa"}, {"t": "Lifestyle format", "d": "Ad that balances person–product–setting to show a desirable lifestyle.", "vi": "quảng cáo phong cách sống"}], "s17": [{"t": "Basic research", "d": "Driven by curiosity; asks 'Is it true?'; goal: understanding.", "vi": "nghiên cứu cơ bản"}, {"t": "Applied research (vs basic)", "d": "Solves problems; asks 'Does it work?'; goal: a solution.", "vi": "nghiên cứu ứng dụng (so với cơ bản)"}, {"t": "Tacit knowledge", "d": "Unwritten practical know-how of a profession.", "vi": "kiến thức ngầm"}, {"t": "Practice-based research", "d": "'Original investigation… to gain new knowledge partly by means of practice and the outcomes of that practice' – the artefact is the basis (Candy).", "vi": "nghiên cứu dựa trên thực hành (sản phẩm là trung tâm)"}, {"t": "Practice-led research", "d": "'Concerned with the nature of practice' – leads to new knowledge about the practice itself (Candy).", "vi": "nghiên cứu dẫn dắt bởi thực hành (về chính cách làm)"}, {"t": "Action research", "d": "Simultaneously investigates and solves an issue; practitioners reflect during and after their work.", "vi": "nghiên cứu hành động"}, {"t": "Action research cycle", "d": "Planning → Acting → Observing → Reflecting (spiral).", "vi": "chu trình nghiên cứu hành động"}, {"t": "Co-design", "d": "Designers and end users design together; originated in architecture.", "vi": "đồng thiết kế"}, {"t": "Participatory / Democratic research", "d": "Everyone takes part / everyone is equal; the researcher is a facilitator of change.", "vi": "nghiên cứu có sự tham gia / dân chủ"}], "s52": [{"t": "User-Centered Design (UCD)", "d": "Empirical, human-centred research where users are involved throughout the process.", "vi": "thiết kế lấy người dùng làm trung tâm"}, {"t": "User Experience Design (UXD)", "d": "A core part of UCD covering every interaction with a product, service or environment; test–feedback–iterate even after launch.", "vi": "thiết kế trải nghiệm người dùng"}, {"t": "Qualitative = 'why'", "d": "Rich, contextual data explaining reasons.", "vi": "định tính = 'tại sao'"}, {"t": "Quantitative = 'what'", "d": "Numbers with statistical value.", "vi": "định lượng = 'cái gì'"}, {"t": "Breakthrough innovation", "d": "A new, superior product creating a new market category (first iPhone).", "vi": "đổi mới đột phá"}, {"t": "Incremental innovation", "d": "Continuous improvement of existing products (UI updates from feedback).", "vi": "đổi mới cải tiến dần"}, {"t": "Disruptive innovation", "d": "Simple, cheap solutions that turn non-consumers into consumers (Airbnb vs hotels).", "vi": "đổi mới phá vỡ"}, {"t": "A/B testing", "d": "Comparing two versions to see which performs better.", "vi": "thử nghiệm A/B"}], "people": [{"t": "John W. Best", "d": "Defined research as a formal, systematic and intensive process of applying the scientific method.", "ls": "s01"}, {"t": "Muratovski", "d": "Author of the course textbook Research for Designers (2nd ed., 2022).", "ls": "s01"}, {"t": "Creswell", "d": "Author of Research Design (reference book).", "ls": "s01"}, {"t": "Dieter Rams", "d": "'You cannot understand good design, if you do not understand people.'", "ls": "s02"}, {"t": "Mies van der Rohe", "d": "Barcelona Chair – example of design as a 'functional form of art'.", "ls": "s02"}, {"t": "Marcel Breuer", "d": "Wassily Chair – another 'functional form of art'.", "ls": "s02"}, {"t": "Thonet (No.14 chair)", "d": "Steam-bent chair of the 1st industrial revolution (mechanised production).", "ls": "s02"}, {"t": "Peter Behrens", "d": "Electric kettle, 1909 – 2nd industrial revolution ('new technology in old clothes').", "ls": "s02"}, {"t": "Heuer (1999)", "d": "Analysts do not start with an empty mind – they always carry assumptions.", "ls": "s02"}, {"t": "McKinsey", "d": "400–800 million people could lose jobs to automation by 2030; over half need reskilling.", "ls": "s02"}, {"t": "Owen (1989)", "d": "Early designers contributed artistically, decoratively and constructively to mass products.", "ls": "s03"}, {"t": "Raymond Loewy", "d": "'Father of Industrial Design' / 'Father of Streamlining'; 1934 Sears Coldspot refrigerator.", "ls": "s03"}, {"t": "Henry Dreyfuss", "d": "Hoover Model 150 vacuum cleaner; New York Central Hudson locomotive.", "ls": "s03"}, {"t": "Leonardo da Vinci", "d": "Renaissance: art and science were not separated.", "ls": "s03"}, {"t": "Tim Brown (IDEO)", "d": "Design thinking = human-centred innovation integrating people's needs, technology and business success.", "ls": "s03"}, {"t": "Dan Formosa (Smart Design)", "d": "Design thinking = a new way of solving problems based on innovation and research.", "ls": "s03"}, {"t": "Children's IKEA", "d": "Design-driven research example: worked with child-development & safety experts.", "ls": "s03"}, {"t": "Leedy & Ormrod (2010)", "d": "Hypothesis = 'a logical supposition, a reasonable guess, an educated conjecture'.", "ls": "s04"}, {"t": "John S. Stevens (2009)", "d": "Design as a Strategic Resource – example research statement (unify design management & business strategy).", "ls": "s04"}, {"t": "Kristen Larson", "d": "Listed the risks to research participants (coercion, deception, stress, loss of privacy…).", "ls": "s05"}, {"t": "Raymond Madden (2010)", "d": "Ethnography = in-depth, systematic study of groups by observing or participating in their lives.", "ls": "s07"}, {"t": "Reeves et al. (2008)", "d": "Auto-ethnography: the researcher's own thoughts and perspectives are central.", "ls": "s07"}, {"t": "Kitchen Stories (2003)", "d": "Film used as the example of an observer in ethnography.", "ls": "s07"}, {"t": "Peta Wyeth & Carla Diercke", "d": "Cultural probes with children (Univ. of Queensland).", "ls": "s08"}, {"t": "Bill Gaver, Tony Dunne, Elena Pacenti", "d": "Cultural probes with elderly people (postcards, maps, cameras, media diary).", "ls": "s08"}, {"t": "François-X. N.I. Nsenga", "d": "Decolonizing design in Africa (bonus reading).", "ls": "s09"}, {"t": "Edmund Husserl", "d": "Father of phenomenology (Logical Investigations, 1900–01).", "ls": "s11"}, {"t": "Martin Heidegger", "d": "Husserl's student; extended phenomenology to interpreting human existence.", "ls": "s11"}, {"t": "Leedy & Ormrod (2010)", "d": "Phenomenology = understanding participants' perspectives on social realities.", "ls": "s11"}, {"t": "Huppatz & Lees-Maffei", "d": "Design history: Who are we? Where do we come from? Where are we going?", "ls": "s11"}, {"t": "Mini (BMC)", "d": "Historical-time example: shaped by the 1956 Suez Canal crisis fuel shortage.", "ls": "s11"}, {"t": "Le Corbusier", "d": "His original drawings/models = example of primary sources.", "ls": "s11"}, {"t": "Barney Glaser & Anselm Strauss", "d": "Developed grounded theory while studying terminally ill patients.", "ls": "s12"}, {"t": "Adele Clarke", "d": "'…we get to delight in discovering more questions.' (grounded theory)", "ls": "s12"}, {"t": "Michael Bury", "d": "Chronic Illness as Biographical Disruption – grounded theory example.", "ls": "s12"}, {"t": "Margaret Mead & Gregory Bateson", "d": "Trance and Dance in Bali – photos as ethnographic observation.", "ls": "s16"}, {"t": "Berger (1972)", "d": "Society is dominated by images and objects; how we see is shaped by knowledge & beliefs.", "ls": "s16"}, {"t": "Mirzoeff (1999)", "d": "Visual culture – the role of images; visual literacy.", "ls": "s16"}, {"t": "Woodward (2007)", "d": "Material culture – the social relationship between people and objects.", "ls": "s16"}, {"t": "Gillian Rose (2012)", "d": "'Images, forms, and objects are not always self-explanatory.' Critical questions for visual analysis.", "ls": "s16"}, {"t": "Jean Kilbourne", "d": "Killing Us Softly – gender stereotypes in advertising.", "ls": "s16"}, {"t": "Tanner Higgin", "d": "Gamic Race – erasure of Black characters / Eurocentrism in MMORPGs.", "ls": "s16"}, {"t": "Katy Parry", "d": "Content analysis of British press photos of the 2003 Iraq invasion.", "ls": "s16"}, {"t": "Charles Sanders Peirce", "d": "Semiotics: Sign–Object–Interpretant; Icon, Index, Symbol.", "ls": "s16"}, {"t": "Grant Wood", "d": "American Gothic (1930) – semiotics example.", "ls": "s16"}, {"t": "Sargent", "d": "Siesta (1907) – compositional interpretation example.", "ls": "s16"}, {"t": "Terry Barrett (1994, 2000)", "d": "Principles of interpretation: many competing interpretations; judged by coherence, correspondence, inclusiveness.", "ls": "s16"}, {"t": "Schudson (1993)", "d": "Advertising sells consumption as a way of life; 'capitalist realism'.", "ls": "s16"}, {"t": "Leiss et al. (1997)", "d": "4 ad formats: product-information, product-image, personalized, lifestyle.", "ls": "s16"}, {"t": "Jhally; Jowett & O'Donnell", "d": "Advertising = the most powerful propaganda system in history.", "ls": "s16"}, {"t": "Linda Candy (2006)", "d": "Defined practice-based and practice-led research.", "ls": "s17"}, {"t": "Meyer (2000)", "d": "Applied/action research is collaborative and cyclical.", "ls": "s17"}, {"t": "Burns (2000)", "d": "Applied research is validated through practice.", "ls": "s17"}, {"t": "Nashville Youth Design Team (NYDT)", "d": "Dream City Workshop – co-design example with young people.", "ls": "s17"}]};
const MT = {"methods": [{"n": "Ethnographic research", "g": "The 5 approaches", "ls": "s07", "one": "Studies a GROUP of people by observing or living alongside them in their own setting.", "ask": "How does this group/community live, behave and think – what is their culture?", "use": "You need a holistic understanding of a culture, subculture or organisation and its unspoken, unmet needs.", "how": "Fieldwork: participant observation, informal interviews, field notes, cultural probes, photos/video. Researcher enters the same social space and does not control it. Traditionally 12–18 months; today often 'step-in-step-out'.", "spot": ["a group / community / tribe / team / organisation culture", "fieldwork, living with, joining daily activities", "gatekeeper, key informant, rapport", "field notes, cultural probes", "'the core of human-centred design'"], "vs": "Phenomenology studies INDIVIDUALS' lived experience; ethnography studies GROUPS. Becoming a member and losing objectivity is NOT ethnography (over-integrated).", "ppl": "Raymond Madden (2010) definition · Reeves et al. (2008) auto-ethnography · Kitchen Stories (film example)", "vi": "nghiên cứu dân tộc học"}, {"n": "Qualitative research", "g": "The 5 approaches", "ls": "s10", "one": "Explores HOW and WHY people experience something, in depth, with words/images rather than numbers.", "ask": "Why do people do/feel this? What is it like? What is really going on?", "use": "Little is known, variables are unknown, or theory is missing; you need a rich picture of a complex situation.", "how": "Open-ended questions, in natural settings, small samples, collecting and analysing at the same time (iterative). Methods: interviews, focus groups, participant observation, document analysis. Frameworks: case study, phenomenology, historical research, grounded theory.", "spot": ["why / how / meaning / feelings / motivations", "small sample, in-depth interviews, focus group", "open-ended questions", "no theory yet, unknown variables", "builds new theory"], "vs": "Quantitative = numbers, large samples, tests EXISTING theory. Qualitative = words, small samples, BUILDS new theory. Qualitative = 'why', quantitative = 'what'.", "ppl": "Frameworks: case study · phenomenology (Husserl) · historical · grounded theory (Glaser & Strauss)", "vi": "nghiên cứu định tính"}, {"n": "Quantitative research", "g": "The 5 approaches", "ls": "s13", "one": "Measures things with NUMBERS on large samples to describe, generalise and test cause and effect.", "ask": "How many / how often / how much? Does X cause Y? Is the theory true?", "use": "You want to test/verify an existing theory or hypothesis and generalise to a large population.", "how": "Surveys (closed questions, Likert), experiments (manipulate independent variable, measure dependent variable), structured observation; random/representative sampling; statistics (mean, median, mode, t-test, ANOVA). Objective, independent of the researcher.", "spot": ["numbers, statistics, percentages, measure", "large / random / representative sample", "hypothesis testing, cause and effect", "survey with Likert scale, A/B test", "generalise to the population"], "vs": "Does NOT create new theory – it verifies existing theory. Field study = external validity; lab = internal validity.", "ppl": "Leedy & Ormrod: hypothesis = 'an educated conjecture'", "vi": "nghiên cứu định lượng"}, {"n": "Visual research", "g": "The 5 approaches", "ls": "s16", "one": "Analyses images, forms and objects that ALREADY EXIST ('found' material) to find patterns and meaning.", "ask": "What does this image/object mean, how was it made, who sees it and how?", "use": "Your data is visual or material culture: ads, logos, posters, photos, films, products, architecture.", "how": "4 methods: visual connoisseurship ('Good Eye'), compositional interpretation, content analysis (counting), semiotics (signs). Can be combined with qual or quant.", "spot": ["images, ads, logos, posters, magazines, film stills", "'found' images and objects", "icon / index / symbol, denotation / connotation", "counting how often something appears in media"], "vs": "Visual research analyses images that already exist; participatory visual research / cultural probes ask participants to CREATE images (ethnography).", "ppl": "Berger (1972) · Mirzoeff (visual culture) · Woodward (material culture) · Gillian Rose · Peirce · Kilbourne · Katy Parry", "vi": "nghiên cứu hình ảnh"}, {"n": "Applied research", "g": "The 5 approaches", "ls": "s17", "one": "Practitioners investigate and evaluate THEIR OWN work to find practical solutions ('inner-directed').", "ask": "Does it work? How can I improve my own practice?", "use": "You are a designer studying your own design process or artefact to solve a real problem.", "how": "Practice-based (the artefact is the basis), practice-led (new knowledge about the practice itself), action research (plan → act → observe → reflect cycle), co-design with users.", "spot": ["my own work / my own practice / my studio", "'Does it work?' rather than 'Is it true?'", "artefact, prototype, design outcome as research", "reflect during and after the work"], "vs": "Basic research = curiosity, 'Is it true?', understanding. Applied = solving problems, 'Does it work?'. The other 4 approaches are outer-directed; applied is inner-directed.", "ppl": "Linda Candy (2006) practice-based/led · Meyer (2000) · Burns (2000)", "vi": "nghiên cứu ứng dụng"}, {"n": "Case study", "g": "Qualitative frameworks", "ls": "s10", "one": "An in-depth study of ONE (or a few) complex case – person, group, place, event, organisation – in a defined time and context, using MULTIPLE data sources.", "ask": "What is happening in this specific case, and why?", "use": "'If it's messy, complex and hard to understand… it's perfect for a case study.'", "how": "Define RQ → select case(s) → collect data from many sources (interviews, observation, archival records, documentation, surveys…) → analyse → report. Keep a database and a chain of evidence. Types: exploratory, descriptive, explanatory, instrumental, intrinsic, comparative.", "spot": ["one company / one project / one event studied in depth", "multiple sources of evidence", "archival records, documentation", "exploratory / descriptive / explanatory"], "vs": "Exploratory = starting point · Descriptive = full description · Explanatory = cause and effect · Instrumental = case used to understand a wider issue · Intrinsic = the case itself is the interest · Comparative = several cases compared.", "ppl": "Example: wolves reintroduced to Yellowstone", "vi": "nghiên cứu tình huống"}, {"n": "Phenomenology", "g": "Qualitative frameworks", "ls": "s11", "one": "Studies INDIVIDUALS' lived experience of a phenomenon – 'What is it like to…?'", "ask": "What is it like to do or experience something (caring for the elderly, living in social housing, using an iPad)?", "use": "You want participants' own perspective and feelings about an experience.", "how": "Purposeful sampling of people with direct experience (small sample, snowball). In-depth interviews (also focus groups, oral history) until saturation. Analysis: segmentation → categorisation → comparison → description. Find the 'essence'.", "spot": ["'what is it like…'", "lived experience, essence, subjectivity", "individuals' perspectives", "in-depth interview until saturation"], "vs": "Ethnography = groups and culture; phenomenology = individuals and experience. The researcher stays neutral.", "ppl": "Edmund Husserl (founder) · Martin Heidegger · Leedy & Ormrod (2010)", "vi": "hiện tượng học"}, {"n": "Historical research", "g": "Qualitative frameworks", "ls": "s11", "one": "Interprets past and present events and trends ('currents and counter-currents') to explain the present and anticipate the future.", "ask": "How did this come to be? What caused it? Where is it going?", "use": "Design history (looking back) or trend forecasting (looking forward).", "how": "Contextual, chronological and comparative analysis; look at 'historical time' (what happened at the same time) and 'historical space' (elsewhere). Primary vs secondary sources. Analysis: explain context → establish validity of facts → identify causation & motives.", "spot": ["past events, archives, old designs", "primary vs secondary sources", "design history, trend forecasting, macro trends", "'Who are we? Where do we come from? Where are we going?'"], "vs": "Primary source = original material (Le Corbusier's drawings). Secondary = interpretation/critique of it.", "ppl": "Huppatz & Lees-Maffei (design history) · Mini (BMC) & 1956 Suez crisis example", "vi": "nghiên cứu lịch sử"}, {"n": "Grounded theory", "g": "Qualitative frameworks", "ls": "s12", "one": "Builds a NEW THEORY directly from the data, inductively – no hypothesis at the start.", "ask": "What theory explains what is happening here?", "use": "No existing theory fits; you want to discover one from the data. Suits transdisciplinary research.", "how": "Collect → analyse → theory, repeated in many cycles until saturation. Coding: Open (label) → Axial (link codes into categories) → Selective (storyline → theory). Collection and analysis happen simultaneously.", "spot": ["theory emerges from the data", "inductive", "open / axial / selective coding", "no hypothesis at the start"], "vs": "Non-grounded research starts with a hypothesis; grounded research starts with data. Criticised as 'washy-wishy' for ignoring existing literature.", "ppl": "Barney Glaser & Anselm Strauss (terminally ill patients) · Adele Clarke · Michael Bury", "vi": "lý thuyết nền (lý thuyết rút ra từ dữ liệu)"}, {"n": "Survey / questionnaire", "g": "Quantitative methods", "ls": "s14", "one": "A structured set of mostly closed questions given to many people to collect numerical data.", "ask": "How many people think/do X? How strongly do they agree?", "use": "You need data from a large sample that can be counted and compared.", "how": "6 steps: purpose → questions → sequence → distribution → how to administer → pre-test. Question types: dichotomous, single selection, checklist, ranking, scale (Likert, semantic differential), open-ended. Face-to-face, remote, written or online.", "spot": ["questionnaire, Likert, rating scale", "large number of respondents", "closed questions", "pilot test, response rate"], "vs": "Structured interview ≈ spoken survey (quantitative). Open-ended questions inside a survey add qualitative insight.", "ppl": "", "vi": "khảo sát / bảng hỏi"}, {"n": "Experimental study", "g": "Quantitative methods", "ls": "s15", "one": "Manipulates an INDEPENDENT variable and measures the effect on a DEPENDENT variable to prove cause and effect.", "ask": "Does changing X cause a change in Y?", "use": "You need to test a hypothesis about cause and effect.", "how": "Lab-based (controlled: usability lab, one-way mirror, hidden cameras) or real-world (field, e.g. VR testing). A/B testing is a simple experiment.", "spot": ["manipulate, control group, A/B test", "cause and effect", "independent vs dependent variable", "usability lab"], "vs": "Observational study does NOT manipulate anything. Independent variable = the cause you change; dependent = the effect you measure.", "ppl": "", "vi": "nghiên cứu thực nghiệm"}, {"n": "Observational study (quantitative)", "g": "Quantitative methods", "ls": "s15", "one": "Systematically observes and records behaviour WITHOUT manipulating variables, counting how often and under what conditions.", "ask": "How often does this happen, and when?", "use": "You want objective, countable behaviour data in a natural or controlled setting.", "how": "Structured counting, eye-tracking, heatmaps, Google Analytics.", "spot": ["records how often", "no manipulation", "eye-tracking, heatmap, analytics"], "vs": "Ethnographic observation is qualitative and interpretive; quantitative observation counts and measures.", "ppl": "", "vi": "nghiên cứu quan sát (định lượng)"}, {"n": "Visual connoisseurship", "g": "Visual research methods", "ls": "s16", "one": "Judging an image with a trained, intuitive 'Good Eye'.", "ask": "Who commissioned it, why, who made it, how was it used, who used it?", "use": "Expert appreciation of artworks/design pieces.", "how": "Expert looking based on experience and knowledge of the field.", "spot": ["'Good Eye' principle", "trained, intuitive eye", "expert judgement"], "vs": "Compositional interpretation describes elements with precise terms; connoisseurship relies on expert intuition.", "ppl": "Example: looking at Guernica", "vi": "thẩm định hình ảnh bằng con mắt chuyên gia"}, {"n": "Compositional interpretation", "g": "Visual research methods", "ls": "s16", "one": "Describing an image's visual elements precisely using correct terminology.", "ask": "What is in the image and how is it composed (content, colour, space, light, movement, technique)?", "use": "Formal analysis of how an image is built.", "how": "Systematic description of composition. Limitation: ignores the social ways of seeing.", "spot": ["colour, space, light, composition", "correct terminology", "formal description"], "vs": "It ignores social context – that is its main weakness.", "ppl": "Sargent's Siesta (1907) · Psycho (1960) · Cinderella (1950)", "vi": "diễn giải bố cục"}, {"n": "Content analysis", "g": "Visual research methods", "ls": "s16", "one": "QUANTITATIVE visual method: counting and adding up occurrences of something in many images/texts.", "ask": "How often do certain images/themes appear across lots of media?", "use": "Large sets of mass media (TV, newspapers, magazines, ads).", "how": "12 steps: RQ → wide reading → choose subject → categories → coding sheet → test → collect → tally → interpret → relate to RQ → present → discuss.", "spot": ["count / frequency / tally", "coding sheet, categories", "many newspaper or magazine images"], "vs": "Content analysis = counting (quantitative). Semiotics = interpreting meaning (qualitative, needs few images).", "ppl": "Katy Parry – British press photos of the 2003 Iraq invasion", "vi": "phân tích nội dung (đếm)"}, {"n": "Semiotics", "g": "Visual research methods", "ls": "s16", "one": "Interpreting how signs and images create meaning within wider cultural systems.", "ask": "What does this sign mean – literally and by implication – and what ideology does it carry?", "use": "Ads, logos, branding; needs few images but deep knowledge.", "how": "Peirce: sign – object – interpretant. Icon (resemblance), index (direct connection, smoke → fire), symbol (cultural convention). 7 steps: identify sign → type → denotation → connotation → context → ideology → cultural insight.", "spot": ["sign, signifier, icon/index/symbol", "denotation vs connotation", "ideology, myth", "logo or ad meaning"], "vs": "Icon looks like it; index is caused by/physically linked to it; symbol is learned by convention.", "ppl": "Charles Sanders Peirce · American Gothic (Grant Wood, 1930)", "vi": "ký hiệu học"}, {"n": "Practice-based research", "g": "Applied research types", "ls": "s17", "one": "New knowledge gained partly THROUGH practice and its outcomes – the creative ARTEFACT is the basis.", "ask": "What can I learn by making this artefact?", "use": "The output (design, performance, exhibition) is central to the research.", "how": "Highly exploratory and creative; can be qual or quant. Example: a BRAND.", "spot": ["artefact is the basis", "creative outcome as evidence", "original investigation through practice"], "vs": "Practice-LED = new knowledge ABOUT the practice itself (e.g. a brand design framework); less concrete.", "ppl": "Linda Candy (2006)", "vi": "nghiên cứu dựa trên thực hành (sản phẩm là trung tâm)"}, {"n": "Practice-led research", "g": "Applied research types", "ls": "s17", "one": "Research concerned with the NATURE OF PRACTICE, leading to new knowledge that improves that practice.", "ask": "What can we learn about how we work?", "use": "You want insights/frameworks about the practice, not a specific artefact.", "how": "Example: a BRAND DESIGN FRAMEWORK.", "spot": ["nature of practice", "operational significance for the practice", "framework, process knowledge"], "vs": "Practice-BASED = the artefact is central.", "ppl": "Linda Candy (2006)", "vi": "nghiên cứu dẫn dắt bởi thực hành (về chính cách làm)"}, {"n": "Action research", "g": "Applied research types", "ls": "s17", "one": "Investigating and solving a problem AT THE SAME TIME, reflecting during and after the work.", "ask": "What am I doing? Do I need to improve? What? How? Why?", "use": "A social practice needs to change; participants are involved.", "how": "Spiral cycle: plan → act → observe → reflect (systematic and documented). Participatory, democratic, contributes to social change. No clear hypothesis needed at the start.", "spot": ["cycle / spiral of plan-act-observe-reflect", "improve existing practice", "participatory, change"], "vs": "It does NOT need to start with a hypothesis or research question – just the idea that practice can improve.", "ppl": "Meyer (2000) · Burns (2000)", "vi": "nghiên cứu hành động"}, {"n": "Co-design", "g": "Applied research types", "ls": "s17", "one": "Designers and end users design TOGETHER as equal partners.", "ask": "What do the people affected actually want, designed with them?", "use": "Community, public or architectural projects where users should shape the result.", "how": "Participatory (trust, everyone engaged), democratic (all equal, researcher = facilitator of change), results fed back to participants.", "spot": ["users design with designers", "facilitator of change", "workshop with the community"], "vs": "Originated in architectural design, unlike rigid top-down urban planning.", "ppl": "Dream City Workshop – Nashville Youth Design Team (NYDT)", "vi": "đồng thiết kế"}, {"n": "Triangulation / multimethod", "g": "Cross-cutting ideas", "ls": "s05", "one": "Cross-checking several sources, researchers, theories or methods so findings are credible, valid and reliable.", "ask": "Do different kinds of evidence agree?", "use": "Whenever you want stronger, more trustworthy findings.", "how": "4 types: data, investigator, theory, methodological. Methodological triangulation = multimethod/mixed methods (qual finds the problem, quant tests it, or the reverse).", "spot": ["multiple sources of evidence", "mixed methods, qual + quant", "credible, valid, reliable"], "vs": "Triangulation is about CHECKING evidence; multimethod is the methodological type of triangulation.", "ppl": "", "vi": "kiểm chứng chéo / đa phương pháp"}, {"n": "UCD & UX research", "g": "Cross-cutting ideas", "ls": "s52", "one": "User-Centred Design: users involved throughout; combines qual ('why') + quant ('what').", "ask": "What do users need, and does the design work for them?", "use": "Product/service/digital design with continuous testing and iteration.", "how": "Multidisciplinary team → problem identification → prototyping (low → high fidelity) → observation & usability testing → review & iterate, even after launch.", "spot": ["usability testing, prototype, iterate", "personas, user journeys", "A/B testing, usage metrics"], "vs": "Breakthrough (new category, first iPhone) vs incremental (continuous improvements) vs disruptive (simple, cheap, non-consumers → consumers, Airbnb).", "ppl": "", "vi": "nghiên cứu UCD & UX"}], "drill": [{"s": "A researcher spends four months working in a small fishing village, joining the fishermen's daily routine and keeping detailed field notes about their customs.", "a": "Ethnographic research", "o": ["Phenomenology", "Ethnographic research", "Grounded theory", "Content analysis"]}, {"s": "A study asks ten carers in depth what it feels like, day to day, to look after a parent with dementia.", "a": "Phenomenology", "o": ["Phenomenology", "Case study", "Survey", "Action research"]}, {"s": "A team collects interview data with no starting hypothesis, codes it, links the codes into categories and finally proposes a new explanation of how freelancers choose clients.", "a": "Grounded theory", "o": ["Historical research", "Grounded theory", "Experimental study", "Semiotics"]}, {"s": "A designer studies how the 1956 Suez crisis influenced the compact shape of a famous small car.", "a": "Historical research", "o": ["Historical research", "Ethnographic research", "Practice-led research", "Content analysis"]}, {"s": "An agency examines one hospital's redesign project in depth, using interviews, meeting minutes, floor plans and patient feedback.", "a": "Case study", "o": ["Case study", "Survey", "Phenomenology", "Visual connoisseurship"]}, {"s": "2,000 students rate their satisfaction with the campus app on a 1–5 scale and the results are analysed statistically.", "a": "Survey (quantitative)", "o": ["Survey (quantitative)", "Focus group", "Grounded theory", "Co-design"]}, {"s": "Two versions of a checkout button are shown to random users to see which one produces more purchases.", "a": "Experimental study (A/B test)", "o": ["Observational study", "Experimental study (A/B test)", "Case study", "Semiotics"]}, {"s": "Researchers use eye-tracking to record how often shoppers look at each shelf, without changing anything in the store.", "a": "Observational study (quantitative)", "o": ["Experimental study", "Observational study (quantitative)", "Action research", "Ethnographic research"]}, {"s": "A researcher counts how many magazine covers from 2010–2020 show women in domestic roles.", "a": "Content analysis", "o": ["Semiotics", "Content analysis", "Compositional interpretation", "Phenomenology"]}, {"s": "An analysis explains how a luxury perfume ad uses gold colours and a crown to suggest royalty and status.", "a": "Semiotics", "o": ["Content analysis", "Semiotics", "Survey", "Grounded theory"]}, {"s": "Smoke in a poster is read as a sign that there is fire.", "a": "Index", "o": ["Icon", "Index", "Symbol", "Connotation"]}, {"s": "A red cross meaning 'medical help' is understood only because of cultural convention.", "a": "Symbol", "o": ["Icon", "Index", "Symbol", "Denotation"]}, {"s": "A designer creates a series of experimental typefaces and treats the typefaces themselves as the main research outcome.", "a": "Practice-based research", "o": ["Practice-based research", "Practice-led research", "Historical research", "Survey"]}, {"s": "A studio studies its own way of working and produces a new framework for running brand projects.", "a": "Practice-led research", "o": ["Practice-based research", "Practice-led research", "Content analysis", "Case study"]}, {"s": "A teacher repeatedly plans a new class activity, tries it, observes the students and reflects before adjusting it again.", "a": "Action research", "o": ["Action research", "Grounded theory", "Experimental study", "Phenomenology"]}, {"s": "Teenagers and designers work together as equals in workshops to plan their ideal city park.", "a": "Co-design", "o": ["Co-design", "Visual connoisseurship", "Survey", "Historical research"]}, {"s": "A researcher combines interviews with a large questionnaire so that each source checks the other.", "a": "Triangulation (multimethod)", "o": ["Triangulation (multimethod)", "Phenomenology", "Grounded theory", "Semiotics"]}, {"s": "Little is known about a new behaviour, there is no theory yet and the variables are unclear.", "a": "Qualitative research", "o": ["Quantitative research", "Qualitative research", "Experimental study", "Content analysis"]}, {"s": "A researcher wants to verify an existing theory and generalise the result to the whole population.", "a": "Quantitative research", "o": ["Qualitative research", "Quantitative research", "Phenomenology", "Co-design"]}, {"s": "A study is done in users' real homes rather than in a lab so the results apply to real life.", "a": "External validity (field study)", "o": ["Internal validity (lab)", "External validity (field study)", "Saturation", "Triangulation"]}, {"s": "Participants are given postcards, maps, disposable cameras and diaries to record their everyday lives.", "a": "Cultural probes", "o": ["Cultural probes", "Content analysis", "Survey", "Semiotics"]}, {"s": "Interviews continue until new participants only repeat what earlier participants said.", "a": "Saturation", "o": ["Triangulation", "Saturation", "Stratification", "Delimitation"]}, {"s": "A sample keeps 60% women and 40% men because that matches the population.", "a": "Stratification", "o": ["Random sampling", "Stratification", "Snowball sampling", "Purposeful sampling"]}, {"s": "Each participant introduces the researcher to other people who share the same experience.", "a": "Snowball sampling", "o": ["Stratification", "Snowball sampling", "Random sampling", "Structured interview"]}, {"s": "The researcher knows who each participant is but never reveals their identity in the report.", "a": "Confidentiality", "o": ["Anonymity", "Confidentiality", "Debriefing", "Deception"]}, {"s": "An online survey collects no names, emails or IDs, so even the researcher cannot identify anyone.", "a": "Anonymity", "o": ["Confidentiality", "Anonymity", "Informed consent", "Debriefing"]}, {"s": "After an experiment that hid its true aim, the researcher explains the real purpose to participants.", "a": "Debriefing", "o": ["Deception", "Debriefing", "Informed consent", "Beneficence"]}, {"s": "A researcher removes the data that did not support the hypothesis and does not mention it.", "a": "Elimination of data", "o": ["Data fabrication", "Elimination of data", "Exploitation of data", "Plagiarism"]}, {"s": "A report claims its small pilot study 'proves' a product will succeed worldwide.", "a": "Exploitation of data", "o": ["Data fabrication", "Elimination of data", "Exploitation of data", "Plagiarism"]}, {"s": "The study pauses because its risks to participants are no longer justified by its benefits.", "a": "Beneficence", "o": ["Justice", "Beneficence", "Respect", "Research merit & integrity"]}, {"s": "A company launches a cheap, simple service that turns people who never used hotel
