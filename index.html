quire more specialized manufacturing skills", "Emerging workplaces demand new and adaptable competencies", "Traditional education emphasizes technological knowledge over collaboration", "Current employment systems prioritize standardized learning outcomes"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 153, "q": "What was the primary purpose of traditional standardized education?", "options": ["Preparing workers for repetitive and process-oriented manufacturing", "Developing creativity through personalized learning experiences", "Supporting global citizenship through interdisciplinary educational programs", "Encouraging independent research across emerging professional fields"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 154, "q": "How have the Industrial Revolutions influenced educational requirements?", "options": ["Reduced the importance of professional competencies", "Increased demand for traditional manufacturing knowledge", "Introduced new skills required by workplaces", "Standardized learning methods across every industry"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 155, "q": "What does Education 4.0 primarily seek to address?", "options": ["The historical importance of standardized educational structures", "The changing skills required in contemporary workplaces", "The expansion of traditional manufacturing employment opportunities", "The replacement of interpersonal learning with technical instruction"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 157, "q": "Which educational shift supports lifelong career development in the Industry 4.0 era?", "options": ["From teaching students what to memorize to teaching them how to learn", "From practical projects to lecture-only instruction", "From interdisciplinary work to narrow specialization", "From research-based learning to fixed routines"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 158, "q": "Which two abilities are presented as foundational skills for future learners?", "options": ["Typing speed and numerical memorization", "Critical thinking and creative thinking", "Manual production and repetitive practice", "Advertising and sales forecasting"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 159, "q": "How are critical and creative thinking best developed?", "options": ["By reading definitions without application", "By avoiding unfamiliar problems", "By doing and practising them in real activities", "By following one fixed method for every task"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 160, "q": "Why can fieldwork research be useful for students?", "options": ["It removes the need to ask questions", "It guarantees a predetermined design outcome", "It keeps students within one discipline", "It helps develop both critical and creative thinking"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 161, "q": "What can happen when specialists rely too heavily on established mind-sets?", "options": ["They may miss the significance of unexpected changes", "They automatically become more objective", "They need less evidence to make decisions", "They always adapt faster than non-specialists"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 162, "q": "In intelligence analysis, who may have the most to unlearn during a major paradigm shift?", "options": ["People with no previous knowledge", "People who know the most about the subject", "Only junior researchers", "Only people outside the field"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "no andard asks whether another point of view should be considered?", "options": ["Precision", "Significance", "Accuracy", "Breadth"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 170, "q": "Which standard focuses on whether the most important issue or fact is being addressed?", "options": ["Clarity", "Significance", "Precision", "Relevance"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 171, "q": "What does the standard of fairness encourage a thinker to examine?", "options": ["Whether the answer is the shortest possible", "Whether everyone uses the same method", "Personal interests and whether other viewpoints are represented fairly", "Whether only one discipline is involved"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 172, "q": "Why do the humanities, arts and social sciences remain important in a technology-driven world?", "options": ["They make STEM education unnecessary", "They focus mainly on automation hardware", "They remove the need for digital literacy", "They help develop human-centric leaders and human skills"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 173, "q": "Which set of abilities is associated with stronger human-centric leadership?", "options": ["Critical thinking, empathy, creativity, ethics, and communication", "Repetition, memorization, and routine production", "Mechanical drafting only", "Programming without social understanding"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 174, "q": "What is digital literacy?", "options": ["The ability to use only social media platforms", "The ability to understand and contextualize big data and emerging technologies", "The ability to replace all human judgement with software", "The ability to memorize technical terminology"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 176, "q": "Why are soft skills important when shaping the direction of technology?", "options": ["They eliminate the need for technical knowledge", "They guarantee that all technologies are profitable", "They allow leaders to ignore social consequences", "They help identify human needs and decide what problems technology should solve"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 177, "q": "What trend is seen in the business community, including the technology sector?", "options": ["Growing recognition of the value of humanities, arts, and social sciences", "Complete rejection of non-STEM education", "Declining interest in creativity and questioning", "A shift toward purely routine work"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 178, "q": "Why are human-centred skills expected to support lasting careers in disruptive workplaces?", "options": ["They make workers independent of all technology", "They help people learn, adapt, ask questions, and understand real human needs", "They guarantee a single career path for life", "They reduce the need to work with others"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s52", "extra": true}, {"id": 179, "q": "What type of problems are often described as 'wicked problems' in design?", "options": ["Problems caused only by visual style", "Problems with one obvious technical answer", "Complex, multifaceted problems that resist simple solutions", "Problems that can be solved without understanding people"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 180, "q": "How is the role of some contemporary designers changing?", "options": ["From researchers to purely decorative artists", "From collaborators to isolated technicians", "From problem framers to production-line operators", "From providers of artistic services to strategic planners and professional thinkers"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 181, "q": "What are the two main motives behind a cross-disciplinary education model?", "options": ["Practical results and inspiration for new questions, methods, and frameworks", "Higher grades and shorter class time", "More specialization and fewer collaborations", "Lower research quality and faster production"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 182, "q": "What best describes multidisciplinary design?", "options": ["Different disciplines are fused into one new discipline", "Different disciplines within the same field work alongside one another", "One discipline replaces all others", "Team members avoid sharing any knowledge"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 184, "q": "In the medical-device example, what do healthcare professionals contribute to an interdisciplinary team?", "options": ["Only final approval after the product is complete", "Only visual styling decisions", "A replacement for all design research", "Problem parameters, disciplinary knowledge, and feedback throughout the process"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s04", "extra": true}, {"id": 186, "q": "When is a transdisciplinary approach especially suitable?", "options": ["When a problem has one simple, routine solution", "When no single discipline has enough methods to frame or resolve a complex problem", "When collaboration is unnecessary", "When the project concerns visual styling only"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 187, "q": "What is usually required before a designer can work effectively in a transdisciplinary mode?", "options": ["Only introductory software training", "No discipline-specific knowledge", "Extensive knowledge of research methods and significant experience", "A fixed process that never changes"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 189, "q": "Why is a gradual increase in cross-disciplinary complexity recommended?", "options": ["It allows students to expand their knowledge base as problems become more complex", "It ensures students never leave their original discipline", "It reduces the need for research methods", "It keeps all projects equally simple"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s05", "extra": true}, {"id": 190, "q": "Which short-term formats are mentioned as ways for professionals to expand their knowledge and skills?", "options": ["Only full doctoral programs", "Micro-credentials, hackathons, and workshops", "Standardized factory training only", "Individual exams without projects"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 191, "q": "Why can cross-disciplinary collaboration be difficult?", "options": ["All disciplines use identical research practices", "Cross-disciplinary teams never disagree", "Teams may have different standards, methods, terminology, attitudes, and disciplinary assumptions", "Only designers encounter collaboration problems"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 192, "q": "What should determine whether a team uses quantitative or qualitative methods?", "options": ["The personal preference of the most senior member", "The method the designer used most recently", "The cheapest available software", "The character of the research question"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 194, "q": "What is a key difference between open and closed research approaches?", "options": ["Open research always uses numbers and closed research never does", "Closed research uses more predefined categories, while open research allows categories to emerge", "Closed research is always better than open research", "Open research cannot be used in design"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 195, "q": "What challenge can arise between researchers who value objectivity and those who accept subjectivity?", "options": ["They always use exactly the same data collection methods", "They cannot work on the same topic under any circumstances", "They may distrust each other's ways of interpreting data", "They automatically reach identical conclusions"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 196, "q": "How do descriptive and causal research complement each other?", "options": ["Both only measure financial outcomes", "One replaces the need for the other", "Both avoid studying behaviour and culture", "One describes what is happening, while the other examines why it happens"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 197, "q": "What is a useful first step for reducing problems in cross-disciplinary teamwork?", "options": ["Developing mutual knowledge about the disciplines and the shared problem", "Giving all decision-making power to one discipline", "Avoiding discussion of methods", "Keeping terminology completely separate"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 198, "q": "Why can power and status become an issue in cross-disciplinary research?", "options": ["Every discipline always has equal influence", "Some disciplines may have more funding or prestige and therefore more influence", "Power only matters in individual research", "Status has no effect on research decisions"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 199, "q": "What is an important role of research managers or principal investigators?", "options": ["Ensuring one discipline dominates the project", "Preventing communication across fields", "Negotiating power balance and creating conditions for productive synergy", "Selecting methods based only on personal preference"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 200, "q": "What characterizes a process-based education model?", "options": ["Students define their own research problem from scratch", "There is no predetermined design process", "Teams are required to conduct exploratory research first", "Students follow the same brief and process and often reach similar outcomes"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 202, "q": "Which ability is encouraged by problem-based learning?", "options": ["Dependence on predetermined instructions", "Curiosity, initiative, leadership, and negotiation within a team", "Avoidance of ambiguity", "Repetition of tried-and-tested methods only"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 203, "q": "Why is ambiguity considered important for innovation?", "options": ["It guarantees that every problem has one correct answer", "It removes the need for learning new skills", "It allows designers to remain open to more than one interpretation", "It prevents collaboration with experts"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 204, "q": "What does exploratory research require students to do before proposing solutions?", "options": ["Choose the first familiar solution", "Follow a predetermined design template", "Avoid unfamiliar technologies", "Learn as much as possible about the subject without relying on a fixed blueprint"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 205, "q": "Which contrast best describes the current field of design?", "options": ["Traditional craft-oriented design and innovation-oriented design can both remain relevant", "Only traditional design remains relevant", "Only technology-driven design can be successful", "Technical design skills are no longer needed"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 206, "q": "What gives designers greater conviction and credibility when working in uncharted areas?", "options": ["A recognizable personal style alone", "The ability to produce evidence-based empirical research", "Avoiding unfamiliar disciplines", "Using fixed rules without testing"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 207, "q": "Why are new models of design education needed?", "options": ["Traditional siloed education already covers all future needs", "Research has become less relevant to design", "Designers increasingly need to handle non-routine situations and work across disciplines", "Designers only need better drawing skills"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 208, "q": "What kind of learning experience is expected to better prepare emerging designers for complex environments?", "options": ["Lecture-only learning within a single discipline", "Routine production exercises with fixed outcomes", "Avoiding contact with other fields", "Experiential and research-oriented learning across disciplines"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 209, "q": "Why have new technologies created additional national-security challenges?", "options": ["They have helped create more open, complex, and difficult-to-trace threat systems", "They have made all security threats easier to identify", "They have eliminated global terrorism", "They have reduced access to technical information"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 210, "q": "How did WMD development systems in the past differ from many present-day systems?", "options": ["They relied entirely on open public networks", "They involved fewer and more easily identifiable actors", "They were more decentralized than today's systems", "They depended mainly on social media"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 211, "q": "Why are traditional Cold War intelligence techniques described as inadequate for the Industry 4.0 environment?", "options": ["Cold War techniques focused too much on design aesthetics", "Modern intelligence no longer uses data", "Modern systems involve new technologies, information access, and many connected contributors", "Today's threats involve fewer variables than before"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 212, "q": "What failure did one US government group identify as especially important in understanding past intelligence shortcomings?", "options": ["A failure of graphic design", "A failure to automate all decisions", "A failure to reduce the number of experts", "A failure of imagination"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 213, "q": "What was Major Tracy Moss's primary objective while in active service?", "options": ["Designing and activating strategies to prevent WMD proliferation", "Developing commercial products for civilian markets", "Teaching visual communication at a design school", "Managing military recruitment campaigns"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 214, "q": "What was the task of the interagency design team at the Joint Intelligence Center?", "options": ["Producing advertising materials for the armed forces", "Designing creative special operations to identify and address complex national-security threats", "Replacing all intelligence analysis with automated systems", "Designing consumer electronics for military personnel"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 215, "q": "Where was the special design team that Moss joined located organizationally?", "options": ["A civilian advertising agency", "A university art department", "The Strategy, Plans, and Policy (J5) Directorate", "A commercial product-design studio"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 216, "q": "What kind of campaigns was Moss's team tasked to design?", "options": ["Retail marketing campaigns", "Public transport campaigns", "Industrial branding campaigns", "Counter-weapons of mass destruction special-operations campaigns"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 217, "q": "Approximately how large was the design team at a typical time?", "options": ["About six people, sometimes more or less", "Exactly two people", "More than one hundred people", "A single analyst working alone"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 218, "q": "Who led the cross-functional design team?", "options": ["A commercial brand manager", "A special operator from the US Navy SEALs", "A university professor", "A software vendor"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 219, "q": "Roughly how much of the first two-year design iteration did Moss estimate was spent on research and learning?", "options": ["About 10%", "About 25%", "More than 75%", "Less than 5%"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 220, "q": "What did the team call the research-heavy early phase of its process?", "options": ["Final Delivery", "Rapid Production", "Visual Styling", "Strategic Appreciation or Appreciate the Context"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 221, "q": "Why did Moss's team avoid describing the initial situation immediately as a 'problem'?", "options": ["They wanted to understand the context and imagine a desired future before framing the problem", "They believed problems do not exist in military work", "They were not allowed to conduct research", "They wanted to skip the analysis phase"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 222, "q": "How did Moss define the eventual problem in relation to the design process?", "options": ["It was identical to the initial prompt", "It was the gap between the current reality and the desired future", "It was whatever solution the team preferred", "It was the first idea proposed by leadership"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 223, "q": "What term did Moss prefer for the issue that first triggered action?", "options": ["The prototype", "The final answer", "The prompt", "The style guide"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 224, "q": "When was the formal problem statement articulated?", "options": ["Before any research began", "Immediately after receiving the task", "Only after the final campaign ended", "After about 18 months of iterative research and learning"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 225, "q": "Who predetermined the issue or prompt assigned to USSOCOM?", "options": ["The Vice Chairman of the Joint Chiefs of Staff", "A private design consultancy", "The team's nuclear engineer", "A university research committee"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 226, "q": "What research question did Moss's team use in the Country X example?", "options": ["Which design style does Country X prefer?", "What is Country X's nuclear WMD system?", "How can Country X increase exports?", "Which software should the team purchase?"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s04", "extra": true}, {"id": 227, "q": "What did the team study first when beginning its research on Country X?", "options": ["Its graphic-design trends", "Its consumer preferences", "Its domestic and external geopolitical circumstances", "Its tourism industry"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 228, "q": "What is 'finished intelligence' in the interview?", "options": ["Any information posted publicly online", "A final military operation plan", "A commercial market report", "Information gathered in the field that has already been reviewed and correlated with other sources"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 229, "q": "Why did team members study the country's history?", "options": ["To understand why it was pursuing nuclear weapons", "To select a visual identity for the project", "To reduce the number of research sources", "To replace geopolitical analysis"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 231, "q": "How were research tasks generally distributed within the team?", "options": ["Randomly, with no regard to expertise", "Only to the team leader", "According to each member's functional or topic expertise", "Entirely to external consultants"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 233, "q": "Why did the team use a very wide variety of source materials?", "options": ["To broaden understanding and help overcome bias", "To avoid comparing information across sources", "To reduce the need for synthesis", "To keep the project within a single discipline"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 234, "q": "What function did the team's large-format strategic-appreciation visualization serve?", "options": ["It replaced all research with a single image", "It acted as a synthesis document and shared systemic understanding", "It served only as a presentation decoration", "It was used to assign military ranks"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 235, "q": "How did the team try to fill gaps in its understanding?", "options": ["By ignoring unanswered questions", "By relying on one source only", "By seeking stakeholder feedback and commissioning targeted primary research", "By reducing the number of experts involved"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 236, "q": "Why could external organizations such as consultancies or universities become involved?", "options": ["They replaced the entire design team", "They were responsible only for visual design", "They were used to avoid evidence-based analysis", "They could be contracted to conduct specific research needed to fill knowledge gaps"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 237, "q": "Why did Moss's team draw on fields such as political science, sociology, economics, engineering, and law?", "options": ["To synthesize multiple perspectives into a systemic interpretation", "To prove that one discipline was always correct", "To keep research methods identical across all topics", "To avoid studying technical issues"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s05", "extra": true}, {"id": 238, "q": "How did Moss describe the team's method of combining individual learning into a collective interpretation?", "options": ["A standardized multiple-choice test", "Reflective discourse supported by a systems-map visualization", "A single analyst's private report", "An automated scoring system"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s03", "extra": true}, {"id": 239, "q": "In Moss's view, which statement best describes the theoretical models and approach used in their research?", "options": ["Relied entirely on political science to analyse and explain technical issues such as nuclear technology.", "Synthesised perspectives from many diverse fields (political science, psychology, physics, law…) into a systems view, applying transdisciplinary research.", "Refused to use CIA and DIA intelligence-analysis methods because they could not be applied to complex systems.", "Built a single, fixed theoretical model for every type of research without using knowledge from the social sciences.", "Focused only on the psychology of intelligence analysis from Richards Heuer's single 1999 book."], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s02", "extra": true}, {"id": 241, "q": "In Moss's view, what challenge did they face during the research?", "options": ["It took a long time to gather intelligence because of a staff shortage in the J5 directorate.", "The design approach felt uncomfortable and was a fundamental departure from the military's traditional planning process.", "The Commander intervened too deeply in the initial context-assessment phase.", "The military completely refused to set up cross-functional teams.", "Sharing intelligence with the community was cancelled entirely because of security policy."], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 242, "q": "In Moss's view, what was the core difference and greatest strength of their design team?", "options": ["All members contributed equally to a shared understanding, drawing on everyone's intelligence, experience and diverse perspectives instead of leaving 'understanding' to the intelligence community alone.", "Only intelligence experts could access classified information, to keep the reliability assessment accurate.", "The team removed all non-intelligence members to avoid a lack of analytical skills.", "The process minimised the use of broad information sources to avoid confusing other members.", "Members from outside intelligence took full responsibility for decisions in place of the intelligence analysts."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 243, "q": "In Moss's view, which statement best reflects the limitations they faced during the research?", "options": ["Obtaining security clearances for outside partners, research funding, the limited capacity of intelligence agencies, and overcoming personal bias and mindsets.", "Belonging to USSOCOM was the biggest limitation, making the design team unable to work in real operating environments.", "The government had perfect research capability in the information age, so the team never needed to buy outside data or analysis.", "Intelligence-production agencies always gave absolute priority to the design team regardless of the dual-war environment.", "The team refused to work with all uncleared organizations to avoid having to find flexible solutions."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 244, "q": "In Moss's view, what process did the team use to handle new perspectives and unexpected findings during the research?", "options": ["Paused the overall strategic assessment to develop specific opportunities (CONOPs), thinking things through in dialogue and holding formal ideation sessions with experts.", "Discarded unexpected findings entirely so they would not derail the original strategic assessment of the larger system.", "Immediately applied standard, traditional design-ideation methods instead of group discussion.", "Refused to work with the Community of Interest (CoI) because it was too large, unwieldy and heterogeneous.", "Handed all relationship tracking and communication over to an outside administrative agency."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 245, "q": "In Moss's view, which statement best describes the most valuable insights gained?", "options": ["Although specific insights could not be discussed, Moss developed a systems-thinking model based on network theory that broadened perspectives and greatly increased targeting considerations.", "Moss presented in detail all the most important intelligence findings the team collected during the research.", "The team used artificial intelligence to completely replace the systems-thinking model for identifying strategic targets.", "Moss declined to answer and stated that their work produced no useful thinking model or results.", "The new model narrowed the team's perspective so it focused on a single target instead of a broader view."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 246, "q": "In Moss's view, which statement best describes how the end results of their work are evaluated?", "options": ["In essence there is no end result, because it is a continuous effort in a volatile global socio-political environment, so the work is never finished.", "End results are judged against fixed metrics set by superiors at the start.", "The work ends and is evaluated as soon as the contract with the partner is completed.", "The socio-political environment is highly stable, which makes evaluating results quick and accurate.", "Evaluating the end results is a separate task handed entirely to an independent audit unit."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 247, "q": "What is the design field increasingly focused on today?", "options": ["Creating highly aesthetic products", "Listening, asking questions, understanding and building new possibilities", "Following traditional design principles", "Reducing the involvement of other fields in design"], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 249, "q": "What does the example of Raymond Loewy illustrate about design practice?", "options": ["Designers should specialise in only one field", "Design practice can span many different fields and projects", "Design only thrives in the fashion industry", "Designers in the past had no influence on society"], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 250, "q": "Why do designers today need to broaden their interdisciplinary knowledge?", "options": ["Because other fields are completely replacing design", "Because all designers must become engineers", "Because design no longer needs specialist skills", "Because the problems facing businesses and society are increasingly complex"], "answer": 3, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 251, "q": "A company wants to reduce waste and also create user-friendly packaging. Which design approach is most suitable?", "options": ["Combine knowledge from several fields to understand the problem and develop new solutions", "Focus only on making the packaging look better", "Study only the production costs", "Use one fixed design rule for every product"], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 252, "q": "Which of the following is NOT an example of designers' positive contributions to society?", "options": ["Developing energy-efficient products and processes", "Creating human-friendly environments", "Encouraging political participation", "Focusing on removing technology from design entirely"], "answer": 3, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 253, "q": "How has design practice changed compared with the past?", "options": ["Design today is based entirely on a fixed set of principles", "Designers today only work with physical products", "The concept of design and the role of the designer have changed significantly", "Designers today focus only on decoration"], "answer": 2, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 254, "q": "What is a key difference between designers and architects/engineers?", "options": ["Designers always work independently", "Designers do not necessarily work from a fixed set of principles and rules", "Designers do not need specialist skills", "Designers do not solve real-world problems"], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 255, "q": "Why is design increasingly sought after as a way of thinking in many fields?", "options": ["Because design only makes products look better", "Because design can help solve increasingly complex problems", "Because every profession is required to study design", "Because design has completely replaced scientific research"], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 256, "q": "What does Moss say about the ideation process described in her research?", "options": ["It was mainly driven by one specific design method.", "It was based on people thinking things through together in dialogue and discussion.", "It was carried out independently by each team member.", "It followed a standardised process used in the military."], "answer": 1, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 257, "q": "How did Moss's team handle the breadth and complexity of the Community of Interest (CoI)?", "options": ["By expanding and then narrowing the scope of the research into manageable parts.", "By focusing the scope on a single part of the CoI.", "By narrowing the scope to a small group of relevant experts.", "By keeping a consistent scope throughout the process."], "answer": 0, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 258, "q": "What did Moss develop based on network theory?", "options": ["A standardised design method.", "A formal assessment framework", "A systems-thinking model", "A model for mapping relationships within the system."], "answer": 2, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 259, "q": "How does Moss describe the results of her research?", "options": ["This approach usually produces a clearly defined end result.", "Results are evaluated after each research cycle.", "The results are complete once the vulnerable part of the system has been identified.", "The process ends once the relevant experts have solved the problem.", "All of the above are correct.", "None of the above is correct."], "answer": 5, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 260, "q": "What makes the second edition of Muratovski's Research for Designers different from the first?", "options": ["It introduces both real design projects and what designers/researchers need to know about their professional practice.", "It introduces both established research methods and what designers/researchers need to know about their academic development.", "It introduces both design research and what designers/researchers need to know about their future careers.", "It introduces both historical design research and what designers/researchers need to know about their professional development."], "answer": 2, "src": "Group 3 review questions", "note": "", "ls": "s03", "extra": true}, {"id": 261, "q": "How did the military develop its d to identify and collect the data", "Nothing will increase the reliability of the review", "Clearly outline the process used to identify and collect the data", "Only list out the process used to identify the data"], "answer": 2, "src": "Group 5 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 306, "q": "When is a good time to stop reviewing the literature?", "options": ["When you come across a repetitive patterns of information", "When you feel like it is enough", "When other people tell you to stop", "There is never a good time to stop reviewing the literature"], "answer": 0, "src": "Group 5 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 307, "q": "What should you do at the end of your review?", "options": ["Nothing should be done at the end of the review", "Only cite every source that you have used", "Make sure that you referenced everything correctly and cite every source that you have used", "Only make sure that you referenced everything correctly"], "answer": 2, "src": "Group 5 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 308, "q": "A researcher is studying the concept of “design” but finds that different researchers use the term in different ways. What should the researcher do in the proposal?", "options": ["Avoid using the term because it has different interpretations", "Use the most common interpretation without further explanation", "Define how the term will be understood specifically within the research", "Include several unrelated definitions to cover every possible meaning", "Create a completely new definition without referring to existing sources"], "answer": 2, "src": "Group 5 review questions", "note": "", "ls": "s06", "extra": true}, {"id": 309, "q": "Which statement best describes the relationship between research methods and methodology?", "options": ["Methods describe the overall reasoning, while methodology lists the research tools", "Methods and methodology refer to the same thing but n which tools to use for common problems", "As a substitute for conducting literature reviews and fieldwork", "As a fixed set of pre-determined answers for commercial design challenges"], "answer": 1, "src": "Group 5 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 318, "q": "A researcher presents a project to a group of people who are unfamiliar with the research field. Why is a clear methodology especially important in this situation?", "options": ["It allows the audience to understand how the research will be conducted", "It allows the researcher to avoid explaining the research objectives.", "It ensures that everyone will agree with the researcher’s conclusions", "It reduces the need to provide evidence from previous research", "It allows the researcher to focus only on technical research details"], "answer": 0, "src": "Group 5 review questions", "note": "", "ls": "s05", "extra": true}, {"id": 319, "q": "What critical step must a researcher complete before collecting data?", "options": ["Finalizing the writing of the final research report.", "Defining research goals and addressing essential logistical questions.", "Interviewing all competitors in the market.", "Recovering all project investment costs.", "Publishing articles in international journals."], "answer": 1, "src": "Group 5 review questions", "note": "", "ls": "s04", "extra": true}, {"id": 320, "q": "When preparing for fieldwork, which key logistical factors must a researcher carefully consider?", "options": ["Number of published pages and typography fonts.", "Fieldwork duration, research location, and cultural sensitivity.", "Logo color palette and personal branding.", "Schedule for attending international design conferences.", "The fame of reference authors."], "answer": 1, "src": "Group 5 review questions", "note": "", "ls": "s07", "extra": true}, {"id": 321, "q": "Which metaphor best describes the initial planning phase of a research project?", "options": ["A graphic design competit  340, "q": "Is Multimethod research mandatory in your research project?", "options": ["Yes - Because it is the only way of doing research", "No - It takes a lot of time and effort", "Yes - Because it is law mandated", "No - Because you could still only use qualitative or quantitative research if you believe this is sufficient for your research project"], "answer": 3, "src": "Group 5 review questions", "note": "", "ls": "s05", "extra": true}, {"id": 342, "q": "What does the ability to simultaneously answer confirmatory and explanatory questions lead to?", "options": ["They do not lead to anything", "They allow you to generate and verify a theory in the same study", "They allow you to generate a theory", "They allow you to generate and verify a theory in a different study"], "answer": 1, "src": "Group 5 review questions", "note": "", "ls": "s05", "extra": true}, {"id": 343, "q": "What is ethics essentially?", "options": ["A system of universal moral standards", "A set of professional rules", "A method for conducting research", "A system of academic regulations"], "answer": 0, "src": "Group 5 review questions", "note": "CORRECTED: the group file says 'A set of professional rules'. Teacher's slides (Session 05): 'Ethics is a system of universal moral standards'.", "ls": "s05", "extra": true}, {"id": 345, "q": "What are researchers required to submit before conducting research involving participants in a university environment?", "options": ["A research budget", "A publication plan", "An ethical application", "A participant questionnaire"], "answer": 2, "src": "Group 5 review questions", "note": "", "ls": "s14", "extra": true}, {"id": 346, "q": "When were ethical standards related to research participants introduced and broadly accepted?", "options": ["Before World War I", "During the Industrial Revolution", "After WWII", "In the 21st century"], "answer": 2, "src": "Group 5 review questions", "note": "", "ls": "s05", "extra": true}, {"id": 347, "q": "Besides the wellbein ene?", "options": ["\"when you emerged on the global design scene in the mid-1990s\"", "\"when you started your career in the early 1980s\"", "\"when you joined Autodesk in the late 2000s\"", "\"when you moved to New York at the turn of the century\""], "answer": 0, "src": "Group 4 review questions", "note": "", "ls": "s02", "extra": true}, {"id": 447, "q": "What elements does Muratovski note that Rashid factored into his work?", "options": ["\"In your work, you factored in new materials, new software, new technologies, and new social experiences.\"", "\"In your work, you focused entirely on traditional manufacturing and manual craftsmanship.\"", "\"In your work, you only considered architectural principles and structural engineering.\"", "\"In your work, you integrated economic theories and market research data.\""], "answer": 0, "src": "Group 4 review questions", "note": "", "ls": "s02", "extra": true}, {"id": 448, "q": "What does Image 3.1's caption state?", "options": ["Karim Rashid (Photography courtesy of Karim Rashid.)", "Borislav Muratovski (Photography courtesy of Muratovski.)", "Karim Rashid at Autodesk Headquarters (Photography courtesy of Autodesk.)", "Generative Design Chair (Photography courtesy of Magis.)"], "answer": 0, "src": "Group 4 review questions", "note": "", "ls": "s07", "extra": true}, {"id": 449, "q": "How does Muratovski describe Karim Rashid's design voice?", "options": ["\"And you were this very exciting new design voice that was determined to change the world.\"", "\"And you were this calm and traditional design voice that preserved classic styles.\"", "\"And you were this quiet and theoretical voice focused on academic research.\"", "\"And you were this commercial voice focused exclusively on mass production.\""], "answer": 0, "src": "Group 4 review questions", "note": "", "ls": "s02", "extra": true}, {"id": 451, "q": "How does Rashid describe humanity when watching it?", "options": ["\"humanity is funny, strange, it's peculiar and its
