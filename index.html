const LOGO = `<svg width="46" height="46" viewBox="0 0 54 54" aria-hidden="true"><circle cx="22" cy="22" r="16" fill="#fff" stroke="#1c2a4a" stroke-width="4"/><circle cx="22" cy="22" r="11" fill="#ffe347" opacity=".55"/><line x1="34" y1="34" x2="49" y2="49" stroke="#1c2a4a" stroke-width="7" stroke-linecap="round"/><circle cx="17" cy="20" r="2.6" fill="#1c2a4a"/><circle cx="27" cy="20" r="2.6" fill="#1c2a4a"/><path d="M16 27q6 5 12 0" stroke="#d7372b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
const page = inner => `<div class="page"><div class="holes">${"<i></i>".repeat(6)}</div>${inner}</div>`;
function header() {
  const read = LESSONS.filter(l => (S.seen[l.id] || []).length >= l.cards.length).length;
  return `<div class="top">${LOGO}<h1 id="homeT">RMD301 Field Lab<small>RESEARCH METHODS FOR DESIGN · GD2006 · HUENTM</small></h1><div class="spacer"></div><span class="chipx">${read}/${LESSONS.length} bài · ${S.wrong.length} câu sai</span></div>`;
}
function bindHome() { const t = $("#homeT"); if (t) t.onclick = () => go("home"); }
let timerId = null; const stop = () => { if (timerId) clearInterval(timerId); timerId = null; };
function go(v, arg) { stop(); document.onkeydown = null; window.scrollTo(0, 0); ({ home, lessons, lesson, quizHome }[v])(arg); }

// ---------- HOME ----------
function home() {
  location.hash = "";
  const next = LESSONS.find(l => (S.seen[l.id] || []).length < l.cards.length) || LESSONS[0];
  app.innerHTML = header() + page(`
    <div class="hero"><div><h2>Ôn RMD301 theo slide gốc của cô</h2><p>${LESSONS.length} bài tóm gọn từ 18 file slide (Session 01–17, 52), bấm Next để lướt, keyword quan trọng được tô vàng. Quiz chính lấy từ các bộ Quizlet RMD301 (đã dò đáp án theo slide), cộng thêm câu soạn theo slide cho những bài Quizlet chưa hỏi tới.</p></div></div>
    <div class="big2">
      <button class="bigbtn ink" id="toL"><span class="n">${LESSONS.length} bài</span><h3>Bài học</h3><p>Học tiếp: <b style="color:#fff">${esc(next.t)}</b></p></button>
      <button class="bigbtn" id="toQ"><span class="n">${Q.filter(q => !q.extra).length} câu</span><h3>Quiz</h3><p>Chơi 10 câu theo bài, trộn nhiều bài, hoặc thi thử 40 câu.</p></button>
    </div>
    <div class="legend">Câu nhãn <b>ĐÃ SỬA</b> là câu mà nguồn gốc ghi sai đáp án, đã sửa theo slide cô. Câu các nhóm tự soạn và câu ngoài slide mặc định bị ẩn vì chưa chắc đúng, bật lại trong mục Quiz nếu muốn.</div>`);
  bindHome();
  $("#toL").onclick = () => go("lessons");
  $("#toQ").onclick = () => go("quizHome");
}

// ---------- LESSON LIST ----------
function lessons() {
  location.hash = "lessons";
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Về trang chính">←</button><div class="hudt">Bài học<small>Bấm vào bài để đọc, dùng ← → để chuyển thẻ</small></div></div>` +
    page(`<div class="llist">${LESSONS.map((l, i) => { const s = (S.seen[l.id] || []).length, n = l.cards.length; return `<button class="li ${s >= n ? "done" : ""}" data-l="${l.id}"><span class="no">${String(i + 1).padStart(2, "0")}</span><span style="flex:1"><b>${esc(l.t.replace(/^\d+ · /, ""))}</b><span>${esc(l.sub)} · ${n} thẻ</span><span class="mini"><i style="width:${Math.round(s / n * 100)}%"></i></span></span></button>`; }).join("")}</div>`);
  bindHome(); $("#bk").onclick = () => go("home");
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => go("lesson", { id: b.dataset.l, i: 0 }));
}

// ---------- LESSON READER ----------
function lesson({ id, i }) {
  location.hash = "lesson-" + id;
  const L = LN[id], idx = LESSONS.indexOf(L), c = L.cards[i];
  const seen = new Set(S.seen[id] || []); seen.add(i); S.seen[id] = [...seen]; save();
  const last = i === L.cards.length - 1;
  const nq = lessonQ(id).length;
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Danh sách bài">←</button><div class="hudt">${esc(L.t)}<small>Thẻ ${i + 1}/${L.cards.length}</small></div></div>
    <div class="dots">${L.cards.map((_, k) => `<button aria-label="Thẻ ${k + 1}" class="${k === i ? "on" : seen.has(k) ? "seen" : ""}" data-k="${k}"></button>`).join("")}</div>` +
    page(`<div class="card"><div class="k">${esc(L.sub.toUpperCase())}</div><h2>${esc(c.h)}</h2><ul>${c.b.map(x => `<li>${md(x)}</li>`).join("")}</ul>
      ${c.img ? `<figure><img src="img/${c.img}.webp" alt="${esc(c.cap || c.h)}" loading="lazy">${c.cap ? `<figcaption>${esc(c.cap)}</figcaption>` : ""}</figure>` : ""}</div>
      <div class="nav"><button class="btn" id="pv" ${i === 0 && idx === 0 ? "disabled" : ""}>← Trước</button><div class="spacer"></div>
      ${last ? (nq ? `<button class="btn ink" id="qz">Quiz bài này (${Math.min(10, nq)} câu)</button>` : "") + `<button class="btn pri" id="nx">${idx < LESSONS.length - 1 ? "Bài tiếp →" : "Xong"}</button>` : `<button class="btn pri" id="nx">Tiếp →</button>`}</div>`);
  bindHome();
  $("#bk").onclick = () => go("lessons");
  const prev = () => { if (i > 0) go("lesson", { id, i: i - 1 }); else if (idx > 0) { const p = LESSONS[idx - 1]; go("lesson", { id: p.id, i: p.cards.length - 1 }); } };
  const next = () => { if (!last) go("lesson", { id, i: i + 1 }); else if (idx < LESSONS.length - 1) go("lesson", { id: LESSONS[idx + 1].id, i: 0 }); else go("lessons"); };
  $("#pv").onclick = prev; $("#nx").onclick = next;
  const qz = $("#qz"); if (qz) qz.onclick = () => startQuiz("lesson", [id]);
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => go("lesson", { id, i: +b.dataset.k }));
  app.querySelectorAll(".card img").forEach(im => im.onclick = () => { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${im.src}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z); });
  document.onkeydown = e => { if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev(); };
  let sx = null; const pg = app.querySelector(".page");
  pg.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  pg.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) (dx < 0 ? next : prev)(); sx = null; });
}

// ---------- QUIZ HOME ----------
function quizHome() {
  location.hash = "quiz";
  const cnt = id => Q.filter(q => q.ls === id && (S.extra || !q.extra)).length;
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Về trang chính">←</button><div class="hudt">Quiz<small>Chọn bài rồi chọn kiểu chơi</small></div></div>` +
    page(`<div class="sec" style="margin-top:0">Bài (đang chọn ${S.sel.length}/${LESSONS.length}, ${pool().length} câu)</div>
    <div class="chips">${LESSONS.map((l, i) => `<button class="chip ${S.sel.includes(l.id) ? "on" : ""}" data-s="${l.id}" aria-pressed="${S.sel.includes(l.id)}">${String(i + 1).padStart(2, "0")} ${esc(l.t.replace(/^\d+ · /, "").split(" (")[0])}<small>${cnt(l.id)}</small></button>`).join("")}</div>
    <div class="row"><button class="btn sm" id="all">Chọn hết</button><button class="btn sm" id="none">Bỏ hết</button></div>
    <label class="tgl" id="ex"><span class="sw ${S.extra ? "on" : ""}" role="switch" aria-checked="${S.extra}"></span> Thêm ${Q.filter(q => q.extra).length} câu nhóm tự soạn / ngoài slide (chưa chắc đúng)</label>
    <div class="modes">
      <button class="mode red" data-m="mix"><h3>Quiz nhanh 10 câu</h3><p>Trộn các bài đang chọn, biết đáp án ngay.</p></button>
      <button class="mode" data-m="mix20"><h3>Quiz 20 câu</h3><p>Dài hơn một chút, vẫn có giải thích.</p></button>
      <button class="mode" data-m="exam"><h3>Thi thử 40 câu</h3><p>40 phút, làm xong mới chấm, thang 10.</p></button>
      <button class="mode" data-m="wrong"><h3>Ôn câu sai (${S.wrong.length})</h3><p>Đúng 2 lần thì câu tự rời khỏi danh sách.</p></button>
    </div>`);
  bindHome(); $("#bk").onclick = () => go("home");
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const k = b.dataset.s; S.sel = S.sel.includes(k) ? S.sel.filter(x => x !== k) : S.sel.concat(k); save(); quizHome(); });
  $("#all").onclick = () => { S.sel = LESSONS.map(l => l.id); save(); quizHome(); };
  $("#none").onclick = () => { S.sel = []; save(); quizHome(); };
  $("#ex").onclick = () => { S.extra = !S.extra; save(); quizHome(); };
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => startQuiz(b.dataset.m));
}

// ---------- QUIZ PLAY ----------
let G = null;
function startQuiz(m, ids) {
  stop(); document.onkeydown = null;
  let base = m === "wrong" ? Q.filter(q => S.wrong.includes(q.id)) : m === "lesson" ? lessonQ(ids[0]) : pool();
  if (!base.length) { toast(m === "wrong" ? "Chưa có câu sai nào, làm vài quiz trước nha." : "Chưa chọn bài nào."); return; }
  const n = m === "exam" ? 40 : m === "mix20" ? 20 : 10;
  // prefer unseen / previously wrong
  const w = q => { const s = S.stat[q.id]; return (s ? (s.c - s.w * 2) : -1) + Math.random() * 2.5; };
  let list = m === "exam" ? shuffle(base) : base.slice().sort((a, b) => w(a) - w(b));
  list = shuffle(list.slice(0, Math.min(n, list.length)));
  G = { m, ids, items: list.map(q => ({ q, order: shuffle(q.options.map((_, k) => k)), pick: null })), i: 0, right: 0, streak: 0, best: 0, t0: Date.now() };
  if (m === "exam") { G.left = 40 * 60; timerId = setInterval(() => { G.left--; const t = $("#tm"); if (t) { t.textContent = fmt(G.left); t.classList.toggle("low", G.left < 60); } if (G.left <= 0) finish(); }, 1000); }
  location.hash = "play"; show();
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
function show() {
  window.scrollTo(0, 0);
  const it = G.items[G.i], q = it.q, n = G.items.length, exam = G.m === "exam";
  const tiles = it.order.map((oi, k) => {
    let cls = "t" + k;
    if (!exam && it.pick !== null) cls += oi === q.answer ? " right" : oi === it.pick ? " wrong" : " dim";
    if (exam && it.pick === oi) cls += " pick";
    return `<button class="tile ${cls}" data-o="${oi}"><span class="sh">${SH[k]}</span>${esc(q.options[oi])}</button>`;
  }).join("");
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Thoát">✕</button><div class="bar"><i style="width:${(G.i / n) * 100}%"></i></div><span class="score">${exam ? `${G.i + 1}/${n}` : `${G.right} đúng · ${G.i + 1}/${n}`}</span>${exam ? `<span class="timer" id="tm">${fmt(G.left)}</span>` : ""}</div>
    <div class="qbox"><div class="meta">${esc(LN[q.ls].t)} · ${esc(q.src)}${q.note && q.note.startsWith("ĐÃ SỬA") ? " · ĐÃ SỬA" : ""}</div><div class="q">${esc(q.q)}</div></div>
    <div class="streak">${!exam && G.streak >= 3 ? `chuỗi ${G.streak} câu đúng!` : ""}</div>
    <div class="tiles">${tiles}</div>
    <div class="fb" id="fb"></div>
    ${exam ? `<div class="row"><button class="btn" id="pv" ${G.i === 0 ? "disabled" : ""}>← Câu trước</button><div class="spacer"></div><button class="btn ink" id="nx">${G.i === n - 1 ? "Nộp bài" : "Câu sau →"}</button></div><div class="qgrid">${G.items.map((x, k) => `<button data-j="${k}" class="${x.pick !== null ? "done" : ""} ${k === G.i ? "cur" : ""}">${k + 1}</button>`).join("")}</div>` : ""}`;
  bindHome();
  let armed = false;
  $("#bk").onclick = () => { if (exam && !armed) { armed = true; $("#bk").textContent = "?"; $("#bk").title = "Bấm lần nữa để thoát"; return; } stop(); G = null; go("quizHome"); };
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => choose(+b.dataset.o, b));
  if (exam) {
    $("#nx").onclick = () => { if (G.i === n - 1) submit(); else { G.i++; show(); } };
    $("#pv").onclick = () => { if (G.i > 0) { G.i--; show(); } };
    app.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { G.i = +b.dataset.j; show(); });
  }
  if (!exam && it.pick !== null) feedback(it);
  document.onkeydown = e => {
    const k = e.key.toUpperCase(); const ix = SH.indexOf(k) >= 0 ? SH.indexOf(k) : "123456".indexOf(e.key);
    const ts = app.querySelectorAll(".tile"); if (ix >= 0 && ix < ts.length) { ts[ix].click(); return; }
    if (e.key === "Enter" || e.key === "ArrowRight") { const b = $("#go") || $("#nx"); if (b) b.click(); }
    if (e.key === "ArrowLeft" && exam) { const b = $("#pv"); if (b) b.click(); }
  };
}
function choose(oi, el) {
  const it = G.items[G.i];
  if (G.m === "exam") { it.pick = oi; if (G.i < G.items.length - 1) G.i++; show(); return; }
  if (it.pick !== null) return;
  it.pick = oi; const ok = oi === it.q.answer; record(it.q, ok);
  if (ok) { G.right++; G.streak++; G.best = Math.max(G.best, G.streak); const r = el.getBoundingClientRect(); const d = document.createElement("div"); d.className = "pop"; d.textContent = "+1"; d.style.left = (r.right - 50) + "px"; d.style.top = r.top + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
  else G.streak = 0;
  show();
}
function feedback(it) {
  const q = it.q, ok = it.pick === q.answer, fb = $("#fb");
  const warn = q.note && /^(ĐÃ SỬA|CẢNH BÁO)/.test(q.note);
  fb.className = "fb show " + (ok ? "good" : "bad");
  fb.innerHTML = `<div class="say">${ok ? "Chuẩn!" : "Sai rồi"}</div>${ok ? "" : `<div class="a">Đáp án: <b>${esc(q.options[q.answer])}</b></div>`}${q.note ? (warn ? `<div class="warn">${esc(q.note)}</div>` : `<div class="x">${esc(q.note)}</div>`) : ""}<div class="row"><button class="btn pri" id="go">${G.i === G.items.length - 1 ? "Xem kết quả" : "Câu tiếp →"}</button></div>`;
  $("#go").onclick = () => { if (G.i >= G.items.length - 1) finish(); else { G.i++; show(); } };
}
function submit() {
  const left = G.items.filter(x => x.pick === null).length;
  if (left && !G.sure) { G.sure = true; $("#nx").textContent = `Còn ${left} câu trống – bấm lần nữa để nộp`; return; }
  finish();
}
function finish() {
  stop(); document.onkeydown = null;
  if (G.m === "exam") { G.items.forEach(it => record(it.q, it.pick === it.q.answer)); G.right = G.items.filter(it => it.pick === it.q.answer).length; }
  const n = G.items.length, pct = G.right / n, ten = (Math.round(pct * 100) / 10).toFixed(1);
  const gr = pct >= .9 ? "A+" : pct >= .8 ? "A" : pct >= .65 ? "B" : pct >= .4 ? "C" : "F";
  const miss = G.items.filter(it => it.pick !== it.q.answer);
  const weak = {}; miss.forEach(it => weak[it.q.ls] = (weak[it.q.ls] || 0) + 1);
  const weakL = Object.entries(weak).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k);
  const m = G.m, ids = G.ids;
  app.innerHTML = header() + page(`<div style="text-align:center">
      <div class="grade"><svg viewBox="0 0 140 140"><ellipse cx="70" cy="70" rx="62" ry="54" fill="none" stroke="#d7372b" stroke-width="4" transform="rotate(-12 70 70)"/></svg>${gr}</div>
      <div class="hand">${pct >= .8 ? "Ổn áp, giữ phong độ nha!" : pct >= .5 ? "Khá rồi, xem lại mấy câu sai là chắc." : "Đọc lại bài rồi làm lại nha."}</div>
      <div class="stats"><div class="stat"><b>${G.right}/${n}</b><span>câu đúng</span></div><div class="stat"><b>${ten}</b><span>thang 10</span></div>${m !== "exam" ? `<div class="stat"><b>${G.best || 0}</b><span>chuỗi dài nhất</span></div>` : ""}<div class="stat"><b>${Math.max(1, Math.round((Date.now() - G.t0) / 60000))}′</b><span>thời gian</span></div></div>
      <div class="row" style="justify-content:center"><button class="btn pri" id="ag">Làm lại</button>${weakL.length ? `<button class="btn" id="rd">Đọc lại: ${esc(LN[weakL[0]].t.replace(/^\d+ · /, ""))}</button>` : ""}<button class="btn" id="hq">Về Quiz</button></div></div>
    ${miss.length ? `<div class="sec">Xem lại ${miss.length} câu sai</div><div class="rev">${miss.map(it => `<div class="rv"><b>${esc(it.q.q)}</b><div class="me">${it.pick === null ? "(bỏ trống)" : "Bạn chọn: " + esc(it.q.options[it.pick])}</div><div class="ok">Đúng: ${esc(it.q.options[it.q.answer])}</div>${it.q.note ? `<div class="ex">${esc(it.q.note)}</div>` : ""}<div class="ex">${esc(LN[it.q.ls].t)}</div></div>`).join("")}</div>` : ""}`);
  G = null; bindHome();
  $("#ag").onclick = () => startQuiz(m, ids);
  $("#hq").onclick = () => go("quizHome");
  const rd = $("#rd"); if (rd) rd.onclick = () => go("lesson", { id: weakL[0], i: 0 });
}
function toast(msg) { const d = document.createElement("div"); d.className = "fb show bad"; Object.assign(d.style, { position: "fixed", left: "50%", bottom: "24px", transform: "translateX(-50%)", zIndex: 60, maxWidth: "90vw" }); d.innerHTML = `<div class="a">${esc(msg)}</div>`; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

const h = location.hash.slice(1);
if (h === "lessons") go("lessons"); else if (h.startsWith("lesson-") && LN[h.slice(7)]) go("lesson", { id: h.slice(7), i: 0 }); else if (h === "quiz") go("quizHome"); else go("home");
</script>
