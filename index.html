<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMD301 Field Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Patrick+Hand&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Field-notebook world: graph paper, ink-blue notes, highlighter yellow, red correction pen. Layout: one notebook column. */
  --paper:#eef0ea; --paper2:#fbfcf8; --grid:#cfd9e6; --ink:#1c2a4a; --ink2:#55607a;
  --hl:#ffe347; --red:#d7372b; --green:#2c8a4f; --tape:#f1e2b6;
  --qa:#e2483c; --qb:#2f6fd6; --qc:#e0a100; --qd:#2c8a4f;
  --body:"Be Vietnam Pro",system-ui,sans-serif; --hand:"Patrick Hand","Be Vietnam Pro",cursive; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 90px}
.hide{display:none!important}
h1,h2,h3{text-wrap:balance}
b,strong{font-weight:800}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.4px;line-height:1.05;cursor:pointer}
.top h1 small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:1px;margin-top:4px}
.spacer{flex:1}
.chipx.sfx{cursor:pointer;margin-right:8px;font-size:15px;padding:3px 9px}
.chipx{font-family:var(--mono);font-size:12px;font-weight:600;border:2px solid var(--ink);background:var(--paper2);padding:5px 10px;border-radius:6px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.page{position:relative;background:var(--paper2);border:2px solid var(--ink);border-radius:4px 14px 14px 4px;padding:18px 18px 18px 44px;box-shadow:5px 5px 0 var(--ink)}
.page:before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:#f2a4a0}
.holes{position:absolute;left:7px;top:18px;bottom:18px;display:flex;flex-direction:column;justify-content:space-around}
.holes i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.hand{font-family:var(--hand);font-size:24px;color:var(--red);line-height:1.1}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;margin:16px 0 8px}
/* home */
.hero{display:flex;gap:14px;align-items:center}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2);max-width:62ch}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.bigbtn{position:relative;text-align:left;border:2px solid var(--ink);border-radius:8px;padding:18px 16px 14px;box-shadow:4px 4px 0 var(--ink);background:#fff;transition:transform .12s}
.bigbtn:before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:var(--tape);transform:rotate(-3deg);border:1px solid #d9c590}
.bigbtn:hover{transform:translateY(-2px) rotate(-.5deg)}
.bigbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.bigbtn h3{margin:0 0 4px;font-size:20px}
.bigbtn p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.bigbtn.ink{background:var(--ink);color:#fff}.bigbtn.ink p{color:#cdd6ea}
.bigbtn .n{position:absolute;right:12px;top:12px;font-family:var(--hand);font-size:26px;color:var(--red)}
.bigbtn.ink .n{color:var(--hl)}
/* lesson list */
.llist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.li{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.li:hover{background:#fffbe0}
.li .no{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px}
.li.done .no{background:var(--green);border-color:var(--green);color:#fff}
.li b{display:block;font-size:14.5px;line-height:1.25}
.li span{font-size:12px;color:var(--ink2)}
.li .mini{width:100%;height:5px;background:#e2e6ee;border-radius:3px;margin-top:5px;overflow:hidden}
.li .mini i{display:block;height:100%;background:var(--green)}
/* lesson reader */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:900;box-shadow:2px 2px 0 var(--ink);flex:none}
.hudt{font-weight:800;font-size:15px;line-height:1.2}
.hudt small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
.dots button{width:22px;height:8px;border-radius:4px;background:#cfd4de}
.dots button.on{background:var(--ink)}
.dots button.seen{background:#8fb7a0}
.card h2{margin:0 0 12px;font-size:22px;line-height:1.25}
.card .k{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:1px;margin-bottom:6px}
.card ul{margin:0;padding-left:20px;display:grid;gap:10px}
.card li{line-height:1.6;font-size:15.5px;max-width:70ch}
.card li b{background:linear-gradient(transparent 58%,var(--hl) 58% 94%,transparent 94%);padding:0 1px}
.card figure{margin:16px 0 0;text-align:center}
.card figure img{max-width:100%;max-height:300px;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:zoom-in}
.card figcaption{font-family:var(--hand);font-size:19px;color:var(--ink2);margin-top:4px}
.nav{display:flex;gap:10px;align-items:center;margin-top:16px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:10px 16px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--red);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.seg button{text-align:left;border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.seg button b{display:block;font-size:16px}.seg button span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.seg button.on{background:var(--ink);color:#fff}.seg button.on span{color:#dfe6f5}
@media(max-width:520px){.seg{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.gal figure{margin:0}.gal img{width:100%;height:130px;object-fit:contain;max-height:none}
.gal figcaption{font-family:inherit;font-size:12.5px;line-height:1.3}

.bigbtn.yel{background:#fff6c7}
.tsearch{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin:4px 0 10px}
.tgroup{margin-top:14px}.tgroup h4{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink2);margin:0 0 6px;text-transform:uppercase}
.term{display:grid;grid-template-columns:minmax(130px,30%) 1fr;gap:12px;padding:9px 10px;border-bottom:1px dashed #c9cfdc;align-items:start}
.term b{font-size:15px}.term span{font-size:14.5px;line-height:1.45}.term.known b:after{content:" ✓";color:#2e8b57}
.fc{display:block;width:100%;perspective:1200px;margin:10px auto 6px;max-width:560px;height:260px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box;backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;background:#fff}
.fc .face small{font-family:var(--mono);font-size:11px;color:var(--ink2);position:absolute;top:12px;left:14px}
.fc .front b{font-size:26px;line-height:1.25}.fc .back{transform:rotateY(180deg);background:#fff6c7}.fc .back span{font-size:17px;line-height:1.5}
.fchint{text-align:center;font-size:13px;color:var(--ink2)}
@media(max-width:560px){.term{grid-template-columns:1fr;gap:2px}.fc{height:300px}.fc .front b{font-size:22px}}

.bigbtn.grn{background:#e3f4ea}
.mgroup{margin-top:16px}.mgroup>h4{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink2);margin:0 0 8px;text-transform:uppercase}
details.mcard{border:2px solid var(--ink);border-radius:10px;background:#fff;margin:0 0 10px;box-shadow:3px 3px 0 var(--ink)}
details.mcard summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.mcard summary::-webkit-details-marker{display:none}
details.mcard summary b{font-size:16.5px;white-space:nowrap}details.mcard summary span{font-size:14px;color:var(--ink2)}
details.mcard summary:before{content:"▸";font-size:14px}details.mcard[open] summary:before{content:"▾"}
.mbody{padding:0 16px 14px 16px;font-size:14.5px;line-height:1.5}
.mbody dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--ink2);text-transform:uppercase;margin-top:10px}
.mbody dd{margin:2px 0 0}
.mbody .spot{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.mbody .spot i{font-style:normal;background:#fff6c7;border:1.5px solid var(--ink);border-radius:20px;padding:2px 9px;font-size:13px}
.mbody .vs{background:#fdecea;border-left:4px solid var(--red);padding:6px 10px;border-radius:4px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}.cmp th,.cmp td{border:1.5px solid var(--ink);padding:7px 9px;text-align:left;vertical-align:top}.cmp th{background:var(--ink);color:#fff}
.cmp td:first-child{font-weight:700;background:#f4f1e6}
@media(max-width:560px){details.mcard summary{flex-direction:column;gap:2px}details.mcard summary b{white-space:normal}.cmp{font-size:12.5px}}
em.vi{display:block;font-style:normal;font-weight:500;font-size:12.5px;color:#2a7a52;margin-top:2px}
.mbody em.vi,li em.vi,p em.vi{display:inline;font-size:.88em}
details.mcard summary b em.vi{white-space:normal}
.fc .front em.vi{display:block}
.zoom{position:fixed;inset:0;background:#0d1426e6;display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:16px}
.zoom img{max-width:100%;max-height:92vh;border-radius:8px;background:#fff}
/* quiz setup */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip.on{background:var(--ink);color:#fff}
.chip small{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.75;margin-left:4px}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:12px;cursor:pointer}
.sw{width:40px;height:22px;border-radius:99px;background:#c9cfda;border:2px solid var(--ink);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.15s}
.sw.on{background:var(--green)}.sw.on:after{left:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.mode{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:12px;box-shadow:3px 3px 0 var(--ink)}
.mode:hover{background:#fffbe0}
.mode h3{margin:0 0 3px;font-size:16px}
.mode p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.mode.red{background:var(--red);color:#fff}.mode.red p{color:#ffe3df}
/* quiz play */
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);transition:width .3s}
.score{font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap}
.timer{font-family:var(--mono);font-weight:600;border:2px solid var(--ink);border-radius:6px;padding:3px 8px;background:#fff}
.timer.low{background:var(--red);color:#fff}
.qbox{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:18px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.qbox .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-bottom:8px;letter-spacing:.5px}
.qbox .q{font-size:20px;font-weight:800;line-height:1.4}
.streak{min-height:30px;text-align:center;font-family:var(--hand);font-size:24px;color:var(--red);margin:6px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px 14px 14px 46px;min-height:78px;text-align:left;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile .sh{position:absolute;left:12px;top:50%;margin-top:-13px;width:26px;height:26px;display:grid;place-items:center;background:#fff3;border-radius:6px;font-family:var(--mono);font-size:13px}
.t0{background:var(--qa)}.t1{background:var(--qb)}.t2{background:var(--qc)}.t3{background:var(--qd)}.t4{background:#7a4fd0}.t5{background:#555}
.tile.dim{opacity:.28}
.tile.right{outline:4px solid var(--hl);outline-offset:2px;animation:pop .35s}
.tile.wrong{animation:shake .3s}
.tile.pick{outline:4px solid var(--ink);outline-offset:2px}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.fb{margin-top:14px;border:2px dashed var(--ink);border-radius:8px;padding:12px 14px;background:#fffdf3;display:none}
.fb.show{display:block}
.fb .say{font-family:var(--hand);font-size:30px;line-height:1}
.fb.good .say{color:var(--green)}.fb.bad .say{color:var(--red)}
.fb .a{font-size:14.5px;margin-top:6px;line-height:1.5}
.fb .x{font-size:13.5px;margin-top:6px;line-height:1.55;color:var(--ink2)}
.fb .warn{margin-top:6px;font-size:13.5px;background:#fff3c4;border-left:4px solid #e0a800;padding:6px 8px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:14px}
.qgrid button{height:30px;border:1.5px solid var(--ink2);border-radius:4px;background:#fff;font-family:var(--mono);font-size:11px}
.qgrid button.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.qgrid button.cur{outline:2px solid var(--red)}
.pop{position:fixed;font-family:var(--hand);font-size:32px;color:var(--green);pointer-events:none;z-index:9;animation:rise .9s forwards}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
/* result */
.grade{width:140px;height:140px;margin:4px auto;display:grid;place-items:center;font-family:var(--hand);font-size:72px;color:var(--red);position:relative;animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
.grade svg{position:absolute;inset:0}
@keyframes stamp{from{transform:scale(2) rotate(-20deg);opacity:0}}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;min-width:92px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);font-weight:600}
.rev{display:grid;gap:10px;margin-top:10px}
.rv{border:2px solid var(--ink);border-left:6px solid var(--red);border-radius:6px;background:#fff;padding:10px 12px;font-size:14px;line-height:1.5}
.rv b{display:block;margin-bottom:3px}
.rv .me{color:var(--red)}.rv .ok{color:var(--green);font-weight:700}.rv .ex{color:var(--ink2);font-size:13px;margin-top:3px}
.legend{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:16px}
@media(max-width:560px){.big2,.tiles{grid-template-columns:1fr}.page{padding:14px 12px 14px 32px}.page:before{left:21px}.holes{left:4px}.holes i{width:9px;height:9px}.qbox .q{font-size:17px}.card h2{font-size:19px}.card li{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const LESSONS = [{"id": "s01", "t": "01 · Introduction to RMD", "sub": "What research is, what the course covers", "cards": [{"h": "What is research?", "b": ["**RE + SEARCH** = to search again → **careful, repeated** observation to understand a phenomenon.", "John W. Best: research is a **formal, systematic and intensive** process of applying the scientific method, with the **procedure recorded** and the **results reported**.", "**Purpose:** to answer questions through scientific procedures → **discover the truth that is hidden and not yet discovered** (clarify existing knowledge or create new knowledge)."], "img": null, "cap": null}, {"h": "Research Methods for Design (RMD)", "b": ["**Research methods** = the specific ways designers **collect data, analyse it and interpret** its meaning.", "Examples: **observation, case study, experiments, tests, surveys**…", "Purpose of research in design: to **inform** design practice, or to support **evidence-based design decisions**."], "img": null, "cap": null}, {"h": "What does the course teach?", "b": ["How to start a line of inquiry · frame a **research question** · choose **appropriate methods** · present research to **stakeholders** · turn research into a **design brief**.", "Parts: Human-centric design → Design as practice/research/thinking → **Research essentials** → **Ethnographic** → **Qualitative** → **Quantitative** → **Visual** → **Applied** → UCD/UX.", "The course is a **'how to' guide** for beginners, not a complete textbook on research."], "img": null, "cap": null}, {"h": "Assessment", "b": ["Participation 10% · Presentation 10% · Phase 1 Proposal 5% · Phase 2 Plan 15% · Phase 3 Execution 20% · Phase 4 Report 20% · **Final Exam 20%**.", "To pass: every component > 0 · **Final Exam ≥ 4** · attendance **> 80%**.", "Main textbook: **Research for Designers – Muratovski (2nd ed., 2022)**; references: Creswell (*Research Design*) and *A Designer's Research Manual*."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **1 remaining images** from the Session 01 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "01_f5dc7d99a6", "cap": "Slide 5 · 9/11/2024"}]}]}, {"id": "s02", "t": "02 · Human-centric Design", "sub": "Industry 4.0, the future of design, working across disciplines", "cards": [{"h": "Traditional vs modern designers", "b": ["**Dieter Rams:** *'You cannot understand good design, if you do not understand people.'*", "Traditional designers relied on **intuition, 'rule of thumb' and general assumptions** + skills, specialist knowledge and aesthetic sense → many designs were just **functional forms of art** (Barcelona Chair – Mies van der Rohe; Wassily Chair – Marcel Breuer)."], "img": "02_69f26d2a2d", "cap": "Modern-day designer – Visual Communication exhibition, FPT University"}, {"h": "The four industrial revolutions", "b": ["**1st** (1784, water & steam power): **mechanized production** – Thonet No.14 chair (steam-bending).", "**2nd** (1870, electricity): **mass production** – Peter Behrens' electric kettle, 1909 ('new technology in old clothes').", "**3rd** (1969, electronics & IT): **automated production** – iPhone 4.", "**4th – Industry 4.0:** **cyber-physical systems**, IoT, robotics/cobots, AI, ML → when **HOW** is no longer the problem, the key questions are **WHAT** needs to change and **WHY** (assuming we already know **WHO** we design for)."], "img": "02_4b634dae4d", "cap": "Industry 1.0 → 4.0: mechanisation → mass production → automation → cyber-physical/IoT"}, {"h": "The future of design", "b": ["Generative design shifts the designer's role from **producer/creator → curator**.", "An **ASSET** for designers with strong **critical thinking** who are used to **framing complex problems**; a **DETRIMENT** for designers who only do **technical execution** and need a **detailed brief**.", "Designers must set aside **personal biases** and research people and their **socio-cultural-economic** context (environmental impact, politics, new technology) → design that is not only beautiful and convenient but also **sustainable, meaningful and appropriate**."], "img": null, "cap": null}, {"h": "The future of work & education", "b": ["New jobs value **judgement & decision making**; the ability to **change jobs and adapt quickly** is an advantage; demand for **soft/human skills** is rising.", "McKinsey: **400–800 million** people could lose their jobs to automation by **2030**; **more than half** of employees will need **reskilling/upskilling**.", "Education in the 1st–2nd IR: **uniform** training for **repetitive** work. **Education 4.0:** personalized & self-paced, **problem-based & collaborative**, lifelong, innovation & creativity, technology, interpersonal, accessible & inclusive, global citizenship."], "img": null, "cap": null}, {"h": "Learning & unlearning", "b": ["A shift from teaching **knowledge** to teaching **how to learn**; foundations: **critical thinking** (reasoning, analysis) + **creative thinking** (making something new).", "Heuer (1999): analysts **do not start with an empty mind** – they always carry assumptions.", "**9 intellectual standards:** **Clarity** (an example?) · **Accuracy** (how can we check it?) · **Precision** (more specific?) · **Relevance** (related to the problem?) · **Depth** (complexities?) · **Breadth** (other viewpoints?) · **Logic** (does it follow from the evidence?) · **Significance** (the most important problem?) · **Fairness** (any vested interest?)."], "img": null, "cap": null}, {"h": "Human-centric leaders", "b": ["The humanities, arts and social sciences help create **human-centric leaders**.", "Soft skills: **critical thinking, empathy, creativity, languages, philosophy, ethics, communication**.", "**Digital literacy** = understanding and contextualising **big data & new technologies**. **Global competencies:** cultural awareness, languages, teamwork, adaptability."], "img": null, "cap": null}, {"h": "Working across disciplines", "b": ["Designers move from **artistic services → strategic planners & 'thinkers'**, designing whole **systems for living**.", "**Intradisciplinary:** within one discipline (architect + architect).", "**Cross-disciplinary:** viewing one discipline **from the perspective of another** (understanding sociology through music).", "**Multidisciplinary:** disciplines **within the same field** work **in parallel** (product designer + UX/UI designer on the iPhone).", "**Interdisciplinary:** **integrating knowledge** across disciplines → can create a **new discipline**.", "**Transdisciplinary:** a **'fusion of disciplines'** – goes beyond one's own disciplinary norms to create a **new framework that transcends all disciplines**; suits **complex problems no single discipline can solve**; needs **broad methodological knowledge + many years of experience**; can **lead** interdisciplinary teams."], "img": "02_5080fecf85", "cap": null}, {"h": "Challenges of collaboration", "b": ["Reasons: **lack of understanding of other disciplines, different norms, different methodological approaches, negative attitudes & prejudice**.", "Opposing pairs: **Quantitative vs Qualitative** · **Closed vs Open** research approach · **Objectivity vs Subjectivity** (open = subjective → its objectivity is questioned) · **Causality vs Description** (describing things 'as they are' vs finding the **reasons** that cause behaviour)."], "img": "02_d71ba5148e", "cap": "Challenges of interdisciplinary collaboration"}, {"h": "Experiential learning", "b": ["The best way to learn across disciplines: **experiential learning**.", "**Problem-based:** **no brief** – students **build their own brief through exploratory research**, work **in teams**, no predefined process → curiosity, initiative, leadership.", "**Process-based:** all students get **the same brief and the same process**, results are **quite similar**, showing **individual strengths**.", "In short: in Industry 4.0 the designer is an interdisciplinary **problem solver**, shifting from **creator → curator**; what matters most is to **learn, unlearn and adapt**."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **16 remaining images** from the Session 02 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "02_519b3ceb24", "cap": "Slide 2 · Human – Centric Design"}, {"img": "02_50da8b81b2", "cap": "Slide 3 · Traditional Designer"}, {"img": "02_962de38b00", "cap": "Slide 3 · Traditional Designer"}, {"img": "02_82cbba0a12", "cap": "Slide 4 · Traditional Designer"}, {"img": "02_ee865d9bcb", "cap": "Slide 4 · Traditional Designer"}, {"img": "02_b662359a63", "cap": "Slide 5 · Traditional Designer"}, {"img": "02_44bbb22d10", "cap": "Slide 5 · Traditional Designer"}, {"img": "02_93a5249853", "cap": "Slide 7 · Industrial Revolutions"}, {"img": "02_0fac0a6105", "cap": "Slide 8 · By the mid-1850s, powered by water and steam, the First Industrial…"}, {"img": "02_c54edad59b", "cap": "Slide 9 · With the invention of electricity, by the beginning of the 1900s,…"}, {"img": "02_31a30e0f0a", "cap": "Slide 10 · Third Industrial Revolution leveraged the use of electronics and…"}, {"img": "02_e1635ee68a", "cap": "Slide 14 · Industry 4.0"}, {"img": "02_b75830c7b0", "cap": "Slide 14 · Industry 4.0"}, {"img": "02_445716197d", "cap": "Slide 14 · Industry 4.0"}, {"img": "02_c6f1b50e3c", "cap": "Slide 14 · Industry 4.0"}, {"img": "02_c4670d4e38", "cap": "Slide 18 · Future of Education"}]}]}, {"id": "s03", "t": "03 · Design as Practice, Research & Thinking", "sub": "History of the profession, design research, design thinking", "cards": [{"h": "Design practice – origins", "b": ["Early designers came from many backgrounds and contributed **artistically, decoratively and constructively** to the needs of mass products & communication (Owen, 1989).", "In Europe & the USA (early 19th → first half of the 20th century), design began as a **trade activity**.", "Design then = **making products attractive** so they **sell more**; design schools renamed themselves **art schools** → design became a **subset of art**."], "img": null, "cap": null}, {"h": "Key designers", "b": ["**Raymond Loewy (1893–1986):** 'The Man Who Shaped America', **Father of Streamlining**, **Father of Industrial Design**; started as an illustrator for Macy's and Harper's Bazaar; **1934 Sears Coldspot** refrigerator, 1938 locomotive.", "**Henry Dreyfuss (1904–1972):** Hoover Model 150 vacuum cleaner, New York Central Hudson locomotive."], "img": "03_81e9a8e0f3", "cap": "1934 Sears Coldspot Refrigerator – Raymond Loewy"}, {"h": "World War II → 1960s → 1990s", "b": ["**World War II:** the military needed more efficient machines → the new 'industrial' designers focused on **human factors & ergonomics**, mass production, efficiency, balancing natural & new materials.", "**1960s:** the focus moved from technology & form to **human needs and behavior** (from **studying objects → studying humanity**); design became a **profession**, not just a craft.", "**From the 1990s:** **design research** developed. **Biggest challenge:** design was taught under **art**, not **science** → designers struggle to apply the principles of **validity**.", "In the **Renaissance**, art & science were not separated (**Leonardo da Vinci**)."], "img": null, "cap": null}, {"h": "Design research", "b": ["The design profession moved from a **'rough, ambiguous territory' → an 'arena of reasoned inquiry'**; education must follow a **'system of orderly behavior'**.", "Because of its roots in fine & applied arts, many designers see **personal exploration** as enough; without research training they only care about **form, style, function and skills**.", "Design-driven companies do research to **understand stakeholders** – e.g. **Children's IKEA** brought in professors of child development, safety, behaviour and psychology, and tests every product to the strictest safety standards.", "**Evidence-based research** is needed for complex projects and open-ended problems. Research is based on **critical thinking** (strict rules so that it is accepted as **valid**)."], "img": "03_127992c672", "cap": "Method → Methodology → Theory → Philosophical foundations"}, {"h": "Design thinking", "b": ["Combining **creative + critical reasoning** → breakthrough innovation = **design thinking**.", "**Tim Brown (IDEO, 2020):** a **human-centered** approach to innovation that integrates **the needs of people + the possibilities of technology + the requirements for business success**.", "**Dan Formosa (Smart Design, 2012):** a new way of solving problems based on **innovation & research**.", "Design thinking **originated in product design**: designers had to work on countless objects they had never made before → they had to **research** the product, user needs and related systems."], "img": "03_df792137dc", "cap": "Design Thinking: Empathize → Define → Ideate → Prototype → Test"}, {"h": "Summary", "b": ["Design moved from **aesthetics & functionality → a strategic resource**, thanks to research.", "Designers work **in teams** and need **strategy, systems thinking and research**.", "Benefits of research: understanding **people & markets** · **challenges assumptions and identifies opportunities** · drives **innovation & entrepreneurship**.", "Research supports analysis in 4 steps: **observation → description → explanation → prescription**."], "img": "03_f5701706e2", "cap": "Design squiggle (Damien Newman): Research → Concept → Design"}, {"h": "All images from the slides", "b": ["All **39 remaining images** from the Session 03 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "03_c2f2b3048d", "cap": "Slide 3 · Design as Practice, Research, and Thinking"}, {"img": "03_1248259a3d", "cap": "Slide 4 · Design Practice"}, {"img": "03_31abecbaf4", "cap": "Slide 5 · Design Practice"}, {"img": "03_46922f26ec", "cap": "Slide 6 · Design Practice"}, {"img": "03_fc990bee7d", "cap": "Slide 6 · Design Practice"}, {"img": "03_db6447166e", "cap": "Slide 7 · Design Practice"}, {"img": "03_6b8465aae3", "cap": "Slide 8 · 1934 Sears Coldspot Refrigerator"}, {"img": "03_337f608ef2", "cap": "Slide 9 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_81323b3235", "cap": "Slide 9 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_32cd90fef3", "cap": "Slide 10 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_4a42e26b19", "cap": "Slide 10 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_a3b6c0af98", "cap": "Slide 10 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_4be80ca1e0", "cap": "Slide 11 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_e162a4b291", "cap": "Slide 11 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_3880e37d65", "cap": "Slide 11 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_ac366b0f96", "cap": "Slide 11 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_12a773ddc6", "cap": "Slide 11 · Design Practice Raymond Loewy (1893–1986)"}, {"img": "03_8c7ea06fe8", "cap": "Slide 12 · Design Practice Henry Dreyfuss (1904 – 1972)"}, {"img": "03_f406ab5082", "cap": "Slide 12 · Design Practice Henry Dreyfuss (1904 – 1972)"}, {"img": "03_672d2bff88", "cap": "Slide 12 · Design Practice Henry Dreyfuss (1904 – 1972)"}, {"img": "03_c2325aad58", "cap": "Slide 14 · During the Second World War, the military started commissioning…"}, {"img": "03_88853e4351", "cap": "Slide 17 · Design Practice"}, {"img": "03_5131c1f90c", "cap": "Slide 17 · Design Practice"}, {"img": "03_8ddb167f82", "cap": "Slide 17 · Design Practice"}, {"img": "03_d1d1f03413", "cap": "Slide 18 · Design Practice"}, {"img": "03_f961a2e741", "cap": "Slide 18 · Design Practice"}, {"img": "03_cae8ae0a88", "cap": "Slide 20 · Design Research"}, {"img": "03_e9ae3e842e", "cap": "Slide 22 · Design education has traditionally been rooted in fine and applied…"}, {"img": "03_d2661bb059", "cap": "Slide 23 · Design Research"}, {"img": "03_41fcf07115", "cap": "Slide 26 · Design Thinking"}, {"img": "03_c6c9728d68", "cap": "Slide 27 · Design Thinking"}, {"img": "03_253b96e41e", "cap": "Slide 27 · Design Thinking"}, {"img": "03_9a11dca909", "cap": "Slide 30"}, {"img": "03_b5c9fc427a", "cap": "Slide 31"}, {"img": "03_e5821c40d9", "cap": "Slide 32"}, {"img": "03_817f180563", "cap": "Slide 33"}, {"img": "03_ddd904cedd", "cap": "Slide 34"}, {"img": "03_1e8631e33b", "cap": "Slide 35 · Design as Practice, Research, and Thinking"}, {"img": "03_aca6c210a5", "cap": "Slide 36 · Design has evolved from a focus on aesthetics and functionality to…"}]}]}, {"id": "s04", "t": "04 · Research Essentials (1)", "sub": "Research problem, statement, question, literature review", "cards": [{"h": "Research problem", "b": ["= the **core issue**: a condition to improve, a difficulty to eliminate, or a theoretical/practical question to answer. It is the **first requirement** for designing a solution. **A design problem is also a research problem.**", "Order: **Research problem → Research statement → Research question/hypothesis → Literature review → Glossary of key terms**."], "img": null, "cap": null}, {"h": "3 kinds of problems NOT to choose", "b": ["**1. Just for self-enlightenment** (finding out for yourself). Wrong: *'How was the One-Pillar Pagoda built?'* → Right: the challenges of preserving its materials and how modern techniques can extend its life.", "**2. Just comparing two data sets / computing a correlation** → no critical thinking, **no 'why'**, only a statistical exercise. Wrong: *'Is there a correlation between study hours and exam scores?'*", "**3. Yes/No questions** → only scratch the surface. Wrong: *'Is social media linked to anxiety in teens?'* → Right: **how** the level of use affects anxiety and through **which mechanisms**.", "To choose well: have **enough knowledge** of the topic, follow **industry trends**, read the literature, attend conferences, ask experts; the topic should have **broader appeal**, not only personal interest."], "img": "04_753045", "cap": "One-Pillar Pagoda – the teacher's example of a wrong vs right research question"}, {"h": "Research statement", "b": ["States the problem carefully, expressing the **single goal** of the whole study + explaining its **aims & objectives**.", "**DELIMIT** = choosing the **focus & scope**, what is **included** (the boundaries). E.g. only public high-school students in Hanoi.", "**LIMIT** = **weaknesses/shortcomings** that may affect the results. E.g. self-reported data may be biased.", "Teacher's example: John S. Stevens (2009) – *Design as a Strategic Resource*: the goal is to **unify and align** design management and business strategy."], "img": null, "cap": null}, {"h": "Research question vs Hypothesis", "b": ["**Hypothesis** = *'a logical supposition, a reasonable guess, an educated conjecture'* (Leedy & Ormrod, 2010) – a **tentative** answer.", "If the data **reject** it → form a new hypothesis; if the data **support** it → it may become a **theory**.", "**Hypotheses → experimental research**; **research questions → qualitative research**. Both give the researcher a **starting point**.", "Example question: *How does time spent on social media affect FPT students' academic performance?* · Hypothesis: *Students who use it > 3 hours/day have a lower GPA than those who use it < 1 hour.*"], "img": null, "cap": null}, {"h": "Literature review", "b": ["Describes **theoretical perspectives** and gets you familiar with **previous research findings**. The researcher **does not generate data** but uses data others have collected, then comments and analyses → finds the **'gap' in the knowledge**.", "**6 types:** **Chronological** (by publication date, oldest → newest) · **Historical** (how theories/ideas developed over time – follows historical trends, not publication dates) · **Thematic** (common themes → many perspectives) · **Methodological** (compares **methods/procedures** to judge their effectiveness, e.g. qual vs quant) · **Theoretical** (how theories have framed the problem; used to **critique** theories) · **Meta-analysis** (a **quantitative** review that **statistically combines** many studies on the same question)."], "img": null, "cap": null}, {"h": "Validity, reliability, saturation, glossary", "b": ["The **stricter** the selection criteria for sources → the more **valid** the review. A good review must be **replicable** → record the **search & collection procedure** → higher **reliability**.", "**When to stop?** In theory never; in practice when the information becomes **repetitive (repetitive patterns) = saturation**.", "**Glossary of key terms:** 'For the purpose of this research, [term] will be defined as…'; definitions from dictionaries/other studies must be **cited**; place it **at the start of the proposal/report or in the appendix**."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **11 remaining images** from the Session 04 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "04_9177483e89", "cap": "Slide 4 · Define research problem"}, {"img": "04_a05250714e", "cap": "Slide 6 · Define research problem"}, {"img": "04_42620e28c7", "cap": "Slide 7 · Define research problem"}, {"img": "04_bfd8308e1c", "cap": "Slide 11 · Formulate research statement"}, {"img": "04_25e98864df", "cap": "Slide 18 · Literature review"}, {"img": "04_c97576352e", "cap": "Slide 19 · Literature review"}, {"img": "04_66bbad9ff7", "cap": "Slide 20 · Literature review"}, {"img": "04_c081e6ccec", "cap": "Slide 21 · Literature review"}, {"img": "04_1ebe4580be", "cap": "Slide 22 · Literature review"}, {"img": "04_472c44e22e", "cap": "Slide 23 · Literature review"}, {"img": "04_fa2955bcb8", "cap": "Slide 24 · Literature review"}]}]}, {"id": "s05", "t": "05 · Research Essentials (2)", "sub": "Method vs methodology, 5 approaches, triangulation, ethics", "cards": [{"h": "Method vs Methodology", "b": ["Oxford: **Method** = *'a particular procedure for accomplishing or approaching something'*; **Methodology** = *'a system of methods used in a particular area of study or activity'*.", "**Method:** techniques & procedures to **solve a problem** · a **part** of the methodology · **narrower**.", "**Methodology:** the **overall theoretical framework** explaining **why** these methods were chosen · includes the methods **and the logic** behind them · **broader**.", "Example: social media & academic performance → methodology **mixed methods** (because the question is complex); methods: **survey of 500 students** + statistical analysis, **focus group of 20 students** + **thematic analysis**."], "img": "05_9cfb00", "cap": null}, {"h": "Designers' 5 research approaches", "b": ["**Ethnographic:** studies **groups of people** – their interactions, behaviour, beliefs and perceptions – by **observing or participating** in their lives → a **holistic** understanding of cultures & subcultures.", "**Qualitative:** how individuals **see and experience the world**; in **natural settings**, rarely simplified; used when you need **in-depth/new** understanding of **unfamiliar** situations.", "**Quantitative:** **describes, simplifies and generalises**; tests **random samples**; draws **statistical** conclusions; **does not create new theory** but **verifies existing theories** or measures **variables**.", "**Visual:** analyses **'found' images & objects** (already existing) by their **appearance**; finds patterns & meaning in all media; used with qual, quant or both.", "**Applied:** helps practitioners **investigate & evaluate their own work**; rooted in **art**; two branches **practice-based** (the artefact is the basis) and **practice-led** (new understanding of the practice itself). The other three are **outer-directed**; applied is **inner-directed**. Most common: **action research**."], "img": null, "cap": null}, {"h": "Triangulation & multimethod", "b": ["**Triangulation** = **cross-checking several sources of evidence** → research that is **credible, valid and reliable**.", "4 types: **Data** (several data sources) · **Investigator** (several researchers) · **Theory** (several perspectives on the same data) · **Methodological** (several methods).", "**Methodological triangulation = multimethod research:** use qual to discover the problem, then quant to test it (or the reverse) → **flexible**, answers **confirmatory & explanatory** questions at the same time, **generates and verifies theory in the same study**."], "img": "05_c7575e", "cap": null}, {"h": "Ethics – risks to participants", "b": ["Ethics = a **system of universal moral standards**, applied at every stage: **planning, engaging with participants, publishing**.", "Risks (Kristen Larson): feeling **obliged** to take part (students, children, employees) · **deception** · physical discomfort · stress · emotional change · **loss of privacy, reputation, dignity** · belonging to a **vulnerable group** (children, the elderly, people with mental illness, the homeless…)."], "img": null, "cap": null}, {"h": "4 ethical breaches with data", "b": ["**Data Fabrication:** altering data **without recording it**, or **inventing data** to fit the hypothesis.", "**Elimination of Data:** deleting data that does not fit; if data really must be removed, **record and explain** it.", "**Exploitation of Data:** **exaggerating / overclaiming** the significance of the results.", "**Plagiarism:** presenting someone else's work/data as your own; you must **cite**."], "img": null, "cap": null}, {"h": "4 ethical principles", "b": ["**Respect** (central): human worth, **autonomy**, allowing people to **change their mind & withdraw**, respecting **privacy, confidentiality**, culture and customs.", "**Research merit & integrity:** has a genuine **benefit**; **methods suited** to the aims; based on the literature; done by competent people; **honest**; results published **whether good or bad**.", "**Justice:** **fair** selection/exclusion of participants; no unfair burden on one group; **fair distribution of benefits**; **no exploitation**; results reach the participants.", "**Beneficence:** **benefits must justify the risks**; minimise risks; state benefits & risks clearly; if the risks are no longer justified → **suspend** the research to decide whether to **stop or modify** it."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **6 remaining images** from the Session 05 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "05_715d81a80d", "cap": "Slide 7 · Choosing a research approach"}, {"img": "05_2cc6177f1b", "cap": "Slide 8 · Ethnographic Research: Ethnographic research is essentially the…"}, {"img": "05_16f06b6f9a", "cap": "Slide 17 · Respect Amongst all ethical values, the notion of respect is…"}, {"img": "05_16af9a4fc6", "cap": "Slide 18 · Research merit and integrity Research that has merit is…"}, {"img": "05_44fc80d457", "cap": "Slide 20 · Justice The processes of selection, exclusion and inclusion of…"}, {"img": "05_a9dc623253", "cap": "Slide 21 · Beneficence The benefit of the research must justify any risks of…"}]}]}, {"id": "s06", "t": "06 · Research Essentials (3)", "sub": "Writing a research proposal", "cards": [{"h": "What is a research proposal?", "b": ["An approved proposal confirms that the researcher **understands the problem** and has a **clear plan**.", "Proposal = an **outline of what researchers propose to do**. Write it **direct, clear, sharp and precise**; **no** unnecessary detail, **no** personal stories/anecdotes, nothing beyond the problem & the solution.", "Principle: **simple, clear, logical** (each organisation has its own template)."], "img": null, "cap": null}, {"h": "Proposal structure", "b": ["**Title & Subtitle** (the title sets the topic, the subtitle describes it) · **Research Problem** · **Research Question** (*what will you research?*, the more specific the better) · **Knowledge Gap** (*why* research it?) · **Stakeholders** (who **benefits / is affected**?) · **Research Implications** (social, cultural, environmental, economic significance).", "**Research Methods & Methodologies** (methods = techniques: interviews, questionnaires, video recording, participant observation, user testing; methodology = **the ideas behind the system of methods**) · **Ethical considerations** (get **ethics approval** first) · **Resources** · **Appendix 1 Glossary · Appendix 2 Budget · Appendix 3 Timetable**."], "img": null, "cap": null}, {"h": "Content distribution (often on the exam!)", "b": ["Title & subtitle **1/64** · Research problem **2/64** · Research question **1/64** · **Knowledge gap 3/16** · Stakeholders 1/16 · Research implications 1/16.", "**Research methods & methodologies 3/16** · Ethical considerations **2/16** · Resources **2/16** · Glossary 1/16 · Budget 1/16 · Timetable 1/16.", "→ The heaviest parts: **Knowledge gap** and **Methods & Methodologies** (3/16 each)."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **2 remaining images** from the Session 06 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "06_6c98685b60", "cap": "Slide 3 · The approval of the research proposal is a confirmation that the…"}, {"img": "06_938a4e74fa", "cap": "Slide 5 · Writing a research proposal"}]}]}, {"id": "s07", "t": "07 · Ethnographic Research (1)", "sub": "What ethnography is, how to conduct it", "cards": [{"h": "What does 'ethnography' mean?", "b": ["Greek roots: **'Ethnos' (ἔθνος) = people / nation** · **'Graphy' (γραφή) = writing / description** → *'writing about people'*.", "Purpose: to **observe, record and describe** the social customs, cultural expressions and everyday life of a group/community.", "Rooted in **anthropology** – the study of remote rural/tribal societies; became a formal method in the late 19th – early 20th century."], "img": "07_619acf", "cap": null}, {"h": "Definition & role in design", "b": ["**Raymond Madden (2010):** an **in-depth, systematic** study of **groups of people** by **observing or participating** in their lives.", "Studies social interactions, behaviour, beliefs and perceptions within groups/organisations/communities → **holistic** insight into cultures, subcultures and their environment (sounds, images, spaces). Done through **fieldwork**: detailed observation, participation, interviews.", "Helps designers understand **unspoken and unmet needs** → **Ethnography is the core of human-centered design**."], "img": null, "cap": null}, {"h": "Auto- & cyber-ethnography", "b": ["**Auto-ethnography:** the **researcher's own thoughts & perspectives** from social interactions are **central** (Reeves et al., 2008).", "**Cyber-ethnography** (digital/online): studies relationships & behaviour in **social networks and online communities**."], "img": null, "cap": null}, {"h": "Conducting it – 3 things to watch", "b": ["Place the researcher in the **same social space** as the participants; **do not try to control** the setting. Watch: **type of communication · level of integration · duration of study**.", "**Communication:** you need to know the community's language, but it is **not always appropriate to use it** (welcomed in some places, seen as **appropriation** in others).", "**Level of integration:** **outsider** (observing, interviewing, listening) or **insider** (taking part in activities). Too emotionally involved → **over-integrated** → results become **subjective & biased**.", "**Duration:** traditionally **12–18 months**; now **shorter** because of budget & time → **'step-in-step-out'** (familiar settings).", "**The ethnographer's main goal: 'cultural interpretation'** – presented **without prejudice, open-mindedly**."], "img": "07_fc3f94", "cap": "Kitchen Stories (2003) – the teacher's example of an observer"}, {"h": "All images from the slides", "b": ["All **6 remaining images** from the Session 07 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "07_58c7a4f6ab", "cap": "Slide 4 · What is ethnography?"}, {"img": "07_f6c2c0cc5b", "cap": "Slide 5 · What is ethnography?"}, {"img": "07_e701012989", "cap": "Slide 6 · What is ethnography?"}, {"img": "07_e0cd85e29c", "cap": "Slide 7 · What is ethnography?"}, {"img": "07_c052b3b1f4", "cap": "Slide 9 · Conducting ethnographic research Type of communication"}, {"img": "07_936c0debfd", "cap": "Slide 11 · Data collecting Duration of study"}]}]}, {"id": "s08", "t": "08 · Ethnographic Research (2)", "sub": "Data collection: 6 steps, interviews, observation, cultural probes", "cards": [{"h": "Tools & 6 steps before collecting data", "b": ["Tools: **field notes**, **informal/conversational** interviews, **cultural probes**, visual research (**video, photo-documentation, photo-elicitation, photo-essays**).", "**1. Select a community** (ideally one where you are a **'stranger'**) → **2. Identify a site** (a familiar place → hard to stay **objective**) → **3. Identify community leaders** (**gatekeepers**: influential, high status) → **4. Gain access** (through the **gatekeeper**) → **5. Establish rapport** (earn trust, explain your purpose, **'big net' approach**) → **6. Identify key informants** (people who give information & introduce others)."], "img": "08_4dd111", "cap": null}, {"h": "Interviews – 5 types", "b": ["Two reasons to interview: as the **main method**, or **combined** with other methods. Ask **open questions**, ask for clarification; digressions sometimes **reveal new issues**.", "**Structured:** rigid, suits **quantitative surveys**, answers given straight away, **no further clarification** (e.g. a 1–10 scale).", "**Semi-structured:** allows longer answers but **limited by the format** (main questions + follow-ups).", "**In-depth:** open, like a **conversation**, explores deeper feelings.", "**Focus groups:** detailed discussion, showing what people think **in the light of others' opinions**.", "**Oral histories:** people recount **past experiences & memories** in **narrative** form."], "img": null, "cap": null}, {"h": "5 steps of interviewing", "b": ["**1. Preliminary preparations:** background research, choose **representative** people, **ask permission**.", "**2. Plan the process:** face-to-face, phone, video, email, letter, survey.", "**3. Prepare questions:** prepare & rehearse; **no academic jargon**; be flexible; be culturally aware; **avoid leading questions**.", "**4. Plan documentation:** test equipment; participants **know about and agree to recording**; take notes; **put transcripts in the appendix**.", "**5. Reflect:** were your questions supported or rejected? Anything unexpected? Compare interviews. Participants **may not tell the truth** → also **observe/participate directly**."], "img": null, "cap": null}, {"h": "Observing people", "b": ["Observation = a form of **visual research**. Two scopes: **structures & settings** and **behaviors & interactions**.", "Settings: what is this place like, how does it differ from similar places, does anything in it affect social behaviour?", "Behaviours: standing/sitting/walking? noisy or quiet? friendly or hostile? gestures, distance, phone use, class/gender/age divisions, **codes of conduct**, unusual events…"], "img": "08_839d5d", "cap": null}, {"h": "Being with people (participant observation)", "b": ["Take part in the group's **normal activities** → understand the organisation's **internal culture**.", "However involved you are, keep a **critical position** and **independent reflection**. **Becoming a member of the group is not an ethnographic study!**", "Needs strong commitment from the company; plan a schedule; map the organisation; take notes every day; **adjust your questions** along the way."], "img": null, "cap": null}, {"h": "Cultural probes", "b": ["A series of **tasks** to get **inspirational responses** from users; to understand social, psychological, organisational and ergonomic factors; suits **rapid ethnography** when time and budget are short.", "Users **unintentionally guide** the process; the designer is a **facilitator & interpreter**; helps designers let go of their own 'ideal' ideas. Carried out in **natural settings**, aiming at **'design for pleasure', not 'design for utility'**.", "**Participatory visual research:** participants **create images themselves** → prompts stories and uncovers what is taken for granted."], "img": "08_b2f9a1", "cap": null}, {"h": "Cultural probe examples", "b": ["**Children** (Peta Wyeth & Carla Diercke, Univ. of Queensland): Fun Technology Collage, Subject Ratings, Classroom Architect, Technology Gadget, Brainstorming, Excursion Day Plan, Science Toy, When I Grow Up, My Journal → children liked **fun, creative, hands-on** activities (designing a gadget); the journal/collage were **less engaging**.", "**Elderly people** (**Bill Gaver, Tony Dunne – RCA, Elena Pacenti – Domus Academy**): **postcards** (questions on the back), **maps** (stickers: where they meet people, where they are alone), **disposable camera**, **photo album** of 6–10 photos, **media diary** (what they watch/listen to, with whom, when)."], "img": "08_fcf25b", "cap": null}, {"h": "All images from the slides", "b": ["All **7 remaining images** from the Session 08 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "08_203eb35476", "cap": "Slide 3 · Data collecting"}, {"img": "08_a6514c30b0", "cap": "Slide 10 · Data collecting Conducting interviews"}, {"img": "08_8c14e453c2", "cap": "Slide 11 · Data collecting Conducting interviews"}, {"img": "08_a29f01df43", "cap": "Slide 12 · Data collecting Conducting interviews"}, {"img": "08_5eafd6cbc9", "cap": "Slide 20 · Data collecting Conducting interviews"}, {"img": "08_74dad0437f", "cap": "Slide 29 · Data collecting Being with people"}, {"img": "08_05a37ed399", "cap": "Slide 31 · Data collecting Cultural probes"}]}]}, {"id": "s09", "t": "09 · Ethnographic Research (3)", "sub": "Ethics with participants, analysis, reporting", "cards": [{"h": "Informed consent", "b": ["Ethical aspects: **ethical guidance, informed consent, deception, debriefing, confidentiality, anonymity**.", "**Informed consent** = a document stating the **nature of the research, the risks, and the right to withdraw at any time**. Includes: name & institution, introduction, requirements, **withdrawal statement**, **risk**, **benefits**, confidentiality/anonymity, incentives, contact details.", "Keep **3 copies**: researcher, institution, participant. Postal questionnaires: **returning it = consent**. Ask permission to **record audio/video**. **Under 18** or people with intellectual disabilities → a **parent/guardian** signs."], "img": "09_d02f2c", "cap": null}, {"h": "Deception & debriefing", "b": ["**Deception:** withholding part of the truth, lying to steer behaviour, **covert observation**, having team members **pose as participants**.", "Only allowed when: the research has **great value** · it **does not affect** the decision to take part · there is **no other way** · participants are **debriefed immediately** afterwards and may **withdraw their data**.", "**Debriefing:** tell participants the **real purpose**, the results & conclusions, and let them **ask questions** → **reduces the impact** and corrects misunderstandings."], "img": null, "cap": null}, {"h": "Confidentiality vs Anonymity", "b": ["**Confidentiality:** the researcher **knows** the personal data but **does not disclose** it; the researcher & investigators **can trace** identities. Used in: interviews, questionnaires, phone, medical; both **qual & quant**.", "**Anonymity:** **no one, not even the researcher**, knows the personal data; **no identifiers collected** (phone, email, ID). Used in: online surveys (not all), general feedback; mostly **quant**."], "img": "09_77bb94", "cap": null}, {"h": "Analysing ethnographic data", "b": ["Collection & analysis happen **at the same time**; **visual ethnography** (drawings, photos, video) supplements field notes.", "**Step 1 – Describe:** in **chronological order**, a typical day, a **critical event**, told as a story (plot, characters).", "**Step 2 – Categorize:** identify meanings, classify by **patterns of behavior, regulations, critical events**.", "**Step 3 – Interpret:** what is the general nature of the group and its customs?"], "img": null, "cap": null}, {"h": "Reporting & hallmarks", "b": ["Ethnographic reports are usually a **personal, literary narrative**: Introduction 12% · Rationale 13% · **Context 19%** · Setting 10% · Methods 12% · **Analysis of the Group 20%** · Conclusion 14%.", "**Hallmarks:** **ethical** (respectful, polite, honest; **never abuse trust**) · **neutral** – keep **confidentiality, objectivity, personal distance** · know the community's language (but don't always use it) · **avoid getting too emotional** · write field notes **promptly and in detail** · add photos, video, audio.", "Bonus: *Decolonizing design in Africa* – François-X. N.I. Nsenga."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **5 remaining images** from the Session 09 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "09_f10bb64a7b", "cap": "Slide 3 · Ethics and research participants"}, {"img": "09_f642b9292d", "cap": "Slide 7 · Ethics and research participants Deception in research"}, {"img": "09_827cd98e1f", "cap": "Slide 9 · Ethics and research participants Debriefing"}, {"img": "09_1e22398fc8", "cap": "Slide 12 · Preparing a report"}, {"img": "09_57a082b02c", "cap": "Slide 14 · Bonus: Decolonizing design in Africa"}]}]}, {"id": "s10", "t": "10 · Qualitative Research (1)", "sub": "What qualitative research is, case studies", "cards": [{"h": "What is qualitative research?", "b": ["**In-depth** research used when there is **little information**, the **variables are unknown**, or the underlying **theory is lacking/absent**.", "Used to pose **general research problems** and **general questions** about a phenomenon. Purpose: a **rich and meaningful picture of a complex and multifaceted situation**.", "Initial questions are **loose**, then become **more specific** and turn into **hypotheses**; the methodology also evolves. Requires **careful preparation** and knowledge of **previous research**.", "Example questions: what everyday problems do elderly people face? How can urban waste be reduced? How can a better healthcare system be designed?"], "img": "10_ac759354d3", "cap": "Qualitative: observing real users in context"}, {"h": "Principles & role in design", "b": ["Role: understanding **human-centered design** (needs, preferences, behaviour), seeing real-world challenges (sustainability, **accessibility**), driving innovation.", "**Core principles:** **Open-ended questions** · **Iterative analysis** (collecting & analysing **at the same time**) · **Contextual focus** (natural settings) · **Flexibility**.", "Reveals **hidden needs & emotions**: *'Users often know what they don't want, but not what they do want.'*", "Methods: **Interviews** (structured, semi-structured, unstructured) · **Focus groups** · **Participant observation** · **Document analysis**. Ethnography is a form of qualitative research **focused on cultural context**."], "img": null, "cap": null}, {"h": "Strengths vs weaknesses", "b": ["**Strengths:** in-depth · flexibility · contextual insights · **participant-centered** (gives participants a voice) · can explore **sensitive topics** · captures **non-verbal cues** · multiple perspectives.", "**Weaknesses:** **subjectivity** · **selection bias** · **limited generalization** (small samples) · **time-consuming** · seen as **less rigorous** · **large volumes of data** are hard to manage.", "Ethics: **informed consent, confidentiality, bias reduction**.", "4 common qualitative frameworks: **Case studies · Phenomenology · Historical research · Grounded theory**."], "img": null, "cap": null}, {"h": "Case study", "b": ["A framework for studying a **complex** subject (a person, group, place, event, organisation, phenomenon) within a **defined time & context**, using **multiple data sources** → deep understanding from **multiple perspectives**.", "*'If it's messy, complex, and hard to understand… it's perfect for a case study!'* (e.g. reintroducing wolves to Yellowstone).", "Features: **in-depth focus** (one or a few cases) · **contextual** · **flexible methods** · **dynamic process**."], "img": "10_6b64118464", "cap": null}, {"h": "Types of case study", "b": ["**Exploratory:** a **starting point**, a precursor to larger research, suggests why more research is needed (e.g. AR in museums).", "**Descriptive:** a **comprehensive** description of a phenomenon; looks for links with **theory** (e.g. a fall-detection device for the elderly).", "**Explanatory:** explains **cause and effect**; uses **predictive** evidence; results are **definitive** (e.g. a website redesign that raised sales by 20%).", "**Instrumental** (one case to understand a wider issue) · **Intrinsic** (the unique case itself is the focus) · **Comparative** (comparing several cases to find patterns)."], "img": null, "cap": null}, {"h": "Conducting a case study", "b": ["**5 steps:** Define the research question → **Select case(s)** (single or multiple) → Collect data (multiple sources) → Analyze (thematic, coding, patterns) → Report.", "Choosing a case: **relevant to the question**, **enough data**, **representative** of the wider issue.", "Data sources: interviews, observations, **archival records** (service records, organizational records, maps & charts, registers, personal records, surveys – archival research has **9 steps**), **documentation** (letters, minutes, reports, previous studies, press), surveys, focus groups, usability testing, photos/video, prototypes…", "**3 principles for organising data:** **Multiple sources of evidence** · **Formation of a database** (kept separate from the report) · **Chain of evidence** (links question – data – conclusions)."], "img": "10_9d25293612", "cap": "Collecting data from multiple sources for a case study"}, {"h": "Analysing & reporting a case study", "b": ["Analysis in 5 steps: **Organize** → **Categorize** → **Interpret single instances** → **Identify patterns** → **Synthesize & generalize**.", "Report: Introduction 15% · Data gathering 19% · **Data analysis 32%** · Discussion 19% · Conclusion 15%.", "Strengths: detailed, multiple sources, flexible, verified through **triangulation**, can be studied **over time**. Weaknesses: **hard to generalize**, lots of data, **bias**, **hard to establish causality**, time-consuming."], "img": "10_a48a952534", "cap": "Before/after comparison when analysing a case"}, {"h": "All images from the slides", "b": ["All **24 remaining images** from the Session 10 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "10_ff85f686a0", "cap": "Slide 2 · Qualitative Research (part 01)"}, {"img": "10_71cf7f170b", "cap": "Slide 4 · Importance of Qualitative Research in Design"}, {"img": "10_b4ad121762", "cap": "Slide 5 · Core Principles of Qualitative Research"}, {"img": "10_6503e6972a", "cap": "Slide 8 · Methods of Data Collection in Qualitative Research"}, {"img": "10_25ebab344d", "cap": "Slide 9 · Strengths and Limitations of Qualitative Research"}, {"img": "10_13822e2129", "cap": "Slide 10 · Strengths and Limitations of Qualitative Research"}, {"img": "10_0fbd1e3fd9", "cap": "Slide 11 · Real-World Examples of Qualitative Research in Design"}, {"img": "10_a13883d678", "cap": "Slide 12 · Real-World Examples of Qualitative Research in Design"}, {"img": "10_e9dcc5c40d", "cap": "Slide 12 · Real-World Examples of Qualitative Research in Design"}, {"img": "10_08df740c09", "cap": "Slide 13 · Real-World Examples of Qualitative Research in Design"}, {"img": "10_bd6ab3902d", "cap": "Slide 14 · Ethical Considerations in Qualitative Research"}, {"img": "10_4a444c7363", "cap": "Slide 15 · What is qualitative research?"}, {"img": "10_f8875603f8", "cap": "Slide 16 · Case studies"}, {"img": "10_835e3c28e6", "cap": "Slide 18 · Why Use Case Studies in Design?"}, {"img": "10_d1e2c9f174", "cap": "Slide 19 · Characteristics of Case Studies"}, {"img": "10_8c99322653", "cap": "Slide 21 · Types of Case Studies in Design"}, {"img": "10_824184602d", "cap": "Slide 22 · Types of Case Studies in Design"}, {"img": "10_3bd8fd9a87", "cap": "Slide 23 · Types of Case Studies in Design"}, {"img": "10_7addb41601", "cap": "Slide 24 · Types of Case Studies in Design"}, {"img": "10_4780bf6f13", "cap": "Slide 25 · Types of Case Studies in Design"}, {"img": "10_fb20edb988", "cap": "Slide 26 · Types of Case Studies in Design"}, {"img": "10_447e48f0d6", "cap": "Slide 28 · Selecting the Right Case for Study"}, {"img": "10_9089329dd1", "cap": "Slide 31 · Data Collection Methods in Case Studies Archival records"}, {"img": "10_da7960f139", "cap": "Slide 35 · Reporting Findings in Case Studies"}]}]}, {"id": "s11", "t": "11 · Qualitative Research (2)", "sub": "Phenomenology & historical research", "cards": [{"h": "Phenomenology", "b": ["Founder: **Edmund Husserl** (*Logical Investigations*, 1900–01). His student **Martin Heidegger** extended it to **interpreting human existence** in its social, cultural and historical context.", "Definition (**Leedy & Ormrod, 2010**): understanding **participants' perspectives** on social realities.", "Similar to ethnography (both study other people's lives) but focuses on **individuals** rather than **groups**.", "Key question: **'What is it like to do or experience something?'** (caring for the elderly, living in social housing, working at McDonald's, using an iPad…)."], "img": "11_15a34e", "cap": null}, {"h": "Concepts & procedure", "b": ["3 concepts: **Lived experiences** · **Subjectivity** (emotions, beliefs, context) · **Essence** (the core themes of a shared experience).", "Main method: **in-depth interview** (also participant observation, focus groups).", "5 steps: **Identify the phenomenon → Recruit participants → Data collection → Data analysis → Report findings** (storytelling/narrative).", "Selecting people: **purposeful sampling** – people with **direct experience**; criteria: **direct experience, willingness & ability to reflect, variation in perspective**; **small samples**; recruited via networks, posters, social media, **snowball sampling**."], "img": null, "cap": null}, {"h": "Collecting data", "b": ["Interviews feel like a **friendly conversation**; the participant **talks the most**; continue until **saturation**.", "**Focus group:** **5–8 people**, 3–4 issues, **1.5–3 hours**; see how people adjust their views and react to others' opinions.", "**Oral history:** collects **stories**; send questions in advance; **show full respect, never argue**; record with permission.", "**In-depth interview:** predefined questions but **flexible order**. Problems: participants **appear more rational** than they are, avoid saying things that contradict their **self-image**, or answer **to please** the researcher."], "img": "11_c4e98a", "cap": null}, {"h": "Analysis, reporting, strengths/weaknesses", "b": ["Analysis in 4 steps: **Data segmentation** (separate what is relevant, divide into segments – **one idea** per segment) → **Categorization** → **Comparison** (how each person experienced it) → **Description** (describe the phenomenon through the eyes of those who experienced it).", "Report: Intro 14% · RQ 4% · **Methods & methodology 29%** · Summary 13% · Recommendation 12% · **Appendix: interview transcript 28%**.", "Strengths: deep understanding of experience, **empathy building**, unexpected insights. Weaknesses: **subjectivity**, time-consuming, **small samples** hard to generalise."], "img": null, "cap": null}, {"h": "Historical research", "b": ["Examines the **'currents and counter-currents'** of past & present events and trends → finds **patterns**, understands their impact on the present, guides the future. The focus is **interpretation** (not just gathering facts).", "Two branches: **Design history** (the **past**) and **Trend forecasting** (the **future**).", "Principles: **Contextual analysis** · **Chronological approach** · **Comparative analysis**.", "**Design history** (Huppatz & Lees-Maffei): studies artefacts, practices and behaviours to understand the past, contextualise the present and chart the future; answers *Who are we? What do we do? Where do we come from? Where are we going?*", "**Trend forecasting:** analyses change (fashion, art, colour, consumer behaviour, politics, technology) → identifies **macro trends**."], "img": "11_0154ab", "cap": null}, {"h": "Conducting historical research", "b": ["Ask about a **long-standing** issue and find the **gap**; look not only along the timeline but also at **'historical time'** (what happened at the same time) and **'historical space'** (what happened elsewhere).", "Example: the **Mini** (BMC) – its design was shaped by the fuel crisis caused by the **1956 Suez Canal crisis**.", "**Primary sources:** original materials, **direct** evidence (e.g. **Le Corbusier's** original drawings and models). **Secondary sources:** **interpret, analyse and critique** the originals; help locate primary sources. Ask: is the document **genuine or fake**? **biased** or objective?", "Analysis in 3 steps: **Explain the context → Establish the validity of the facts → Identify causation & motives**.", "Report: Intro 18% · **Example 27%** (several cases) · Discussion 23% (competing interpretations) · Reflection 14% (weaknesses) · Conclusion 18%. Weaknesses: **limited sources**, **interpretation bias**, time-consuming."], "img": "11_47116a", "cap": "The Mini – the teacher's 'historical time' example"}, {"h": "All images from the slides", "b": ["All **13 remaining images** from the Session 11 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "11_0b47a53822", "cap": "Slide 2 · Qualitative Research (part 02)"}, {"img": "11_f14298243e", "cap": "Slide 3 · Phenomenology"}, {"img": "11_eb9670ad37", "cap": "Slide 4 · Phenomenology"}, {"img": "11_3ba32995a2", "cap": "Slide 6 · Conducting Phenomenological Research"}, {"img": "11_12f00ad315", "cap": "Slide 10 · Data Collection Methods in Phenomenological Research Oral History"}, {"img": "11_0d1c42acaa", "cap": "Slide 13 · Reporting Findings in Phenomenology"}, {"img": "11_3d142478d4", "cap": "Slide 15 · Historical research"}, {"img": "11_1c6003af80", "cap": "Slide 16 · Historical research"}, {"img": "11_8bb2457181", "cap": "Slide 21 · Data Sources in Historical Research Primary Sources"}, {"img": "11_b04112c63f", "cap": "Slide 21 · Data Sources in Historical Research Primary Sources"}, {"img": "11_a56a2682bc", "cap": "Slide 22 · Data Sources in Historical Research Secondary Sources"}, {"img": "11_421e5f5e14", "cap": "Slide 23 · Analyzing Historical Data in Design Research"}, {"img": "11_9d8d6ee324", "cap": "Slide 25 · Strengths/Weakness of Historical Research"}]}]}, {"id": "s12", "t": "12 · Qualitative Research (3)", "sub": "Grounded theory & hallmarks", "cards": [{"h": "Grounded theory – origins", "b": ["Developed by sociologists **Barney Glaser & Anselm Strauss** while studying **terminally ill patients** – they saw a **gap** between existing theory and real experience.", "Adele Clarke: *'… instead of searching for answers, we get to delight in discovering more questions.'*"], "img": "12_eee66f", "cap": null}, {"h": "What is grounded theory?", "b": ["Develops **theory directly from the data**; built **inductively**, **not** from an existing framework.", "Requires knowledge of **many research techniques** and **interdisciplinary** knowledge → suits **transdisciplinary research**.", "**Non-grounded:** Hypothesis → Collect → Analyze → Theory. **Grounded:** Collect → Analyze → Theory, **repeated in many cycles**; the more cycles, the closer the data comes to a theory. Uses interviews, focus groups, observations."], "img": null, "cap": null}, {"h": "3 coding steps (remember the order!)", "b": ["**Open coding:** collect raw data → **break it down** into segments/codes → **label** them by theme, action, concept.", "**Axial coding:** **find links between codes** → form broader **categories**; **repeat** collection + open + axial coding until **saturation**.", "**Selective coding:** with enough data, combine categories & links into a **storyline** → develop a **theory** that explains the process.", "Order: **Open → Axial → Selective**."], "img": null, "cap": null}, {"h": "Reporting, strengths/weaknesses", "b": ["Style is **formal, objective, impersonal**: Intro 14% · RQ 4% · Literature review 18% · **Methodology & data analysis 29%** · Presentation of theory 14% · Implications 7% · Conclusion 14%.", "Strengths: **innovative** (new theory, not testing old theory) · flexible · **data-driven** · systematic.", "Weaknesses: subjectivity · coding is **complex and slow** · many iterations (resource-heavy) · **'washy-wishy'** – criticised for **ignoring the existing literature**.", "Examples: *Chronic Illness as Biographical Disruption* (Michael Bury); *Perceptions of climate change*; document analysis of MOOCs 2013–2015."], "img": null, "cap": null}, {"h": "Hallmarks of good qualitative research", "b": ["**9 hallmarks:** **Purpose · Disclosure · Rigor · Open-mindedness · Completeness · Coherence · Persuasiveness · Usefulness · Consensus**.", "Qualitative recap: **Case study** – a complex phenomenon, multiple sources · **Phenomenology** – lived experience via in-depth interviews, the researcher stays **neutral** · **Historical** – interpreting the past to explain causes and trends · **Grounded theory** – new theory, **collection & analysis at the same time**."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **6 remaining images** from the Session 12 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "12_a3e59bdccd", "cap": "Slide 3 · Grounded research"}, {"img": "12_e247f27b1f", "cap": "Slide 4 · Grounded research"}, {"img": "12_c71058a46d", "cap": "Slide 5 · Grounded research"}, {"img": "12_37037d7cd7", "cap": "Slide 14 · Hallmarks of good Qualitative Research"}, {"img": "12_7a84a67312", "cap": "Slide 15 · Hallmarks of good Qualitative Research"}, {"img": "12_006e00ff41", "cap": "Slide 16 · Hallmarks of good Qualitative Research"}]}]}, {"id": "s13", "t": "13 · Quantitative Research (1)", "sub": "Definition, setting, sampling, methods", "cards": [{"h": "What is quantitative research?", "b": ["**Empirical research** that uses **numerical data** to draw conclusions; includes **experimentation, objective observation, statistics**.", "Purpose: to **measure attitudes, behaviours and perceptions**; to establish **cause-and-effect**.", "Features: **independent from the researcher** · **systematic & objective** observation · data that is **measurable and verifiable**.", "Used to: **test/verify theories** · **generalise** to large populations · measure trends/behaviour. E.g. the correlation between likes & sales; how a new interface affects satisfaction."], "img": null, "cap": null}, {"h": "Setting: field vs lab", "b": ["**External setting (field study):** a **natural** environment with real-world variables → higher **external validity** (applies to real life). E.g. watching people use bunk beds at home.", "**Internal setting (controlled lab):** outside factors reduced → higher **internal validity** (isolates **cause and effect**). E.g. an **A/B test** in a usability lab."], "img": "13_939e11", "cap": null}, {"h": "Sampling", "b": ["= **selecting participants from a larger population**; you cannot test everyone → choose a **representative sample**.", "Consider: **Population description** · **Size & representation** (a **larger sample → higher validity**, reflects average characteristics) · **Stratification** (keep group **proportions**: 60% women – 40% men) · **Access** (reach people via community centres, online) · **Sampling procedure** (how to recruit, criteria, tools).", "**Sampling report** (11 parts): Introduction · Population description · Size · Individual characteristics · Stratification · Access · Procedures · Sample size · Instrumentation · Summary · **Appendix: Cover letter**."], "img": "13_7c701e", "cap": null}, {"h": "Quantitative vs Qualitative", "b": ["**Quant:** **numerical** data · **simplifies and generalises**, cause and effect · **objective**, independent of the researcher · surveys, experiments, statistics · **tests hypotheses, verifies theories**.", "**Qual:** **descriptive/textual** data · looks for **reasons and motives** · **subjective, interpretative** · in-depth interviews, focus groups, open questions · **builds new theory**."], "img": null, "cap": null}, {"h": "3 data-collection methods & trends", "b": ["**Survey:** a **structured** tool for collecting numerical data; **closed** questions (Likert, multiple-choice).", "**Experimental study:** **manipulates independent variables** and observes the effect on **dependent variables** → **cause-and-effect**, confirms/rejects hypotheses.", "**Observational study:** observes & records **without manipulating variables**; measures **how often** something happens and **under what conditions**.", "Trends: **AI/ML** for analysis; visualisation tools **Tableau, Looker**; **IoT** for data collection."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **9 remaining images** from the Session 13 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "13_95464c9372", "cap": "Slide 3 · What is quantitative research?"}, {"img": "13_0e40e90eff", "cap": "Slide 4 · What is quantitative research?"}, {"img": "13_b141a309e8", "cap": "Slide 5 · What is quantitative research?"}, {"img": "13_5e003e6ab9", "cap": "Slide 6 · What is quantitative research?"}, {"img": "13_feec7adb24", "cap": "Slide 12 · What is quantitative research?"}, {"img": "13_31c93521c3", "cap": "Slide 14 · Survey: A core Quantitative Data
