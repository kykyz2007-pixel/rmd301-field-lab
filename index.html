<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMD301 Field Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Patrick+Hand&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Field-notebook world: graph paper, ink-blue notes, highlighter yellow, red correction pen. Layout: one notebook column. */
  --paper:#eef0ea; --paper2:#fbfcf8; --grid:#cfd9e6; --ink:#1c2a4a; --ink2:#55607a;
  --hl:#ffe347; --red:#d7372b; --green:#2c8a4f; --tape:#f1e2b6;
  --qa:#e2483c; --qb:#2f6fd6; --qc:#e0a100; --qd:#2c8a4f;
  --body:"Be Vietnam Pro",system-ui,sans-serif; --hand:"Patrick Hand","Be Vietnam Pro",cursive; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 90px}
.hide{display:none!important}
h1,h2,h3{text-wrap:balance}
b,strong{font-weight:800}
/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.4px;line-height:1.05;cursor:pointer}
.top h1 small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:1px;margin-top:4px}
.spacer{flex:1}
.chipx{font-family:var(--mono);font-size:12px;font-weight:600;border:2px solid var(--ink);background:var(--paper2);padding:5px 10px;border-radius:6px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.page{position:relative;background:var(--paper2);border:2px solid var(--ink);border-radius:4px 14px 14px 4px;padding:18px 18px 18px 44px;box-shadow:5px 5px 0 var(--ink)}
.page:before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:#f2a4a0}
.holes{position:absolute;left:7px;top:18px;bottom:18px;display:flex;flex-direction:column;justify-content:space-around}
.holes i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.hand{font-family:var(--hand);font-size:24px;color:var(--red);line-height:1.1}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;margin:16px 0 8px}
/* home */
.hero{display:flex;gap:14px;align-items:center}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2);max-width:62ch}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.bigbtn{position:relative;text-align:left;border:2px solid var(--ink);border-radius:8px;padding:18px 16px 14px;box-shadow:4px 4px 0 var(--ink);background:#fff;transition:transform .12s}
.bigbtn:before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:var(--tape);transform:rotate(-3deg);border:1px solid #d9c590}
.bigbtn:hover{transform:translateY(-2px) rotate(-.5deg)}
.bigbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.bigbtn h3{margin:0 0 4px;font-size:20px}
.bigbtn p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.bigbtn.ink{background:var(--ink);color:#fff}.bigbtn.ink p{color:#cdd6ea}
.bigbtn .n{position:absolute;right:12px;top:12px;font-family:var(--hand);font-size:26px;color:var(--red)}
.bigbtn.ink .n{color:var(--hl)}
/* lesson list */
.llist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.li{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
.li:hover{background:#fffbe0}
.li .no{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px}
.li.done .no{background:var(--green);border-color:var(--green);color:#fff}
.li b{display:block;font-size:14.5px;line-height:1.25}
.li span{font-size:12px;color:var(--ink2)}
.li .mini{width:100%;height:5px;background:#e2e6ee;border-radius:3px;margin-top:5px;overflow:hidden}
.li .mini i{display:block;height:100%;background:var(--green)}
/* lesson reader */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:900;box-shadow:2px 2px 0 var(--ink);flex:none}
.hudt{font-weight:800;font-size:15px;line-height:1.2}
.hudt small{display:block;font-weight:500;color:var(--ink2);font-size:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
.dots button{width:22px;height:8px;border-radius:4px;background:#cfd4de}
.dots button.on{background:var(--ink)}
.dots button.seen{background:#8fb7a0}
.card h2{margin:0 0 12px;font-size:22px;line-height:1.25}
.card .k{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:1px;margin-bottom:6px}
.card ul{margin:0;padding-left:20px;display:grid;gap:10px}
.card li{line-height:1.6;font-size:15.5px;max-width:70ch}
.card li b{background:linear-gradient(transparent 58%,var(--hl) 58% 94%,transparent 94%);padding:0 1px}
.card figure{margin:16px 0 0;text-align:center}
.card figure img{max-width:100%;max-height:300px;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:zoom-in}
.card figcaption{font-family:var(--hand);font-size:19px;color:var(--ink2);margin-top:4px}
.nav{display:flex;gap:10px;align-items:center;margin-top:16px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:10px 16px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--red);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.zoom{position:fixed;inset:0;background:#0d1426e6;display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:16px}
.zoom img{max-width:100%;max-height:92vh;border-radius:8px;background:#fff}
/* quiz setup */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip.on{background:var(--ink);color:#fff}
.chip small{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.75;margin-left:4px}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:12px;cursor:pointer}
.sw{width:40px;height:22px;border-radius:99px;background:#c9cfda;border:2px solid var(--ink);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.15s}
.sw.on{background:var(--green)}.sw.on:after{left:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.mode{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:12px;box-shadow:3px 3px 0 var(--ink)}
.mode:hover{background:#fffbe0}
.mode h3{margin:0 0 3px;font-size:16px}
.mode p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.mode.red{background:var(--red);color:#fff}.mode.red p{color:#ffe3df}
/* quiz play */
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);transition:width .3s}
.score{font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap}
.timer{font-family:var(--mono);font-weight:600;border:2px solid var(--ink);border-radius:6px;padding:3px 8px;background:#fff}
.timer.low{background:var(--red);color:#fff}
.qbox{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:18px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.qbox .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-bottom:8px;letter-spacing:.5px}
.qbox .q{font-size:20px;font-weight:800;line-height:1.4}
.streak{min-height:30px;text-align:center;font-family:var(--hand);font-size:24px;color:var(--red);margin:6px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:14px 14px 14px 46px;min-height:78px;text-align:left;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile .sh{position:absolute;left:12px;top:50%;margin-top:-13px;width:26px;height:26px;display:grid;place-items:center;background:#fff3;border-radius:6px;font-family:var(--mono);font-size:13px}
.t0{background:var(--qa)}.t1{background:var(--qb)}.t2{background:var(--qc)}.t3{background:var(--qd)}.t4{background:#7a4fd0}.t5{background:#555}
.tile.dim{opacity:.28}
.tile.right{outline:4px solid var(--hl);outline-offset:2px;animation:pop .35s}
.tile.wrong{animation:shake .3s}
.tile.pick{outline:4px solid var(--ink);outline-offset:2px}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.fb{margin-top:14px;border:2px dashed var(--ink);border-radius:8px;padding:12px 14px;background:#fffdf3;display:none}
.fb.show{display:block}
.fb .say{font-family:var(--hand);font-size:30px;line-height:1}
.fb.good .say{color:var(--green)}.fb.bad .say{color:var(--red)}
.fb .a{font-size:14.5px;margin-top:6px;line-height:1.5}
.fb .x{font-size:13.5px;margin-top:6px;line-height:1.55;color:var(--ink2)}
.fb .warn{margin-top:6px;font-size:13.5px;background:#fff3c4;border-left:4px solid #e0a800;padding:6px 8px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:14px}
.qgrid button{height:30px;border:1.5px solid var(--ink2);border-radius:4px;background:#fff;font-family:var(--mono);font-size:11px}
.qgrid button.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.qgrid button.cur{outline:2px solid var(--red)}
.pop{position:fixed;font-family:var(--hand);font-size:32px;color:var(--green);pointer-events:none;z-index:9;animation:rise .9s forwards}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
/* result */
.grade{width:140px;height:140px;margin:4px auto;display:grid;place-items:center;font-family:var(--hand);font-size:72px;color:var(--red);position:relative;animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
.grade svg{position:absolute;inset:0}
@keyframes stamp{from{transform:scale(2) rotate(-20deg);opacity:0}}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;min-width:92px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);font-weight:600}
.rev{display:grid;gap:10px;margin-top:10px}
.rv{border:2px solid var(--ink);border-left:6px solid var(--red);border-radius:6px;background:#fff;padding:10px 12px;font-size:14px;line-height:1.5}
.rv b{display:block;margin-bottom:3px}
.rv .me{color:var(--red)}.rv .ok{color:var(--green);font-weight:700}.rv .ex{color:var(--ink2);font-size:13px;margin-top:3px}
.legend{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:16px}
@media(max-width:560px){.big2,.tiles{grid-template-columns:1fr}.page{padding:14px 12px 14px 32px}.page:before{left:21px}.holes{left:4px}.holes i{width:9px;height:9px}.qbox .q{font-size:17px}.card h2{font-size:19px}.card li{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const LESSONS = [{"id": "s01", "t": "01 · Introduction to RMD", "sub": "Research là gì, môn học gồm gì", "cards": [{"h": "Research là gì?", "b": ["**RE + SEARCH** = tìm đi tìm lại → quan sát **nhiều lần** để hiểu một hiện tượng.", "John W. Best: research là quá trình **formal, systematic, intensive** áp dụng phương pháp khoa học, có **ghi lại quy trình** và **báo cáo kết quả**.", "**Mục đích:** trả lời câu hỏi bằng quy trình khoa học → **tìm ra sự thật chưa được khám phá** (làm rõ kiến thức cũ hoặc có kiến thức mới)."], "img": null, "cap": null}, {"h": "Research Methods for Design (RMD)", "b": ["**Research methods** = những cách cụ thể designer dùng để **thu thập dữ liệu, phân tích và diễn giải** ý nghĩa.", "Ví dụ: **observation, case study, experiments, tests, surveys**…", "Mục đích research trong design: **inform** (làm rõ) việc hành nghề của designer, hoặc giúp **ra quyết định thiết kế có căn cứ**."], "img": null, "cap": null}, {"h": "Môn học dạy gì?", "b": ["Cách bắt đầu một hướng nghiên cứu · đặt **research question** · chọn **phương pháp phù hợp** · trình bày nghiên cứu cho **stakeholders** · biến nghiên cứu thành **design brief**.", "Các phần: Human-centric design → Design as practice/research/thinking → **Research essentials** → **Ethnographic** → **Qualitative** → **Quantitative** → **Visual** → **Applied** → UCD/UX.", "Môn chỉ là **hướng dẫn 'how to'** cho người mới, không phải sách đầy đủ về research."], "img": null, "cap": null}, {"h": "Điểm số (Assessment)", "b": ["Participation 10% · Presentation 10% · Phase 1 Proposal 5% · Phase 2 Plan 15% · Phase 3 Execution 20% · Phase 4 Report 20% · **Final Exam 20%**.", "Điều kiện qua môn: mọi cột > 0 · **Final Exam ≥ 4** · đi học **> 80%**.", "Giáo trình chính: **Research for Designers – Muratovski (2nd ed., 2022)**; tham khảo Creswell (Research Design) và *A Designer's Research Manual*."], "img": null, "cap": null}]}, {"id": "s02", "t": "02 · Human-centric Design", "sub": "Industry 4.0, tương lai nghề, liên ngành", "cards": [{"h": "Designer truyền thống vs hiện đại", "b": ["**Dieter Rams:** *'You cannot understand good design, if you do not understand people.'*", "Designer truyền thống dựa vào **intuition, 'rule of thumb', general assumptions** + kỹ năng, kiến thức chuyên ngành, cảm quan thẩm mỹ → nhiều thiết kế chỉ là **functional forms of art** (Barcelona Chair – Mies van der Rohe; Wassily Chair – Marcel Breuer)."], "img": "02_69f26d2a2d", "cap": "Modern-day designer – triển lãm Visual Communication, ĐH FPT"}, {"h": "4 cuộc cách mạng công nghiệp", "b": ["**1st** (1784, nước & hơi nước): **mechanized production** – ghế Thonet No.14 (steam-bending).", "**2nd** (1870, điện): **mass production** – ấm điện Peter Behrens 1909 ('công nghệ mới mặc áo cũ').", "**3rd** (1969, điện tử & IT): **tự động hóa** sản xuất – iPhone 4.", "**4th – Industry 4.0:** **cyber-physical systems**, IoT, robotics/cobots, AI, ML → khi **HOW** không còn là vấn đề, câu hỏi quan trọng là **WHAT** cần thay đổi và **WHY** (giả định đã biết **WHO** mình thiết kế cho)."], "img": "02_4b634dae4d", "cap": "Industry 1.0 → 4.0: cơ khí hóa → sản xuất hàng loạt → tự động hóa → cyber-physical/IoT"}, {"h": "Tương lai của Design", "b": ["Generative design đổi vai trò designer từ **producer/creator → curator**.", "Là **ASSET** cho designer có **critical thinking** tốt, quen **framing complex problems**; là **DETRIMENT** cho designer chỉ làm **technical execution** và cần **brief chi tiết**.", "Designer gác lại **personal biases**, tự nghiên cứu để hiểu con người và bối cảnh **socio-cultural-economic** (tác động môi trường, chính trị, công nghệ mới) → thiết kế không chỉ đẹp, tiện mà còn **sustainable, meaningful, appropriate**."], "img": null, "cap": null}, {"h": "Tương lai của Work & Education", "b": ["Việc mới coi trọng **judgement & decision making**; khả năng **chuyển việc, thích nghi nhanh** là lợi thế; nhu cầu **soft/human skills** tăng.", "McKinsey: **400–800 triệu** người có thể mất việc vì tự động hóa đến **2030**; **hơn một nửa** nhân viên cần **reskill/upskill**.", "Giáo dục thời 1st–2nd IR: đào tạo **đồng loạt** cho việc **lặp lại**. **Education 4.0:** personalized & self-paced, **problem-based & collaborative**, lifelong, innovation & creativity, technology, interpersonal, accessible & inclusive, global citizenship."], "img": null, "cap": null}, {"h": "Learning & Unlearning", "b": ["Chuyển từ dạy **kiến thức** sang dạy **cách học**; nền tảng: **critical thinking** (lập luận, phân tích) + **creative thinking** (tạo cái mới).", "Heuer (1999): nhà phân tích **không bắt đầu với đầu óc trống rỗng** – luôn có giả định sẵn.", "**9 intellectual standards:** **Clarity** (cho ví dụ?) · **Accuracy** (kiểm chứng thế nào?) · **Precision** (cụ thể hơn?) · **Relevance** (liên quan vấn đề?) · **Depth** (độ phức tạp?) · **Breadth** (góc nhìn khác?) · **Logic** (có suy ra từ bằng chứng?) · **Significance** (vấn đề quan trọng nhất?) · **Fairness** (có lợi ích riêng không?)."], "img": null, "cap": null}, {"h": "Human-centric leader", "b": ["Humanities, arts, social sciences giúp tạo **human-centric leaders**.", "Soft skills: **critical thinking, empathy, creativity, languages, philosophy, ethics, communication**.", "**Digital literacy** = hiểu và đặt **big data & công nghệ mới** vào bối cảnh. **Global competencies:** cultural awareness, languages, teamwork, adaptability."], "img": null, "cap": null}, {"h": "Working across disciplines", "b": ["Designer chuyển từ **artistic services → strategic planners & 'thinkers'**, thiết kế cả **systems for living**.", "**Intradisciplinary:** trong 1 ngành (kiến trúc sư + kiến trúc sư).", "**Cross-disciplinary:** nhìn ngành này qua **góc nhìn của ngành khác** (hiểu xã hội học qua âm nhạc).", "**Multidisciplinary:** các ngành **trong cùng lĩnh vực** làm **song song** (product designer + UX/UI làm iPhone).", "**Interdisciplinary:** **tích hợp kiến thức** giữa các ngành → có thể tạo **ngành mới**.", "**Transdisciplinary:** **'fusion of disciplines'** – vượt chuẩn mực ngành mình, tạo **framework mới vượt mọi ngành**; hợp vấn đề **phức tạp mà không ngành nào tự giải được**; cần **nhiều kiến thức phương pháp + nhiều năm kinh nghiệm**; có thể **dẫn dắt** nhóm liên ngành."], "img": "02_5080fecf85", "cap": null}, {"h": "Thách thức khi hợp tác", "b": ["Lý do: **thiếu hiểu biết ngành khác, chuẩn mực khác nhau, cách tiếp cận phương pháp khác, thái độ tiêu cực & định kiến**.", "Các cặp đối lập: **Quantitative vs Qualitative** · **Closed vs Open** research approach · **Objectivity vs Subjectivity** (open = subjective → bị nghi ngờ tính khách quan) · **Causality vs Description** (mô tả 'như nó là' vs tìm **lý do** gây ra hành vi)."], "img": "02_d71ba5148e", "cap": "Thách thức khi hợp tác liên ngành"}, {"h": "Experiential learning", "b": ["Cách tốt nhất để học liên ngành: **experiential learning**.", "**Problem-based:** **không có brief** – SV **tự xây brief bằng exploratory research**, làm **theo nhóm**, không có quy trình định sẵn → curiosity, initiative, leadership.", "**Process-based:** mọi SV **cùng brief, cùng quy trình**, kết quả **gần giống nhau**, thể hiện **thế mạnh cá nhân**.", "Tóm lại: Industry 4.0 → designer là **problem solver** liên ngành, vai trò **creator → curator**; quan trọng nhất là **learn, unlearn, adapt**."], "img": null, "cap": null}]}, {"id": "s03", "t": "03 · Design as Practice, Research & Thinking", "sub": "Lịch sử nghề, design research, design thinking", "cards": [{"h": "Design Practice – nguồn gốc", "b": ["Designer thời đầu đến từ nhiều nền tảng, đóng góp **artistically, decoratively, constructively** cho nhu cầu sản phẩm & truyền thông đại chúng (Owen, 1989).", "Ở châu Âu & Mỹ (đầu TK19 → nửa đầu TK20), design bắt đầu là **trade activity**.", "Design khi đó = **làm đẹp** sản phẩm để **bán được nhiều hơn**; trường design tự đổi thành **art school** → design là **subset of art**."], "img": null, "cap": null}, {"h": "Những designer tiêu biểu", "b": ["**Raymond Loewy (1893–1986):** 'The Man Who Shaped America', **Father of Streamlining**, **Father of Industrial Design**; khởi nghiệp vẽ minh họa cho Macy's, Harper's Bazaar; tủ lạnh **Sears Coldspot 1934**, đầu máy xe lửa 1938.", "**Henry Dreyfuss (1904–1972):** máy hút bụi Hoover Model 150, đầu máy New York Central Hudson."], "img": "03_81e9a8e0f3", "cap": "1934 Sears Coldspot Refrigerator – Raymond Loewy"}, {"h": "Chiến tranh → 1960s → 1990s", "b": ["**Thế chiến II:** quân đội cần máy móc hiệu quả hơn → designer 'industrial' mới tập trung **human factors & ergonomics**, mass production, hiệu suất, cân bằng vật liệu tự nhiên & mới.", "**1960s:** trọng tâm chuyển từ công nghệ & hình thức sang **human needs and behavior** (từ **study objects → study humanity**); design thành **nghề**, không chỉ là craft.", "**Từ 1990s:** **design research** phát triển. **Thách thức lớn nhất:** design được dạy dưới **art** chứ không phải **science** → designer khó áp dụng nguyên tắc **validity**.", "Thời **Phục Hưng**, art & science không tách rời (**Leonardo da Vinci**)."], "img": null, "cap": null}, {"h": "Design Research", "b": ["Nghề design chuyển từ **'rough, ambiguous territory' → 'arena of reasoned inquiry'**; đào tạo phải theo **'system of orderly behavior'**.", "Vì gốc fine & applied arts, nhiều designer coi **personal exploration** là đủ; thiếu đào tạo research → chỉ lo **form, style, function, kỹ năng**.", "Công ty design-driven làm research để **hiểu stakeholder** – ví dụ **Children's IKEA** mời giáo sư về phát triển trẻ em, an toàn, hành vi, tâm lý; test mọi sản phẩm theo chuẩn an toàn khắt khe nhất.", "**Evidence-based research** cần cho dự án phức tạp, vấn đề mở. Research dựa trên **critical thinking** (có quy tắc chặt để được công nhận **valid**)."], "img": "03_127992c672", "cap": "Method → Methodology → Theory → Philosophical foundations"}, {"h": "Design Thinking", "b": ["Kết hợp **creative + critical reasoning** → breakthrough innovation = **design thinking**.", "**Tim Brown (IDEO, 2020):** cách tiếp cận đổi mới **lấy con người làm trung tâm**, tích hợp **nhu cầu con người + khả năng công nghệ + yêu cầu kinh doanh**.", "**Dan Formosa (Smart Design, 2012):** cách giải quyết vấn đề mới dựa trên **innovation & research**.", "Design thinking **bắt nguồn từ product design**: phải làm với vô số đồ vật chưa từng làm → buộc phải **research** sản phẩm, nhu cầu người dùng và hệ thống liên quan."], "img": "03_df792137dc", "cap": "Design Thinking: Empathize → Define → Ideate → Prototype → Test"}, {"h": "Tóm tắt", "b": ["Design: từ **aesthetics & functionality → strategic resource**, nhờ research.", "Designer làm theo **nhóm**, cần **strategy, systems thinking, research**.", "Lợi ích research: hiểu **con người & thị trường** · **challenges assumptions and identifies opportunities** · thúc đẩy **innovation & entrepreneurship**.", "Research giúp phân tích qua 4 bước: **observation → description → explanation → prescription**."], "img": "03_f5701706e2", "cap": "Design squiggle (Damien Newman): Research → Concept → Design"}]}, {"id": "s04", "t": "04 · Research Essentials (1)", "sub": "Research problem, statement, question, literature review", "cards": [{"h": "Research problem", "b": ["= **vấn đề cốt lõi**: tình trạng cần cải thiện, khó khăn cần giải quyết, hoặc câu hỏi lý thuyết/thực tiễn cần tìm hiểu. Là **yêu cầu đầu tiên** để thiết kế giải pháp. **Design problem cũng là research problem.**", "Thứ tự: **Research problem → Research statement → Research question/hypothesis → Literature review → Glossary of key terms**."], "img": null, "cap": null}, {"h": "3 kiểu vấn đề KHÔNG nên chọn", "b": ["**1. Chỉ để tìm hiểu cho biết** (self-enlightenment). Sai: *'How was the One-Pillar Pagoda built?'* → Đúng: thách thức bảo tồn vật liệu và cách kỹ thuật hiện đại giúp kéo dài tuổi thọ.", "**2. Chỉ so sánh 2 bộ dữ liệu / tính tương quan** → không cần critical thinking, **không có 'why'**, chỉ là thao tác thống kê. Sai: *'Có tương quan giữa giờ học và điểm thi?'*", "**3. Câu hỏi Yes/No** → chỉ lướt bề mặt. Sai: *'Mạng xã hội có liên quan đến lo âu ở teen?'* → Đúng: mức độ dùng ảnh hưởng **thế nào** và **cơ chế** nào.", "Để chọn tốt: có **đủ kiến thức** về chủ đề, nắm **xu hướng ngành**, đọc tài liệu, dự hội thảo, hỏi chuyên gia; chủ đề phải có **broader appeal**, không chỉ vì sở thích cá nhân."], "img": "04_753045", "cap": "Chùa Một Cột – ví dụ của cô về câu hỏi nghiên cứu sai/đúng"}, {"h": "Research statement", "b": ["Diễn đạt vấn đề cẩn thận, thể hiện **mục tiêu duy nhất (single goal)** của cả nghiên cứu + giải thích **aims & objectives**.", "**DELIMIT** = lựa chọn **trọng tâm & phạm vi**, cái gì **được đưa vào** (ranh giới). VD: chỉ học sinh THPT công lập ở Hà Nội.", "**LIMIT** = **thiếu sót/hạn chế** có thể ảnh hưởng kết quả. VD: dữ liệu tự khai (self-reported) có thể bị thiên lệch.", "Ví dụ của cô: John S. Stevens (2009) – *Design as a Strategic Resource*: mục tiêu là **hợp nhất và căn chỉnh** hai lĩnh vực design management & business strategy."], "img": null, "cap": null}, {"h": "Research question vs Hypothesis", "b": ["**Hypothesis** = *'a logical supposition, a reasonable guess, an educated conjecture'* (Leedy & Ormrod, 2010) – câu trả lời **tạm thời**.", "Bị dữ liệu **bác bỏ** → đặt giả thuyết mới; được **ủng hộ** → có thể thành **theory**.", "**Hypotheses → experimental research**; **research questions → qualitative research**. Cả hai cho researcher **điểm xuất phát**.", "VD câu hỏi: *Thời gian dùng MXH ảnh hưởng thế nào tới học lực HS FPT?* · Giả thuyết: *HS dùng > 3 giờ/ngày có GPA thấp hơn HS dùng < 1 giờ.*"], "img": null, "cap": null}, {"h": "Literature review", "b": ["Mô tả các **quan điểm lý thuyết** và giúp làm quen **kết quả nghiên cứu trước**. Researcher **không tự tạo dữ liệu** mà dùng dữ liệu người khác đã thu thập, rồi bình luận, phân tích → tìm **'gap' in the knowledge**.", "**6 loại:** **Chronological** (theo năm xuất bản, cũ → mới) · **Historical** (lý thuyết/ý tưởng phát triển qua thời gian – theo xu hướng lịch sử, không theo ngày xuất bản) · **Thematic** (các chủ đề chung → xem nhiều góc nhìn) · **Methodological** (so sánh **phương pháp/quy trình** để đánh giá hiệu quả, VD qual vs quant) · **Theoretical** (các lý thuyết đã đóng khung vấn đề thế nào; dùng khi muốn **phê phán** lý thuyết) · **Meta-analysis** (review **định lượng**, **tổng hợp thống kê** nhiều nghiên cứu cùng câu hỏi)."], "img": null, "cap": null}, {"h": "Validity, reliability, saturation, glossary", "b": ["Tiêu chí chọn tài liệu **càng chặt → review càng valid**. Review tốt phải **replicable** → ghi rõ **quy trình tìm & thu thập** dữ liệu → tăng **reliability**.", "**Khi nào dừng?** Lý thuyết là không bao giờ; thực tế dừng khi thấy **thông tin lặp lại (repetitive patterns) = saturation**.", "**Glossary of key terms:** 'For the purpose of this research, [term] will be defined as…'; định nghĩa lấy từ từ điển/nghiên cứu khác phải **trích nguồn**; đặt **đầu proposal/report hoặc ở appendix**."], "img": null, "cap": null}]}, {"id": "s05", "t": "05 · Research Essentials (2)", "sub": "Method vs methodology, 5 approaches, triangulation, ethics", "cards": [{"h": "Method vs Methodology", "b": ["Oxford: **Method** = *'a particular procedure for accomplishing or approaching something'*; **Methodology** = *'a system of methods used in a particular area of study or activity'*.", "**Method:** kỹ thuật & quy trình để **giải quyết vấn đề** · là **một phần** của methodology · **hẹp hơn**.", "**Methodology:** **khung lý thuyết tổng thể** giải thích **vì sao** chọn phương pháp này · bao gồm cả methods **và logic** chọn chúng · **rộng hơn**.", "VD: đề tài MXH & học lực → methodology **mixed methods** (vì câu hỏi phức tạp); methods: **survey 500 SV** + phân tích thống kê, **focus group 20 SV** + **thematic analysis**."], "img": "05_9cfb00", "cap": null}, {"h": "5 research approaches của designer", "b": ["**Ethnographic:** nghiên cứu **nhóm người** – tương tác, hành vi, niềm tin, nhận thức; bằng cách **quan sát hoặc tham gia** vào đời sống họ → hiểu **holistic** về văn hóa & tiểu văn hóa.", "**Qualitative:** cá nhân **nhìn và trải nghiệm thế giới** thế nào; trong **natural settings**, hiếm khi đơn giản hóa; dùng khi cần hiểu **sâu/mới**, tình huống **lạ**.", "**Quantitative:** **mô tả, đơn giản hóa, khái quát**; test **random samples**; kết luận **thống kê**; **không tạo lý thuyết mới** mà **kiểm chứng lý thuyết có sẵn** hoặc đo **variables**.", "**Visual:** phân tích **'found' images & objects** (đã có sẵn) theo **vẻ ngoài**; tìm pattern & ý nghĩa trong mọi media; dùng với qual, quant hoặc cả hai.", "**Applied:** giúp người làm nghề **tự điều tra & đánh giá công việc của mình**; gốc từ **art**; 2 nhánh **practice-based** (artefact là cơ sở) và **practice-led** (hiểu biết mới về chính thực hành). 3 loại kia **outer-directed**, applied là **inner-directed**. Phổ biến nhất: **action research**."], "img": null, "cap": null}, {"h": "Triangulation & Multimethod", "b": ["**Triangulation** = **đối chiếu nhiều nguồn bằng chứng** → nghiên cứu **credible, valid, reliable**.", "4 loại: **Data** (nhiều nguồn dữ liệu) · **Investigator** (nhiều nhà nghiên cứu) · **Theory** (nhiều góc nhìn trên cùng dữ liệu) · **Methodological** (nhiều phương pháp).", "**Methodological triangulation = multimethod research:** dùng qual để phát hiện vấn đề rồi quant để kiểm tra (hoặc ngược lại) → **linh hoạt**, trả lời đồng thời câu hỏi **confirmatory & explanatory**, **tạo và kiểm chứng lý thuyết trong cùng một nghiên cứu**."], "img": "05_c7575e", "cap": null}, {"h": "Ethics – rủi ro cho người tham gia", "b": ["Ethics = **system of universal moral standards**, áp dụng mọi giai đoạn: **planning, engaging with participants, publishing**.", "Rủi ro (Kristen Larson): cảm giác **bị bắt buộc** tham gia (SV, trẻ em, nhân viên) · **deception** · khó chịu thể chất · stress · thay đổi cảm xúc · **mất privacy, danh tiếng, phẩm giá** · thuộc **nhóm dễ tổn thương** (trẻ em, người già, bệnh tâm thần, người vô gia cư…)."], "img": null, "cap": null}, {"h": "4 lỗi đạo đức với dữ liệu", "b": ["**Data Fabrication:** chỉnh dữ liệu **không ghi lại**, hoặc **bịa dữ liệu** để hợp giả thuyết.", "**Elimination of Data:** xóa dữ liệu khác biệt; nếu thật sự cần bỏ phải **ghi rõ & giải thích**.", "**Exploitation of Data:** **phóng đại / tuyên bố quá mức** ý nghĩa kết quả.", "**Plagiarism:** nhận công trình/dữ liệu người khác là của mình; phải **trích dẫn**."], "img": null, "cap": null}, {"h": "4 nguyên tắc đạo đức", "b": ["**Respect** (trung tâm): giá trị con người, **autonomy**, cho phép **đổi ý & rút lui**, tôn trọng **privacy, confidentiality**, văn hóa, phong tục.", "**Research merit & integrity:** có **lợi ích** chính đáng; **phương pháp phù hợp** mục tiêu; dựa trên literature; người làm có năng lực; **trung thực**; công bố kết quả **dù tốt hay xấu**.", "**Justice:** chọn/loại người tham gia **công bằng**; không dồn gánh nặng lên một nhóm; **chia lợi ích công bằng**; **không bóc lột**; kết quả đến được với người tham gia.", "**Beneficence:** **lợi ích phải biện minh cho rủi ro**; giảm thiểu rủi ro; nói rõ lợi ích & rủi ro; nếu rủi ro không còn xứng → **tạm dừng** để xem nên **dừng hẳn hoặc sửa**."], "img": null, "cap": null}]}, {"id": "s06", "t": "06 · Research Essentials (3)", "sub": "Viết research proposal", "cards": [{"h": "Research proposal là gì?", "b": ["Proposal được duyệt = xác nhận researcher **hiểu vấn đề** và có **kế hoạch rõ ràng**.", "Proposal = **outline of what researchers propose to do**. Viết **thẳng, rõ, sắc, chính xác**; **không** chi tiết thừa, **không** chuyện cá nhân/giai thoại, không gì ngoài vấn đề & giải pháp.", "Nguyên tắc: **simple, clear, logical** (mỗi tổ chức có template riêng)."], "img": null, "cap": null}, {"h": "Cấu trúc proposal", "b": ["**Title & Subtitle** (title đặt chủ đề, subtitle mô tả) · **Research Problem** · **Research Question** (*sẽ nghiên cứu gì?*, càng cụ thể càng tốt) · **Knowledge Gap** (*vì sao* nghiên cứu?) · **Stakeholders** (ai **hưởng lợi/bị ảnh hưởng**?) · **Research Implications** (ý nghĩa xã hội, văn hóa, môi trường, kinh tế).", "**Research Methods & Methodologies** (methods = kỹ thuật: phỏng vấn, bảng hỏi, quay video, participant observation, user testing; methodology = **ý tưởng đằng sau hệ thống phương pháp**) · **Ethical considerations** (xin **ethics approval** trước) · **Resources** · **Appendix 1 Glossary · Appendix 2 Budget · Appendix 3 Timetable**."], "img": null, "cap": null}, {"h": "Tỷ trọng nội dung (hay ra thi!)", "b": ["Title & subtitle **1/64** · Research problem **2/64** · Research question **1/64** · **Knowledge gap 3/16** · Stakeholders 1/16 · Research implications 1/16.", "**Research methods & methodologies 3/16** · Ethical considerations **2/16** · Resources **2/16** · Glossary 1/16 · Budget 1/16 · Timetable 1/16.", "→ Phần nặng nhất: **Knowledge gap** và **Methods & Methodologies** (3/16 mỗi phần)."], "img": null, "cap": null}]}, {"id": "s07", "t": "07 · Ethnographic Research (1)", "sub": "Ethnography là gì, cách tiến hành", "cards": [{"h": "Ethnography nghĩa là gì?", "b": ["Gốc Hy Lạp: **'Ethnos' (ἔθνος) = people / nation** · **'Graphy' (γραφή) = writing / description** → *'writing about people'*.", "Mục đích: **quan sát, ghi chép, mô tả** tập quán xã hội, biểu hiện văn hóa và đời sống hằng ngày của một nhóm/cộng đồng.", "Gốc từ **anthropology** (nhân học) – nghiên cứu xã hội nông thôn/bộ lạc xa xôi; thành phương pháp chính thức cuối TK19 – đầu TK20."], "img": "07_619acf", "cap": null}, {"h": "Định nghĩa & vai trò trong design", "b": ["**Raymond Madden (2010):** nghiên cứu **in-depth, systematic** về **groups of people** bằng **observing or participating** in their lives.", "Nghiên cứu tương tác xã hội, hành vi, niềm tin, nhận thức trong nhóm/tổ chức/cộng đồng → insight **holistic** về văn hóa, tiểu văn hóa và môi trường (âm thanh, hình ảnh, không gian). Làm qua **fieldwork**: quan sát chi tiết, tham gia, phỏng vấn.", "Giúp designer hiểu **unspoken and unmet needs** → **Ethnography is the core of human-centered design**."], "img": null, "cap": null}, {"h": "Auto- & Cyber-ethnography", "b": ["**Auto-ethnography:** **suy nghĩ & góc nhìn của chính researcher** từ tương tác xã hội là **trung tâm** (Reeves et al., 2008).", "**Cyber-ethnography** (digital/online): nghiên cứu quan hệ & hành vi trong **mạng xã hội, cộng đồng online**."], "img": null, "cap": null}, {"h": "Khi tiến hành, chú ý 3 điều", "b": ["Đặt researcher vào **cùng không gian xã hội** với người tham gia; **không cố kiểm soát** hiện trường. Chú ý: **type of communication · level of integration · duration of study**.", "**Communication:** cần biết ngôn ngữ cộng đồng nhưng **không phải lúc nào cũng nên dùng** (có nơi được khen, có nơi bị xem là **chiếm dụng**).", "**Level of integration:** **outsider** (quan sát, phỏng vấn, lắng nghe) hoặc **insider** (tham gia hoạt động). Quá cảm xúc → **over-integrated** → kết quả **subjective & biased**.", "**Duration:** trước đây **12–18 tháng**; nay **ngắn hơn** do kinh phí & thời gian → **'step-in-step-out'** (bối cảnh quen thuộc).", "**Mục tiêu chính của ethnographer: 'cultural interpretation'** – trình bày **không định kiến, cởi mở**."], "img": "07_fc3f94", "cap": "Phim Kitchen Stories (2003) – ví dụ của cô về người quan sát"}]}, {"id": "s08", "t": "08 · Ethnographic Research (2)", "sub": "Thu thập dữ liệu: 6 bước, phỏng vấn, quan sát, cultural probes", "cards": [{"h": "Công cụ & 6 bước trước khi thu thập", "b": ["Công cụ: **field notes**, phỏng vấn **informal/conversational**, **cultural probes**, visual research (**video, photo-documentation, photo-elicitation, photo-essays**).", "**1. Select a community** (lý tưởng là nơi mình là **'stranger'**) → **2. Identify a site** (nơi quen → khó **khách quan**) → **3. Identify community leaders** (**gatekeeper**: có ảnh hưởng, địa vị) → **4. Gain access** (qua **gatekeeper**) → **5. Establish rapport** (lấy niềm tin, nói rõ mục đích, **'big net' approach**) → **6. Identify key informants** (người cung cấp thông tin & giới thiệu người khác)."], "img": "08_4dd111", "cap": null}, {"h": "Phỏng vấn – 5 loại", "b": ["2 lý do phỏng vấn: là **phương pháp chính**, hoặc **kết hợp** phương pháp khác. Hỏi **câu mở**, xin làm rõ; lạc đề đôi khi **lộ ra vấn đề mới**.", "**Structured:** cứng nhắc, hợp **survey định lượng**, trả lời ngay, **không làm rõ thêm** (VD: thang 1–10).", "**Semi-structured:** cho trả lời dài hơn nhưng **giới hạn bởi format** (câu chính + follow-up).", "**In-depth:** mở, như **trò chuyện**, khám phá cảm nhận sâu.", "**Focus groups:** thảo luận chi tiết, xem người ta nghĩ gì **trong ánh sáng ý kiến người khác**.", "**Oral histories:** kể về **trải nghiệm & ký ức quá khứ**, dạng **narrative**."], "img": null, "cap": null}, {"h": "5 bước phỏng vấn", "b": ["**1. Preliminary preparations:** tìm hiểu nền, chọn người **đại diện**, **xin phép**.", "**2. Plan the process:** trực tiếp, điện thoại, video, email, thư, survey.", "**3. Prepare questions:** chuẩn bị & luyện trước; **không dùng thuật ngữ học thuật**; linh hoạt; chú ý văn hóa; **tránh câu dẫn dắt**.", "**4. Plan documentation:** test thiết bị; người tham gia **biết và đồng ý ghi âm**; ghi chú; **transcript để ở appendix**.", "**5. Reflect:** câu hỏi được ủng hộ hay bác bỏ? Có gì bất ngờ? So sánh các cuộc phỏng vấn. Người tham gia **có thể không nói thật** → nên **quan sát/tham gia trực tiếp**."], "img": null, "cap": null}, {"h": "Observing people", "b": ["Quan sát = một dạng **visual research**. 2 phạm vi: **structures & settings** và **behaviors & interactions**.", "Settings: nơi này thế nào, khác nơi tương tự ra sao, có yếu tố nào ảnh hưởng hành vi xã hội?", "Behaviors: đứng/ngồi/đi? ồn hay yên? thân thiện hay thù địch? cử chỉ, khoảng cách, dùng điện thoại, phân chia giai cấp/giới/tuổi, **codes of conduct**, sự kiện bất thường…"], "img": "08_839d5d", "cap": null}, {"h": "Being with people (participant observation)", "b": ["Tham gia **hoạt động bình thường** của nhóm → hiểu **văn hóa nội bộ** của tổ chức.", "Dù tham gia đến đâu cũng phải giữ **critical position** và **independent reflection**. **Becoming a member of the group is not an ethnographic study!**", "Cần công ty cam kết cao; lập kế hoạch & lịch; vẽ sơ đồ tổ chức; ghi chú mỗi ngày; **điều chỉnh câu hỏi** trong quá trình."], "img": null, "cap": null}, {"h": "Cultural probes", "b": ["Chuỗi **nhiệm vụ** để lấy **phản hồi truyền cảm hứng** từ người dùng; hiểu yếu tố xã hội, tâm lý, tổ chức, ergonomic; hợp **rapid ethnography** khi thiếu thời gian, kinh phí.", "Người dùng **vô tình dẫn dắt** quá trình, designer là **facilitator & interpreter**; giúp designer rời bỏ ý tưởng 'lý tưởng' của mình. Tiến hành trong **natural settings**, nhắm tới **'design for pleasure', không phải 'design for utility'**.", "**Participatory visual research:** người tham gia **tự tạo hình ảnh** → gợi chuyện, khám phá điều bị xem là hiển nhiên."], "img": "08_b2f9a1", "cap": null}, {"h": "Ví dụ cultural probes", "b": ["**Trẻ em** (Peta Wyeth & Carla Diercke, Univ. of Queensland): Fun Technology Collage, Subject Ratings, Classroom Architect, Technology Gadget, Brainstorming, Excursion Day Plan, Science Toy, When I Grow Up, My Journal → trẻ thích hoạt động **vui, sáng tạo, tự làm** (thiết kế gadget); journal/collage **kém hấp dẫn**.", "**Người già** (**Bill Gaver, Tony Dunne – RCA, Elena Pacenti – Domus Academy**): **postcards** (câu hỏi phía sau), **maps** (dán chấm: đi đâu gặp người, ở một mình), **disposable camera**, **photo album** 6–10 ảnh, **media diary** (xem/nghe gì, với ai, khi nào)."], "img": "08_fcf25b", "cap": null}]}, {"id": "s09", "t": "09 · Ethnographic Research (3)", "sub": "Đạo đức với người tham gia, phân tích, báo cáo", "cards": [{"h": "Informed consent", "b": ["Các khía cạnh đạo đức: **ethical guidance, informed consent, deception, debriefing, confidentiality, anonymity**.", "**Informed consent** = văn bản cho biết **bản chất nghiên cứu, rủi ro, quyền rút lui bất cứ lúc nào**. Gồm: tên & tổ chức, giới thiệu, yêu cầu, **withdrawal statement**, **risk**, **benefits**, confidentiality/anonymity, incentives, liên hệ.", "Lưu **3 bản**: researcher, institution, participant. Bảng hỏi gửi thư: **gửi lại = đồng ý**. Xin phép **ghi âm/ghi hình**. **Trẻ < 18** hoặc người khuyết tật trí tuệ → **cha mẹ/người giám hộ** ký."], "img": "09_d02f2c", "cap": null}, {"h": "Deception & Debriefing", "b": ["**Deception:** che giấu một phần, nói dối để điều khiển hành vi, **quan sát lén**, cho người trong nhóm **giả làm người tham gia**.", "Chỉ được dùng khi: **giá trị nghiên cứu lớn** · **không ảnh hưởng** quyết định tham gia · **không có cách khác** · **debrief ngay** sau đó và cho phép **rút dữ liệu**.", "**Debriefing:** cho người tham gia biết **mục đích thật**, kết quả & kết luận, được **hỏi** → **giảm tác động** và sửa hiểu lầm."], "img": null, "cap": null}, {"h": "Confidentiality vs Anonymity", "b": ["**Confidentiality:** researcher **biết** dữ liệu cá nhân nhưng **không tiết lộ** ra ngoài; researcher & investigators **truy được** danh tính. Dùng: phỏng vấn, bảng hỏi, điện thoại, y khoa; cả **qual & quant**.", "**Anonymity:** **không ai, kể cả researcher**, biết dữ liệu cá nhân; **không thu** định danh (SĐT, email, ID). Dùng: survey online (không phải tất cả), góp ý chung; chủ yếu **quant**."], "img": "09_77bb94", "cap": null}, {"h": "Phân tích dữ liệu ethnographic", "b": ["Thu thập & phân tích **diễn ra đồng thời**; kèm **visual ethnography** (vẽ, ảnh, video) bổ sung field notes.", "**Step 1 – Describe:** theo **thứ tự thời gian**, một ngày điển hình, **critical event**, kể thành câu chuyện (plot, nhân vật).", "**Step 2 – Categorize:** xác định ý nghĩa, phân loại theo **patterns of behavior, regulations, critical events**.", "**Step 3 – Interpret:** bản chất chung của nhóm và tập quán của họ là gì?"], "img": null, "cap": null}, {"h": "Báo cáo & Hallmarks", "b": ["Báo cáo ethnographic thường là **personal, literary narrative**: Introduction 12% · Rationale 13% · **Context 19%** · Setting 10% · Methods 12% · **Analysis of the Group 20%** · Conclusion 14%.", "**Hallmarks:** **ethical** (tôn trọng, lịch sự, trung thực; **không lạm dụng niềm tin**) · **neutral** – giữ **confidentiality, objectivity, personal distance** · biết ngôn ngữ cộng đồng (không phải lúc nào cũng dùng) · **tránh quá cảm xúc** · ghi field notes **kịp thời, chi tiết** · thêm ảnh, video, audio.", "Bonus: *Decolonizing design in Africa* – François-X. N.I. Nsenga."], "img": null, "cap": null}]}, {"id": "s10", "t": "10 · Qualitative Research (1)", "sub": "Qualitative là gì, case studies", "cards": [{"h": "Qualitative research là gì?", "b": ["Nghiên cứu **in-depth**, dùng khi **ít thông tin**, **biến chưa biết**, hoặc **lý thuyết nền thiếu/không có**.", "Dùng để đặt **research problems chung** và **câu hỏi chung** về hiện tượng. Mục đích: **rich and meaningful picture of a complex and multifaceted situation**.", "Câu hỏi ban đầu **lỏng**, dần **cụ thể** và thành **giả thuyết**; methodology cũng thay đổi theo. Cần **chuẩn bị kỹ** và hiểu **nghiên cứu trước**.", "VD câu hỏi: người già gặp vấn đề gì hằng ngày? Giảm rác đô thị thế nào? Thiết kế hệ thống y tế tốt hơn?"], "img": "10_ac759354d3", "cap": "Qualitative: quan sát người dùng thật trong bối cảnh"}, {"h": "Nguyên tắc & vai trò trong design", "b": ["Vai trò: hiểu **human-centered design** (nhu cầu, sở thích, hành vi), thấy thách thức thực tế (bền vững, **accessibility**), thúc đẩy đổi mới.", "**Core principles:** **Open-ended questions** · **Iterative analysis** (thu thập & phân tích **đồng thời**) · **Contextual focus** (natural settings) · **Flexibility**.", "Giúp lộ **nhu cầu ẩn & cảm xúc**: *'Users often know what they don't want, but not what they do want.'*", "Phương pháp: **Interviews** (structured, semi, unstructured) · **Focus groups** · **Participant observation** · **Document analysis**. Ethnography là một dạng qualitative, **tập trung vào bối cảnh văn hóa**."], "img": null, "cap": null}, {"h": "Strengths vs Weaknesses", "b": ["**Strengths:** in-depth · flexibility · contextual insights · **participant-centered** (cho người tham gia tiếng nói) · khai thác **chủ đề nhạy cảm** · quan sát **non-verbal cues** · nhiều góc nhìn.", "**Weaknesses:** **subjectivity** · **selection bias** · **limited generalization** (mẫu nhỏ) · **time-consuming** · bị xem là **less rigor** · **khối dữ liệu lớn** khó quản lý.", "Đạo đức: **informed consent, confidentiality, bias reduction**.", "4 khung qualitative hay dùng: **Case studies · Phenomenology · Historical research · Grounded theory**."], "img": null, "cap": null}, {"h": "Case study", "b": ["Khung nghiên cứu một chủ thể **phức tạp** (người, nhóm, nơi chốn, sự kiện, tổ chức, hiện tượng) trong **khoảng thời gian & bối cảnh xác định**, dùng **nhiều nguồn dữ liệu** → hiểu sâu qua **nhiều góc nhìn**.", "*'If it's messy, complex, and hard to understand… it's perfect for a case study!'* (VD: thả sói vào Yellowstone).", "Đặc điểm: **in-depth focus** (1 hoặc ít case) · **contextual** · **flexible methods** · **dynamic process**."], "img": "10_6b64118464", "cap": null}, {"h": "Các loại case study", "b": ["**Exploratory:** **điểm khởi đầu**, tiền đề cho nghiên cứu lớn, gợi ý vì sao cần nghiên cứu thêm (VD: AR trong bảo tàng).", "**Descriptive:** mô tả **toàn diện** một hiện tượng; tìm liên hệ với **theory** (VD: thiết bị phát hiện té ngã cho người già).", "**Explanatory:** giải thích **nhân–quả**; dùng bằng chứng **dự đoán**; kết quả **definitive** (VD: redesign web tăng 20% doanh số).", "**Instrumental** (qua một case để hiểu vấn đề rộng) · **Intrinsic** (bản thân case độc đáo là trọng tâm) · **Comparative** (so sánh nhiều case tìm pattern)."], "img": null, "cap": null}, {"h": "Tiến hành case study", "b": ["**5 bước:** Define research question → **Select case(s)** (single hay multiple) → Collect data (nhiều nguồn) → Analyze (thematic, coding, pattern) → Report.", "Chọn case: **liên quan câu hỏi**, **đủ dữ liệu**, **đại diện** vấn đề rộng.", "Nguồn dữ liệu: interviews, observations, **archival records** (service records, organizational records, maps & charts, registers, personal records, surveys – archival research **9 bước**), **documentation** (thư từ, biên bản, báo cáo, nghiên cứu trước, báo chí), surveys, focus groups, usability testing, ảnh/video, prototypes…", "**3 nguyên tắc tổ chức dữ liệu:** **Multiple sources of evidence** · **Formation of a database** (tách khỏi báo cáo) · **Chain of evidence** (liên kết câu hỏi – dữ liệu – kết luận)."], "img": "10_9d25293612", "cap": "Thu thập dữ liệu nhiều nguồn cho case study"}, {"h": "Phân tích & báo cáo case study", "b": ["Phân tích 5 bước: **Organize** → **Categorize** → **Interpret single instances** → **Identify patterns** → **Synthesize & generalize**.", "Báo cáo: Introduction 15% · Data gathering 19% · **Data analysis 32%** · Discussion 19% · Conclusion 15%.", "Mạnh: chi tiết, nhiều nguồn, linh hoạt, kiểm chứng qua **triangulation**, nghiên cứu được **theo thời gian**. Yếu: **khó khái quát**, dữ liệu nhiều, **bias**, **khó xác lập nhân quả**, tốn thời gian."], "img": "10_a48a952534", "cap": "So sánh trước/sau khi phân tích case"}]}, {"id": "s11", "t": "11 · Qualitative Research (2)", "sub": "Phenomenology & Historical research", "cards": [{"h": "Phenomenology", "b": ["Cha đẻ: **Edmund Husserl** (*Logical Investigations*, 1900–01). Học trò **Martin Heidegger** mở rộng sang **diễn giải sự tồn tại** con người trong bối cảnh xã hội, văn hóa, lịch sử.", "Định nghĩa (**Leedy & Ormrod, 2010**): hiểu **góc nhìn của người tham gia** về các thực tại xã hội.", "Giống ethnography (đều tìm hiểu đời sống người khác) nhưng tập trung vào **individuals** thay vì **groups**.", "Câu hỏi chính: **'What is it like to do or experience something?'** (chăm sóc người già, sống ở nhà ở xã hội, làm ở McDonald's, dùng iPad…)."], "img": "11_15a34e", "cap": null}, {"h": "Khái niệm & cách làm", "b": ["3 khái niệm: **Lived experiences** · **Subjectivity** (cảm xúc, niềm tin, bối cảnh) · **Essence** (chủ đề cốt lõi của trải nghiệm chung).", "Phương pháp chính: **in-depth interview** (cũng dùng participant observation, focus group).", "5 bước: **Identify the phenomenon → Recruit participants → Data collection → Data analysis → Report findings** (kể chuyện/narrative).", "Chọn người: **Purposeful sampling** – có **trải nghiệm trực tiếp**; tiêu chí: **direct experience, willingness & ability to reflect, variation in perspective**; **mẫu nhỏ**; tuyển qua mạng lưới, poster, MXH, **snowball sampling**."], "img": null, "cap": null}, {"h": "Thu thập dữ liệu", "b": ["Phỏng vấn như **trò chuyện thân mật**, người tham gia **nói nhiều nhất**; tiếp tục đến khi **saturation**.", "**Focus group:** **5–8 người**, 3–4 vấn đề, **1,5–3 giờ**; xem họ điều chỉnh quan điểm và phản ứng với ý kiến khác.", "**Oral history:** thu **câu chuyện**; gửi câu hỏi trước; **tôn trọng tuyệt đối, không tranh cãi**; ghi âm khi được phép.", "**In-depth interview:** có câu hỏi định trước nhưng **thứ tự linh hoạt**. Vấn đề: người tham gia **tỏ ra lý trí hơn**, ngại nói điều trái **hình ảnh bản thân**, trả lời **cho vừa lòng** researcher."], "img": "11_c4e98a", "cap": null}, {"h": "Phân tích, báo cáo, mạnh/yếu", "b": ["Phân tích 4 bước: **Data segmentation** (tách cái liên quan, chia thành đoạn – mỗi đoạn **một ý**) → **Categorization** → **Comparison** (cách mỗi người trải nghiệm) → **Description** (mô tả hiện tượng qua mắt người trải nghiệm).", "Báo cáo: Intro 14% · RQ 4% · **Methods & methodology 29%** · Summary 13% · Recommendation 12% · **Appendix: interview transcript 28%**.", "Mạnh: hiểu sâu trải nghiệm, **empathy building**, lộ insight bất ngờ. Yếu: **subjectivity**, tốn thời gian, **mẫu nhỏ** khó khái quát."], "img": null, "cap": null}, {"h": "Historical research", "b": ["Xem xét **'currents and counter-currents'** của sự kiện, xu hướng quá khứ & hiện tại → tìm **pattern**, hiểu tác động lên hiện tại, định hướng tương lai. Trọng tâm là **interpretation** (không chỉ gom dữ kiện).", "2 nhánh: **Design history** (**quá khứ**) và **Trend forecasting** (**tương lai**).", "Nguyên tắc: **Contextual analysis** · **Chronological approach** · **Comparative analysis**.", "**Design history** (Huppatz & Lees-Maffei): nghiên cứu artefact, thực hành, hành vi để hiểu quá khứ, đặt hiện tại vào bối cảnh, vạch hướng tương lai; trả lời *Who are we? What do we do? Where do we come from? Where are we going?*", "**Trend forecasting:** phân tích thay đổi (thời trang, nghệ thuật, màu, hành vi tiêu dùng, chính trị, công nghệ) → xác định **macro trend**."], "img": "11_0154ab", "cap": null}, {"h": "Tiến hành historical research", "b": ["Đặt câu hỏi về vấn đề **lâu dài**, tìm **gap**; xem không chỉ theo thời gian mà cả **'historical time'** (cái gì xảy ra cùng lúc) và **'historical space'** (nơi khác).", "VD: xe **Mini** (BMC) – thiết kế bị ảnh hưởng bởi khủng hoảng xăng dầu do **Suez Canal crisis 1956**.", "**Primary sources:** tư liệu gốc, bằng chứng **trực tiếp** (VD bản vẽ, mô hình gốc của **Le Corbusier**). **Secondary sources:** **diễn giải, phân tích, phê bình** nguồn gốc; giúp tìm nguồn gốc. Hỏi: tư liệu **thật hay giả**? **thiên lệch** hay khách quan?", "Phân tích 3 bước: **Explain the context → Establish the validity of the facts → Identify causation & motives**.", "Báo cáo: Intro 18% · **Example 27%** (nhiều case) · Discussion 23% (diễn giải cạnh tranh) · Reflection 14% (điểm yếu) · Conclusion 18%. Yếu: **nguồn hạn chế**, **interpretation bias**, tốn thời gian."], "img": "11_47116a", "cap": "Mini – ví dụ 'historical time' của cô"}]}, {"id": "s12", "t": "12 · Qualitative Research (3)", "sub": "Grounded theory & hallmarks", "cards": [{"h": "Grounded theory – nguồn gốc", "b": ["Do 2 nhà xã hội học **Barney Glaser & Anselm Strauss** phát triển khi nghiên cứu **bệnh nhân giai đoạn cuối** – thấy **khoảng cách** giữa lý thuyết sẵn có và trải nghiệm thật.", "Adele Clarke: *'… instead of searching for answers, we get to delight in discovering more questions.'*"], "img": "12_eee66f", "cap": null}, {"h": "Grounded theory là gì?", "b": ["Phát triển **lý thuyết trực tiếp từ dữ liệu**; xây dựng **inductively** (quy nạp), **không** từ khung có sẵn.", "Cần hiểu **nhiều kỹ thuật nghiên cứu** và kiến thức **liên ngành** → hợp **transdisciplinary research**.", "**Non-grounded:** Hypothesis → Collect → Analyze → Theory. **Grounded:** Collect → Analyze → Theory, **lặp nhiều vòng**; càng nhiều vòng dữ liệu càng gần thành lý thuyết. Dùng interviews, focus groups, observations."], "img": null, "cap": null}, {"h": "3 bước coding (nhớ thứ tự!)", "b": ["**Open coding:** thu dữ liệu thô → **chia nhỏ** thành đoạn/code → **gắn nhãn** theo chủ đề, hành động, khái niệm.", "**Axial coding:** **tìm liên kết giữa các code** → thành **category** rộng hơn; **lặp lại** thu thập + open + axial đến khi **saturation**.", "**Selective coding:** đủ dữ liệu → ghép category & liên kết thành **storyline** → phát triển **theory** giải thích quá trình.", "Thứ tự: **Open → Axial → Selective**."], "img": null, "cap": null}, {"h": "Báo cáo, mạnh/yếu", "b": ["Văn phong **formal, objective, impersonal**: Intro 14% · RQ 4% · Literature review 18% · **Methodology & data analysis 29%** · Presentation of theory 14% · Implications 7% · Conclusion 14%.", "Mạnh: **innovative** (lý thuyết mới, không test lý thuyết cũ) · flexible · **data-driven** · systematic.", "Yếu: subjectivity · coding **phức tạp, lâu** · cần lặp nhiều (tốn tài nguyên) · **'washy-wishy'** – bị chê vì **bỏ qua literature có sẵn**.", "Ví dụ: *Chronic Illness as Biographical Disruption* (Michael Bury); *Perceptions of climate change*; phân tích tài liệu MOOC 2013–2015."], "img": null, "cap": null}, {"h": "Hallmarks of good qualitative research", "b": ["**9 hallmarks:** **Purpose · Disclosure · Rigor · Open-mindedness · Completeness · Coherence · Persuasiveness · Usefulness · Consensus**.", "Tổng kết qualitative: **Case study** – hiện tượng phức tạp, nhiều nguồn · **Phenomenology** – trải nghiệm sống qua in-depth interview, researcher **trung lập** · **Historical** – diễn giải quá khứ để giải thích nhân quả, xu hướng · **Grounded theory** – lý thuyết mới, **thu thập & phân tích đồng thời**."], "img": null, "cap": null}]}, {"id": "s13", "t": "13 · Quantitative Research (1)", "sub": "Định nghĩa, setting, sampling, phương pháp", "cards": [{"h": "Quantitative research là gì?", "b": ["**Empirical research** dùng **dữ liệu số** để kết luận; gồm **experimentation, objective observation, statistics**.", "Mục đích: **đo thái độ, hành vi, nhận thức**; xác định **cause-and-effect**.", "Đặc điểm: **independent from the researcher** · quan sát **systematic & objective** · dữ liệu **đo được, kiểm chứng được**.", "Dùng khi: **test/verify theories** · **khái quát** cho quần thể lớn · đo xu hướng/hành vi. VD: tương quan like & doanh số; giao diện mới ảnh hưởng hài lòng."], "img": null, "cap": null}, {"h": "Setting: Field vs Lab", "b": ["**External setting (Field study):** môi trường **tự nhiên**, biến thực tế ảnh hưởng → tăng **external validity** (áp dụng thực tế). VD: xem người dùng giường tầng ở nhà.", "**Internal setting (Controlled lab):** giảm yếu tố ngoài → tăng **internal validity** (tách **nhân–quả**). VD: **A/B test** trong usability lab."], "img": "13_939e11", "cap": null}, {"h": "Sampling", "b": ["= **chọn người tham gia từ một population lớn**; không thể test tất cả → chọn **representative sample**.", "Cân nhắc: **Population description** · **Size & representation** (mẫu **lớn hơn → validity cao hơn**, phản ánh đặc điểm trung bình) · **Stratification** (giữ **tỷ lệ** nhóm: 60% nữ – 40% nam) · **Access** (tiếp cận qua trung tâm cộng đồng, online) · **Sampling procedure** (tuyển thế nào, tiêu chí, công cụ).", "**Sampling report** (11 mục): Introduction · Population description · Size · Individual characteristics · Stratification · Access · Procedures · Sample size · Instrumentation · Summary · **Appendix: Cover letter**."], "img": "13_7c701e", "cap": null}, {"h": "Quantitative vs Qualitative", "b": ["**Quant:** dữ liệu **số** · **đơn giản hóa, khái quát**, nhân–quả · **objective**, độc lập researcher · survey, experiment, thống kê · **test hypotheses, verify theories**.", "**Qual:** dữ liệu **mô tả/chữ** · tìm **lý do, động cơ** · **subjective, interpretative** · in-depth interview, focus group, câu hỏi mở · **xây lý thuyết mới**."], "img": null, "cap": null}, {"h": "3 phương pháp thu thập & xu hướng", "b": ["**Survey:** công cụ **có cấu trúc** thu dữ liệu số; câu **đóng** (Likert, multiple-choice).", "**Experimental study:** **thao tác independent variables**, quan sát tác động lên **dependent variables** → **cause-and-effect**, xác nhận/bác bỏ giả thuyết.", "**Observational study:** quan sát & ghi **không thao tác biến**; đo **tần suất (how often)** và **điều kiện** xảy ra.", "Xu hướng: **AI/ML** phân tích; công cụ trực quan **Tableau, Looker**; **IoT** thu dữ liệu."], "img": null, "cap": null}]}, {"id": "s14", "t": "14 · Quantitative Research (2)", "sub": "Lập kế hoạch survey, loại câu hỏi, lưu ý", "cards": [{"h": "Lập kế hoạch survey (6 bước)", "b": ["Xác định **mục đích** trước; câu hỏi phải thu được **dữ liệu định lượng**.", "**1. Define purpose → 2. Prepare questions → 3. Specify sequence → 4. Outline distribution → 5. Decide how to administer responses → 6. Pre-test & review**."], "img": null, "cap": null}, {"h": "Hình thức thu thập", "b": ["**Face-to-face:** tỷ lệ trả lời **cao**, hỏi sâu, làm rõ ngay · **tốn thời gian, tiền**, cần người phỏng vấn được đào tạo.", "**Remote (phone/video):** nhanh, rẻ hơn, vẫn làm rõ được · tỷ lệ thấp hơn, khó đọc ngôn ngữ cơ thể.", "**Written questionnaires:** chuẩn hóa, dễ phân tích, tiếp cận rộng, **không interviewer bias** · tỷ lệ thấp, không làm rõ được.", "**Online surveys:** rẻ, mở rộng dễ, tự ghi kết quả · **self-selection bias**, cần **internet**, không làm rõ được."], "img": null, "cap": null}, {"h": "6 loại câu hỏi", "b": ["**Dichotomous:** 2 lựa chọn (Yes/No) → dữ liệu nhị phân.", "**Single selection (categorization):** chọn 1 trong nhóm định sẵn (Sedan/SUV/Other).", "**Checklist / Multi selection:** chọn **nhiều** đáp án (thiết bị bạn có).", "**Ranking:** **xếp hạng** ưu tiên (1 = quan trọng nhất).", "**Scale:** **Likert** (Strongly disagree → Strongly agree) & **Semantic differential** (Unpleasant □□□□□ Pleasant).", "**Open-ended:** trả lời tự do → **bổ sung insight định tính**."], "img": "14_6fe28a", "cap": null}, {"h": "8 lưu ý khi làm survey", "b": ["**Brevity** (ngắn, tránh mệt) · **Clear & exhaustive options** (đủ lựa chọn, có **'Other (please specify)'**, loại trừ nhau) · **Avoiding bias** (bỏ câu **dẫn dắt**, ngôn ngữ trung lập) · **Consistency** (cấu trúc, thang đo thống nhất).", "**Effective design** (tiêu đề, hướng dẫn, nhóm câu hỏi) · **Pilot testing** (thử nhóm nhỏ trước) · **Accessibility** (người khuyết tật, bản in/điện thoại) · **Anonymity & confidentiality** (tăng **trung thực**; tránh thu email/ID nếu không cần)."], "img": null, "cap": null}]}, {"id": "s15", "t": "15 · Quantitative Research (3)", "sub": "Experiment, observation, phân tích, báo cáo", "cards": [{"h": "Experimental study", "b": ["Thao tác **independent variables**, đo tác động lên **dependent variables** → **cause-and-effect**.", "**Lab-based:** môi trường **kiểm soát** – usability lab có **kính một chiều, camera ẩn**; kiểm soát độ dài phiên, cách điều hướng…", "**Real-world:** ngoài thực địa với người dùng thật – VD **VR usability testing** (kiểm soát ánh sáng, âm thanh, độ mệt)."], "img": "15_90e012", "cap": null}, {"h": "Observational study", "b": ["Quan sát & ghi **không thao tác biến/môi trường**; đo **tần suất** và **điều kiện**. VD: **Google Analytics**.", "Quan sát định lượng mang tính **mô tả**, trọng tâm rõ; mấu chốt là **khách quan** khi thu & đánh giá.", "VD: **eye-tracking** tài xế nhìn dashboard; khách nhìn **bao bì & kệ hàng** (heatmap)."], "img": "15_b67c0d", "cap": null}, {"h": "Phân tích dữ liệu", "b": ["Các bước: **nhóm** theo nhân khẩu/biến (giới, tuổi, nơi ở) → tìm **pattern** giữa các nhóm → dùng công cụ thống kê (**correlation, frequency distribution**).", "**Data quality:** **Data cleaning** (giá trị thiếu, **trùng lặp**, outliers – Excel/Python) · **Anomaly detection** (VD tuổi 200).", "**Descriptive statistics:** mô tả đặc điểm thấy được – **Mean** (trung bình), **Median** (giữa), **Mode** (xuất hiện nhiều nhất).", "**Inferential statistics:** **khái quát** cho tập lớn từ mẫu – **hypothesis testing (t-test)**, **ANOVA** so sánh nhiều nhóm."], "img": "15_258139", "cap": null}, {"h": "Báo cáo & Hallmark", "b": ["Báo cáo: **Introduction** (vấn đề, mục tiêu) → **Methodology** → **Results** (bảng, biểu đồ) → **Discussion** (diễn giải theo nghiên cứu trước, **hạn chế**, bước tiếp).", "Đạo đức: ẩn danh & bảo mật, **informed consent**; trình bày dễ hiểu, không thuật ngữ, biểu đồ dễ đọc, **alt-text**.", "**Hallmark – quy trình 7 bước:** **Observation → Research question → Hypothesis → Prediction → Test → Negative results** (sửa giả thuyết) / **Positive results** (xác lập kết quả).", "Tóm tắt: **External (fieldwork)** vs **Internal (lab)**; chọn người bằng **random sampling**; ứng dụng: **survey** & **experimental research**."], "img": null, "cap": null}]}, {"id": "s16", "t": "16 · Visual Research", "sub": "Visual & material culture, 4 phương pháp, quảng cáo", "cards": [{"h": "Visual research là gì?", "b": ["Lịch sử: khoa học tự nhiên dùng hình vẽ, ảnh; nhân học/xã hội học dùng ảnh làm **ethnographic observation** (*Trance and Dance in Bali* – Margaret Mead & Gregory Bateson).", "Số hóa, điện thoại có camera, mạng xã hội → dễ chụp, lưu, chia sẻ; nhưng **'A camera can lie!'** – dữ liệu hình ảnh **có thể bị thao túng**.", "**Berger (1972):** xã hội bị **chi phối bởi hình ảnh và đồ vật**.", "Định nghĩa: nghiên cứu & diễn giải **IMAGES, FORMS, OBJECTS** trong **visual & material CULTURE** (typography, quảng cáo, kiến trúc…); hiểu cả **tác động xã hội**, không chỉ đẹp."], "img": null, "cap": null}, {"h": "Visual culture vs Material culture", "b": ["Định nghĩa Oxford: **Culture, Form** (hình dạng thấy được), **Object** (vật chạm được), **Image** (hình biểu diễn).", "**Visual culture (Mirzoeff, 1999):** vai trò hình ảnh trong đời sống; thách thức việc **ưu tiên chữ hơn hình**; nhấn mạnh **visual literacy**.", "**Material culture (Woodward, 2007):** **quan hệ xã hội giữa người và đồ vật** – đồ vật biểu trưng **bản sắc, địa vị, cảm xúc**.", "Cả hai đều **liên ngành**."], "img": null, "cap": null}, {"h": "Vì sao designer cần visual research", "b": ["**Rose (2012):** *'Images, forms, and objects are not always self-explanatory.'*", "Hiểu **tác động xã hội**, đánh giá **vượt khỏi thẩm mỹ**, tạo thiết kế có chiều sâu văn hóa.", "Thế mạnh: nắm bắt điều **khó nói thành lời** · nhìn & nhớ theo cách mới · giao tiếp **toàn diện** (ẩn dụ, biểu tượng) · tăng **empathy** · **dễ tiếp cận** hơn văn học thuật."], "img": null, "cap": null}, {"h": "Thu thập & phân tích (4 câu hỏi)", "b": ["Chọn hình theo **khung** (lịch sử, văn hóa, hệ tư tưởng); thu thập & phân tích **đan xen**.", "**1. What does the selection depict?** – phạm trù xã hội (giới, chủng tộc) được **kiến tạo**: **Jean Kilbourne** (*Killing Us Softly* – định kiến giới trong quảng cáo); **Tanner Higgin** (*Gamic Race* – xóa bỏ người da đen, **Eurocentrism** trong MMORPG); **Gillian Rose** (câu hỏi phản biện).", "**2. What is the audience?** – **Culturographic analysis** (phỏng vấn + quan sát ethnographic về phản ứng khán giả); **Techno-anthropologies** (công nghệ truyền thông định hình việc trưng bày & tiếp nhận).", "**3. How do people look at this?** – Rose: hình ảnh **tạo tác động mỗi khi được nhìn/dùng**; Berger: cách nhìn bị định hình bởi **kiến thức & niềm tin**.", "**4. How is it embedded in a wider cultural context?** – gallery, nhà riêng, bảo tàng, cửa hàng… mỗi nơi có **quy tắc riêng** ảnh hưởng cách nhìn."], "img": null, "cap": null}, {"h": "4 phương pháp visual research", "b": ["**Visual connoisseurship:** **'Good Eye' principle** – đánh giá bằng con mắt **được rèn luyện, trực giác**: *Ai đặt hàng? Vì sao? Ai tạo? Dùng thế nào? Ai dùng?* (VD xem Guernica).", "**Compositional interpretation:** mô tả **chính xác** yếu tố thị giác bằng **đúng thuật ngữ** (nội dung, màu, không gian, ánh sáng, chuyển động, kỹ thuật sản xuất). **Hạn chế:** bỏ qua **cách nhìn mang tính xã hội**. VD: Sargent *Siesta* 1907, *Psycho* 1960, *Cinderella* 1950.", "**Content analysis:** **định lượng** – **đếm và cộng** hiện tượng trong hình/chữ; hợp **truyền thông đại chúng** (TV, báo, tạp chí). VD **Katy Parry** – ảnh báo Anh về **cuộc xâm lược Iraq 2003**. **12 bước** (RQ → đọc rộng → đối tượng → categories → **coding sheet** → test → thu → tổng hợp → diễn giải → liên hệ RQ → trình bày → thảo luận).", "**Semiotics:** phương pháp **diễn giải** cách hình ảnh tạo nghĩa trong **hệ thống ý nghĩa rộng**; **ít tài nguyên**, **không cần nhiều ảnh**, nhưng cần **kiến thức cao** về chủ đề. VD *American Gothic* (Grant Wood, 1930)."], "img": "16_c0eeeaef82", "cap": "Content analysis: đếm & tổng hợp theo mã (coding)"}, {"h": "Semiotics – Peirce", "b": ["**Charles Sanders Peirce:** Sign xác định bởi **Object** và tạo ra **Interpretant** (ý nghĩa trong người xem).", "**Icon** = giống hình (**visual resemblance**) · **Index** = liên hệ trực tiếp (**direct connection** – khói → lửa, dấu chân) · **Symbol** = **ý nghĩa văn hóa/quy ước**.", "Ứng dụng: phân tích **quảng cáo, logo, branding**.", "**7 bước:** Identify sign → Determine type (icon/index/symbol) → **Denotation** (nghĩa trực tiếp) → **Connotations** (nghĩa hàm ẩn) → Context → **Ideology** → Cultural insights."], "img": "16_105c932821", "cap": "Peirce: Icon · Index · Symbol"}, {"h": "Báo cáo, hallmarks, mạnh/yếu", "b": ["Không có format cố định; VD: Intro 13% · RQ 7% · **Visual analysis 20%** · Social awareness 13% · Ideological platform 13% · **Critical reflection 20%** · Conclusion 13%.", "**Terry Barrett (1994, 2000):** diễn giải là **phản hồi**; trình bày tác phẩm ở **'best light'**; có **nhiều cách diễn giải cạnh tranh**, không cái nào **đúng tuyệt đối/cuối cùng**; diễn giải tốt nói về **tác phẩm hơn là nhà phê bình**; đánh giá bằng **coherence, correspondence, inclusiveness**; **tác phẩm (không phải tác giả)** là trọng tâm.", "Mạnh: hiểu truyền thông thị giác, bối cảnh văn hóa, **trực giác thiết kế**, ứng dụng liên ngành, nền **evidence-based**. Yếu: **time-intensive, subjectivity, multimodal phức tạp, limited scalability, over-analysis**."], "img": "16_18cc1c0b5d", "cap": "Phân tích ký hiệu trên một thiết kế"}, {"h": "Quảng cáo (Advertising)", "b": ["Quảng cáo dùng sức hút thị giác, biểu tượng, thông điệp; trà trộn vào văn hóa đại chúng như **giải trí** hơn là thuyết phục; là **hệ thống tuyên truyền mạnh nhất lịch sử** (Jhally, Jowett & O'Donnell).", "**Schudson (1993):** bán **tiêu dùng như lối sống**. **Capitalist realism:** thực tại **lý tưởng hóa**, so sánh với **Socialist realism** (Liên Xô).", "**Leiss et al. (1997) – 4 format:** **Product-information** (giải thích sản phẩm & công dụng, phổ biến **đầu TK20**, rồi suy giảm) · **Product-image** (đặt sản phẩm vào **bối cảnh biểu tượng**, hợp nhất sản phẩm + setting qua liên tưởng/đặt cạnh/kể chuyện) · **Personalized** (**con người** là trọng tâm – ngưỡng mộ, tự hào sở hữu, lo âu khi thiếu) · **Lifestyle** (cân bằng người–sản phẩm–bối cảnh, **lối sống mong muốn**, nhóm xã hội muốn thuộc về).", "Tóm tắt: content analysis cần **phạm trù lý thuyết tốt**; semiotics hợp quảng cáo; **mixed methods** (semiotics + content analysis + phỏng vấn + focus group) làm nghiên cứu sâu hơn."], "img": "16_1c34d2021b", "cap": "Product-information format"}]}, {"id": "s17", "t": "17 · Applied Research", "sub": "Practice-based/led, action research, co-design", "cards": [{"h": "Applied research là gì?", "b": ["Phương pháp giúp người làm nghề **phản tư & đánh giá công việc của chính mình** để tìm **giải pháp thực tế**; gốc ở ngành thực hành như **y khoa**; cần hiểu **tacit knowledge** của nghề.", "**Basic research:** khám phá khoa học · động cơ **tò mò** · hỏi *'Is it true?'* · mục tiêu **hiểu**. **Applied research:** ứng dụng công nghệ · **giải quyết vấn đề** · hỏi *'Does it work?'* · mục tiêu **ra giải pháp**.", "Nếu design là hoạt động giải quyết vấn đề → applied research **mirrors design process**."], "img": "17_6c42bf", "cap": null}, {"h": "Practice-based vs Practice-led", "b": ["**Practice-based** (Linda Candy, 2006): *'original investigation… to gain new knowledge partly by means of practice and the outcomes of that practice'* → **creative artefact là cơ sở**; kết quả trực tiếp (thiết kế, biểu diễn, digital media, triển lãm); **rất khám phá, sáng tạo**; có thể qual hoặc quant. VD: **BRAND**.", "**Practice-led** (Candy, 2006): *'concerned with the nature of practice and leads to new knowledge that has operational significance for that practice'* → **hiểu biết mới về chính thực hành**; phá rào cản nghiên cứu truyền thống–sáng tạo; **ít cụ thể hơn** practice-based. VD: **BRAND DESIGN FRAMEWORK**."], "img": null, "cap": null}, {"h": "Action research", "b": ["Vừa **điều tra vừa giải quyết** vấn đề; người làm **phản tư trong và sau** công việc.", "2 mục đích: đóng góp **thực hành mới** và **tri thức, ý tưởng, lý thuyết mới**.", "**Không cần** bắt đầu bằng giả thuyết/câu hỏi rõ ràng – chỉ cần ý tưởng rằng thực hành **có thể cải thiện**. Tự hỏi: **What am I doing? Do I need to improve anything? If so, what? How do I improve it? Why should I improve it?**", "Chủ đề nằm trong **thực hành xã hội cần thay đổi**; mang tính **participatory**; tiến hành theo **vòng xoắn: planning → acting → observing → reflecting** (có hệ thống, có ghi chép)."], "img": "17_cb25c7", "cap": null}, {"h": "Co-design", "b": ["Ra đời trong **thiết kế kiến trúc** – kiến trúc sư & người dùng cuối hợp tác → khác với quy hoạch đô thị cứng nhắc; quan hệ client–designer **sâu và gắn kết hơn**.", "Action research phải: **participatory** · có **democratic impulse** · **đóng góp thay đổi xã hội**.", "**Participatory research:** thay đổi có thể đe dọa → cần **niềm tin, tinh thần nhóm**; mọi người **thấy cần thay đổi** và **chủ động tham gia**; cách làm được **thương lượng liên tục**.", "**Democratic research:** mọi người **bình đẳng**; researcher là **facilitator of change**; kết quả **phản hồi lại** người tham gia để **validate**.", "**Social contribution:** mô tả bối cảnh phong phú, đưa **góc nhìn người tham gia** vào báo cáo, nói rõ **bias** của researcher; thành công đo bằng **điều học được**."], "img": "17_7e3e9f", "cap": null}, {"h": "Data collection/analysis & báo cáo", "b": ["Thu thập & phân tích **đan xen với quy trình thiết kế**: **1. Problem identification → 2. Analysis of the problem → 3. Synthesis of possible solutions → 4. Execution of a design solution → 5. Production of the design → 6. Evaluation & revision**.", "Báo cáo: **traditional thesis** (học giả; sâu; kỹ thuật) hoặc **case study** (người làm nghề, công chúng; dễ đọc; trực quan). Designer phải **tự phê bình, có hệ thống**; artefact là trung tâm nhưng cần **phần viết** để có bối cảnh & độ tin cậy.", "VD: **Dream City Workshop – Nashville Youth Design Team (NYDT):** giới trẻ thiết kế **thành phố mơ ước** theo **nhu cầu của người trẻ** thay vì người lớn."], "img": "17_ac4f1b", "cap": null}, {"h": "Mạnh/yếu & tóm tắt", "b": ["Mạnh: **giải quyết vấn đề thực tế**, **tác động ngay**, gắn **công nghiệp**, thúc đẩy đổi mới, tiết kiệm nguồn lực.", "Yếu: tốn thời gian, **đóng góp lý thuyết hạn chế**, phụ thuộc **kinh phí & thị trường**, **ngắn hạn**, **khó khái quát**, có thể **bias**.", "Tóm tắt: practice-based → **artefact**; practice-led → **chính thực hành**; quy trình **hợp tác, chu kỳ** (Meyer, 2000); **kiểm chứng qua thực hành** (Burns, 2000)."], "img": null, "cap": null}]}, {"id": "s52", "t": "18 · UCD Research & UX Design", "sub": "UCD, UXD, kết hợp qual + quant, chiến lược đổi mới", "cards": [{"h": "UCD & UXD", "b": ["**User-Centered Design research (UCD):** nghiên cứu **thực nghiệm lấy con người làm trung tâm**, người dùng **tham gia suốt** quá trình. Gồm: **multidisciplinary team** · **problem identification** (nhu cầu, đối thủ) · **prototyping** (low → high fidelity) · **observation & usability testing** · **product review & iteration**.", "**User Experience Design (UXD):** **thành phần cốt lõi của UCD**, bao trùm **mọi tương tác** với sản phẩm, dịch vụ, môi trường (vật lý hay số); **test – feedback – iterate liên tục cả sau khi ra mắt**."], "img": "52_ad244d", "cap": null}, {"h": "Kết hợp Qualitative + Quantitative", "b": ["UCD thường **kết hợp** qual & quant vì chúng **bổ sung** nhau.", "**Qualitative = 'why'** (dữ liệu giàu bối cảnh, kể chuyện) · **Quantitative = 'what'** (số liệu, có giá trị thống kê).", "Cơ chế: **qual tìm giả thuyết / pain points → quant kiểm chứng** thống kê; vòng lặp phản hồi; kết quả vừa **user-centered** vừa **evidence-based**.", "VD: phim hoạt hình khoa học cho trẻ 6–8 tuổi: **focus group** trẻ & phụ huynh (phong cách, nhân vật) + phân tích **dữ liệu xem** (tập < 10 phút)."], "img": "52_7aa170", "cap": null}, {"h": "3 chiến lược đổi mới", "b": ["**Breakthrough innovation:** sản phẩm **mới, vượt trội**, đưa công ty sang **danh mục thị trường mới**; đổi cách khách tương tác – VD **iPhone đầu tiên**.", "**Incremental innovation:** **cải tiến liên tục** sản phẩm/dịch vụ/quy trình; giữ **ổn định thị trường**, **nuôi R&D** – VD cải thiện UI theo feedback.", "**Disruptive innovation:** tái định hình cả ngành, **thị trường mới**, nhắm người **bị bỏ qua**; biến **non-consumers thành consumers**; giải pháp **đơn giản, rẻ** – VD **Airbnb vs khách sạn**."], "img": "52_60897f", "cap": null}, {"h": "Tác động của design research lên chiến lược", "b": ["Quant không chỉ cho usability – còn **giảm rủi ro, kiểm chứng giả định, đo market fit** cho mỗi chiến lược.", "Lãnh đạo doanh nghiệp ưu tiên **kết quả đo được** → design có dữ liệu (survey, usage metrics, **A/B testing**) thành **công cụ chiến lược**.", "Breakthrough: **validate nhu cầu & prototype sớm** · Incremental: **feedback, quan sát sau launch, survey** · Disruptive: hiểu **non-consumers** – survey, **segmentation**, quan sát hành vi, tìm **nhu cầu chưa được đáp ứng/vô thức**."], "img": null, "cap": null}]}];
const Q = [{"id": 0, "q": "Hypotheses are more relevant to which type of research, while research questions are more common in qualitative research?", "options": ["Ethnographic research", "Experimental research", "Theoretical research", "Applied research"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s17", "extra": false}, {"id": 1, "q": "The study and interpretation of IMAGES, FORMS, AND OBJECTS in visual and material culture is the definition of:", "options": ["Content Analysis", "Semiotics", "Visual Research", "Phenomenology"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s16", "extra": false}, {"id": 2, "q": "Cross-referencing research using multiple sources of evidence to establish credible, valid, and reliable research practice is called:", "options": ["Data Analysis", "Triangulation", "Multimethod Research", "Data Verification"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s05", "extra": false}, {"id": 3, "q": "Which term is broader in scope and encompasses both research methods and the logical reasoning behind their adoption?", "options": ["Research Method", "Research Strategy", "Research Methodology", "Research Technique"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s05", "extra": false}, {"id": 4, "q": "The Greek word \"Graphy\" (γραφή) in Ethnography means:", "options": ["Research", "Description or Writing", "Fieldwork", "Interpretation"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s07", "extra": false}, {"id": 5, "q": "The primary purpose of an Experimental Study is to:", "options": ["Develop a new theory from collected data", "Establish a cause-and-effect relationship between variables", "Provide a rich, descriptive picture of a complex situation", "Interpret cultural meanings and symbols"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s15", "extra": false}, {"id": 6, "q": "True/False: A Research Problem is the core issue such as a condition to be improved, a difficulty to be tackled, or a question in theory or practice to be examined and understood.", "options": ["True", "False"], "answer": 0, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s04", "extra": false}, {"id": 7, "q": "The primary use of Quantitative Research is for:", "options": ["Developing a new theory", "Testing or verifying an existing theory", "Subjective interpretation of human behavior", "Self-exploration"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s13", "extra": false}, {"id": 8, "q": "The type of ethnographic study where the researcher's own thoughts and perspectives from the social interaction form the central element is called:", "options": ["Cyber-ethnography", "Auto-ethnography", "Investigator Triangulation", "Participant Observation"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s08", "extra": false}, {"id": 9, "q": "When is qualitative research typically used?", "options": ["When the relevant theory base is robust", "When all variables are known and quantified", "When there is little information on the topic or variables are unknown", "As a final step to generalize findings to a large population"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s10", "extra": false}, {"id": 10, "q": "Due to constraints, contemporary ethnographic studies often follow a 'step-in-step-out' approach, which means the study duration is:", "options": ["Longer than usual (12-18 months)", "Shorter than usual", "Unconstrained by time", "Determined by funding only"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s07", "extra": false}, {"id": 11, "q": "\"You cannot understand good design, if you do not understand people\" is attributed to which industrial designer?", "options": ["Le Corbusier", "Marcel Breuer", "Dieter Rams", "Raymond Loewy"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": ""
