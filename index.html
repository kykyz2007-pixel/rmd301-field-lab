 Collection Methods"}, {"img": "13_734d9bf8be", "cap": "Slide 15 · Experimental Study: A cornerstone of Quantitative research"}, {"img": "13_b3b53f4c2b", "cap": "Slide 16 · Observational Study: Collect data in a natural or controlled setting"}, {"img": "13_b64a886a6c", "cap": "Slide 17 · Future Trends in Quantitative Research"}]}]}, {"id": "s14", "t": "14 · Quantitative Research (2)", "sub": "Planning a survey, question types, tips", "cards": [{"h": "Planning a survey (6 steps)", "b": ["Define the **purpose** first; questions must produce **quantitative data**.", "**1. Define purpose → 2. Prepare questions → 3. Specify sequence → 4. Outline distribution → 5. Decide how to administer responses → 6. Pre-test & review**."], "img": null, "cap": null}, {"h": "Ways of collecting responses", "b": ["**Face-to-face:** **high** response rate, in-depth questions, immediate clarification · **time-consuming and costly**, needs trained interviewers.", "**Remote (phone/video):** faster, cheaper, clarification still possible · lower response rate, hard to read body language.", "**Written questionnaires:** standardised, easy to analyse, wide reach, **no interviewer bias** · low response rate, no clarification possible.", "**Online surveys:** cheap, easy to scale, results recorded automatically · **self-selection bias**, needs **internet**, no clarification possible."], "img": null, "cap": null}, {"h": "6 question types", "b": ["**Dichotomous:** 2 options (Yes/No) → binary data.", "**Single selection (categorization):** choose 1 from predefined groups (Sedan/SUV/Other).", "**Checklist / Multi selection:** choose **several** answers (devices you own).", "**Ranking:** **rank** priorities (1 = most important).", "**Scale:** **Likert** (Strongly disagree → Strongly agree) & **Semantic differential** (Unpleasant □□□□□ Pleasant).", "**Open-ended:** free answers → **add qualitative insight**."], "img": "14_6fe28a", "cap": null}, {"h": "8 survey tips", "b": ["**Brevity** (short, avoids fatigue) · **Clear & exhaustive options** (all options covered, include **'Other (please specify)'**, mutually exclusive) · **Avoiding bias** (no **leading** questions, neutral language) · **Consistency** (consistent structure and scales).", "**Effective design** (title, instructions, grouped questions) · **Pilot testing** (try it on a small group first) · **Accessibility** (people with disabilities, print/phone versions) · **Anonymity & confidentiality** (increases **honesty**; don't collect email/ID unless needed)."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **3 remaining images** from the Session 14 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "14_4b6ab19498", "cap": "Slide 3 · Planning Quantitative Survey"}, {"img": "14_a60a522c4d", "cap": "Slide 4 · Here is a straightforward six-step procedure that you can follow…"}, {"img": "14_d2f9fa2679", "cap": "Slide 11 · Keep in mind when conducting survey"}]}]}, {"id": "s15", "t": "15 · Quantitative Research (3)", "sub": "Experiments, observation, analysis, reporting", "cards": [{"h": "Experimental study", "b": ["Manipulates **independent variables** and measures the effect on **dependent variables** → **cause-and-effect**.", "**Lab-based:** a **controlled** environment – a usability lab with **one-way mirrors and hidden cameras**; controls session length, navigation, etc.", "**Real-world:** in the field with real users – e.g. **VR usability testing** (controlling light, sound, fatigue)."], "img": "15_90e012", "cap": null}, {"h": "Observational study", "b": ["Observes & records **without manipulating variables/the environment**; measures **frequency** and **conditions**. E.g. **Google Analytics**.", "Quantitative observation is **descriptive** with a clear focus; the key is **objectivity** in collecting and evaluating.", "E.g. **eye-tracking** drivers looking at the dashboard; shoppers looking at **packaging & shelves** (heatmaps)."], "img": "15_b67c0d", "cap": null}, {"h": "Analysing data", "b": ["Steps: **group** data by demographics/variables (gender, age, location) → look for **patterns** between groups → use statistical tools (**correlation, frequency distribution**).", "**Data quality:** **Data cleaning** (missing values, **duplicates**, outliers – Excel/Python) · **Anomaly detection** (e.g. age 200).", "**Descriptive statistics:** describe observable features – **Mean** (average), **Median** (middle), **Mode** (most frequent).", "**Inferential statistics:** **generalise** from a sample to a larger population – **hypothesis testing (t-test)**, **ANOVA** to compare several groups."], "img": "15_258139", "cap": null}, {"h": "Reporting & hallmark", "b": ["Report: **Introduction** (problem, aims) → **Methodology** → **Results** (tables, charts) → **Discussion** (interpretation against previous research, **limitations**, next steps).", "Ethics: anonymity & confidentiality, **informed consent**; present clearly, no jargon, readable charts, **alt-text**.", "**Hallmark – the 7-step process:** **Observation → Research question → Hypothesis → Prediction → Test → Negative results** (revise the hypothesis) / **Positive results** (establish the findings).", "Recap: **External (fieldwork)** vs **Internal (lab)**; participants chosen by **random sampling**; applications: **surveys** & **experimental research**."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **8 remaining images** from the Session 15 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "15_734d9bf8be", "cap": "Slide 3 · Experimental Study"}, {"img": "15_4111a09e02", "cap": "Slide 5 · Experimental Study"}, {"img": "15_b3b53f4c2b", "cap": "Slide 6 · Observational Study"}, {"img": "15_f27fd1dccd", "cap": "Slide 7 · Observational Study"}, {"img": "15_bfd4e3b72b", "cap": "Slide 8 · Observational Study"}, {"img": "15_12708e367b", "cap": "Slide 9 · Data analysis focuses on systematically interpreting collected…"}, {"img": "15_b55d312091", "cap": "Slide 10 · Importance of Data Quality"}, {"img": "15_6f0d87c6e9", "cap": "Slide 13 · Data Visualization & Report"}]}]}, {"id": "s16", "t": "16 · Visual Research", "sub": "Visual & material culture, 4 methods, advertising", "cards": [{"h": "What is visual research?", "b": ["History: natural sciences used drawings and photos; anthropology/sociology used photos as **ethnographic observation** (*Trance and Dance in Bali* – Margaret Mead & Gregory Bateson).", "Digitisation, phone cameras and social media → easy to take, store and share images; but **'A camera can lie!'** – visual data **can be manipulated**.", "**Berger (1972):** society is **dominated by images and objects**.", "Definition: the study & interpretation of **IMAGES, FORMS, OBJECTS** in **visual & material CULTURE** (typography, advertising, architecture…); understanding their **social impact**, not just their beauty."], "img": null, "cap": null}, {"h": "Visual culture vs Material culture", "b": ["Oxford definitions: **Culture, Form** (visible shape), **Object** (a thing you can touch), **Image** (a representation).", "**Visual culture (Mirzoeff, 1999):** the role of images in everyday life; challenges the **privileging of text over images**; emphasises **visual literacy**.", "**Material culture (Woodward, 2007):** the **social relationship between people and objects** – objects signify **identity, status and emotion**.", "Both are **interdisciplinary**."], "img": null, "cap": null}, {"h": "Why designers need visual research", "b": ["**Rose (2012):** *'Images, forms, and objects are not always self-explanatory.'*", "Understand **social impact**, evaluate **beyond aesthetics**, create designs with cultural depth.", "Strengths: captures what is **hard to put into words** · new ways of seeing & remembering · **holistic** communication (metaphors, symbols) · builds **empathy** · **more accessible** than academic text."], "img": null, "cap": null}, {"h": "Collecting & analysing (4 questions)", "b": ["Select images within a **framework** (historical, cultural, ideological); collection and analysis are **intertwined**.", "**1. What does the selection depict?** – social categories (gender, race) are **constructed**: **Jean Kilbourne** (*Killing Us Softly* – gender stereotypes in advertising); **Tanner Higgin** (*Gamic Race* – erasure of Black characters, **Eurocentrism** in MMORPGs); **Gillian Rose** (critical questions).", "**2. What is the audience?** – **Culturographic analysis** (interviews + ethnographic observation of audience reactions); **Techno-anthropologies** (media technology shapes how images are displayed & received).", "**3. How do people look at this?** – Rose: images **have effects every time they are seen/used**; Berger: the way we see is shaped by **knowledge & beliefs**.", "**4. How is it embedded in a wider cultural context?** – gallery, home, museum, shop… each place has **its own rules** that affect how we look."], "img": null, "cap": null}, {"h": "4 visual research methods", "b": ["**Visual connoisseurship:** the **'Good Eye' principle** – judging with a **trained, intuitive** eye: *Who commissioned it? Why? Who made it? How was it used? Who used it?* (e.g. looking at Guernica).", "**Compositional interpretation:** describes visual elements **precisely** using the **correct terminology** (content, colour, space, light, movement, production technique). **Limitation:** ignores the **social ways of seeing**. E.g. Sargent's *Siesta* 1907, *Psycho* 1960, *Cinderella* 1950.", "**Content analysis:** **quantitative** – **counting and adding up** occurrences in images/text; suits **mass media** (TV, newspapers, magazines). E.g. **Katy Parry** – British press photos of the **2003 invasion of Iraq**. **12 steps** (RQ → wide reading → subjects → categories → **coding sheet** → test → collect → tally → interpret → relate to RQ → present → discuss).", "**Semiotics:** an **interpretive** method for how images create meaning within **wider systems of meaning**; **few resources**, **doesn't need many images**, but requires **deep knowledge** of the subject. E.g. *American Gothic* (Grant Wood, 1930)."], "img": "16_c0eeeaef82", "cap": "Content analysis: counting & tallying by code"}, {"h": "Semiotics – Peirce", "b": ["**Charles Sanders Peirce:** a Sign is determined by its **Object** and produces an **Interpretant** (the meaning in the viewer's mind).", "**Icon** = **visual resemblance** · **Index** = **direct connection** (smoke → fire, footprints) · **Symbol** = **cultural/conventional meaning**.", "Application: analysing **advertising, logos, branding**.", "**7 steps:** Identify the sign → Determine its type (icon/index/symbol) → **Denotation** (literal meaning) → **Connotations** (implied meanings) → Context → **Ideology** → Cultural insights."], "img": "16_105c932821", "cap": "Peirce: Icon · Index · Symbol"}, {"h": "Reporting, hallmarks, strengths/weaknesses", "b": ["No fixed format; e.g. Intro 13% · RQ 7% · **Visual analysis 20%** · Social awareness 13% · Ideological platform 13% · **Critical reflection 20%** · Conclusion 13%.", "**Terry Barrett (1994, 2000):** interpretations are **responses**; present the work in its **'best light'**; there are **many competing interpretations**, none is **absolutely right/final**; good interpretations say more about **the artwork than the critic**; judged by **coherence, correspondence, inclusiveness**; **the artwork (not the artist)** is the focus.", "Strengths: understanding visual communication, cultural context, **design intuition**, interdisciplinary use, an **evidence-based** foundation. Weaknesses: **time-intensive, subjectivity, multimodal complexity, limited scalability, over-analysis**."], "img": "16_18cc1c0b5d", "cap": "Analysing the signs in a design"}, {"h": "Advertising", "b": ["Advertising uses visual appeal, symbols and messages; it blends into popular culture as **entertainment** rather than persuasion; it is the **most powerful propaganda system in history** (Jhally, Jowett & O'Donnell).", "**Schudson (1993):** it sells **consumption as a way of life**. **Capitalist realism:** an **idealised** reality, compared with **Socialist realism** (USSR).", "**Leiss et al. (1997) – 4 formats:** **Product-information** (explains the product and its use; popular in the **early 20th century**, then declined) · **Product-image** (places the product in a **symbolic context**, merging product + setting through association/juxtaposition/storytelling) · **Personalized** (**people** are the focus – admiration, pride of ownership, anxiety about lacking it) · **Lifestyle** (balances person–product–setting, a **desirable lifestyle**, the social group people want to belong to).", "Recap: content analysis needs **good theoretical categories**; semiotics suits advertising; **mixed methods** (semiotics + content analysis + interviews + focus groups) give deeper research."], "img": "16_1c34d2021b", "cap": "Product-information format"}, {"h": "All images from the slides", "b": ["All **44 remaining images** from the Session 16 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "16_a1fd64c33c", "cap": "Slide 2 · Visual Research"}, {"img": "16_c0bc576dad", "cap": "Slide 3 · What is Visual Research in Design? Brief history"}, {"img": "16_e1cb7f2323", "cap": "Slide 3 · What is Visual Research in Design? Brief history"}, {"img": "16_55b8c69fc6", "cap": "Slide 4 · What is Visual Research in Design? Brief history"}, {"img": "16_0d99db7d35", "cap": "Slide 5 · What is Visual Research in Design? Brief history"}, {"img": "16_1ea6d0ae70", "cap": "Slide 6 · What is Visual Research in Design? Understanding the Power of Visuals"}, {"img": "16_eb6853150f", "cap": "Slide 7 · What is Visual Research in Design? Understanding the Power of Visuals"}, {"img": "16_fa56106d05", "cap": "Slide 8 · What is Visual Research in Design? Visual and material culture studies"}, {"img": "16_7708814966", "cap": "Slide 10 · What is Visual Research in Design? Why Visual Research is…"}, {"img": "16_9402e25623", "cap": "Slide 11 · What is Visual Research in Design? Why Visual Research is…"}, {"img": "16_406a3f030b", "cap": "Slide 12 · Data Collection and Analysis in Visual Research"}, {"img": "16_62e46bce1c", "cap": "Slide 14 · Jean Kilbourne’s Analysis on Gender in Ads"}, {"img": "16_ababc97310", "cap": "Slide 14 · Jean Kilbourne’s Analysis on Gender in Ads"}, {"img": "16_f46524233d", "cap": "Slide 15 · Tanner Higgin’s Gamic Race: Logics of Difference in Videogame Culture"}, {"img": "16_aa62915d4d", "cap": "Slide 15 · Tanner Higgin’s Gamic Race: Logics of Difference in Videogame Culture"}, {"img": "16_d496521988", "cap": "Slide 16 · Data Collection and Analysis in Visual Research What is the audiences?"}, {"img": "16_7a80e1aaee", "cap": "Slide 18 · Data Collection and Analysis in Visual Research How are these…"}, {"img": "16_985743088c", "cap": "Slide 20 · Visual Connoisseurship - The ‘Good Eye’ Principle"}, {"img": "16_79d204d967", "cap": "Slide 21 · Compositional Interpretation"}, {"img": "16_f208a45db2", "cap": "Slide 22 · Compositional Interpretation"}, {"img": "16_74b43ea333", "cap": "Slide 23 · Compositional Interpretation"}, {"img": "16_40527131f3", "cap": "Slide 23 · Compositional Interpretation"}, {"img": "16_44e6d51ee4", "cap": "Slide 24 · Compositional Interpretation"}, {"img": "16_e767ecf757", "cap": "Slide 24 · Compositional Interpretation"}, {"img": "16_f872ff9b42", "cap": "Slide 25 · Compositional Interpretation"}, {"img": "16_5e6d9d8f85", "cap": "Slide 25 · Compositional Interpretation"}, {"img": "16_ab774036b4", "cap": "Slide 26 · Content analysis"}, {"img": "16_f7bc258611", "cap": "Slide 27 · Content analysis"}, {"img": "16_e8a66005ea", "cap": "Slide 28 · Content analysis"}, {"img": "16_adf2c39872", "cap": "Slide 28 · Content analysis"}, {"img": "16_a1f0d633d1", "cap": "Slide 28 · Content analysis"}, {"img": "16_320858fd45", "cap": "Slide 28 · Content analysis"}, {"img": "16_e4bf7c652b", "cap": "Slide 29 · Content analysis"}, {"img": "16_26eb56519c", "cap": "Slide 29 · Content analysis"}, {"img": "16_1c85537445", "cap": "Slide 29 · Content analysis"}, {"img": "16_d2e0da8534", "cap": "Slide 29 · Content analysis"}, {"img": "16_f8535b00bc", "cap": "Slide 30 · Content analysis"}, {"img": "16_6ba737b124", "cap": "Slide 30 · Content analysis"}, {"img": "16_a7fac3c2c8", "cap": "Slide 31 · Semiotics"}, {"img": "16_12b3d51228", "cap": "Slide 32 · An interpretative method that analyzes images or objects and…"}, {"img": "16_6eeabeb411", "cap": "Slide 36 · Conducting Semiotic Analysis"}, {"img": "16_8e9205866d", "cap": "Slide 40 · Advertising Introduction"}, {"img": "16_5cad844b19", "cap": "Slide 41 · Advertising Ideological framework"}, {"img": "16_02a27874ba", "cap": "Slide 42 · Advertising The use of cultural references in advertising"}]}]}, {"id": "s17", "t": "17 · Applied Research", "sub": "Practice-based/led, action research, co-design", "cards": [{"h": "What is applied research?", "b": ["A method that helps practitioners **reflect on and evaluate their own work** to find **practical solutions**; rooted in practice-based fields like **medicine**; requires understanding the **tacit knowledge** of the profession.", "**Basic research:** scientific discovery · driven by **curiosity** · asks *'Is it true?'* · goal: **understanding**. **Applied research:** technological application · **solving problems** · asks *'Does it work?'* · goal: **a solution**.", "If design is a problem-solving activity → applied research **mirrors the design process**."], "img": "17_6c42bf", "cap": null}, {"h": "Practice-based vs Practice-led", "b": ["**Practice-based** (Linda Candy, 2006): *'original investigation… to gain new knowledge partly by means of practice and the outcomes of that practice'* → the **creative artefact is the basis**; direct outcomes (designs, performances, digital media, exhibitions); **highly exploratory and creative**; can be qual or quant. E.g. **BRAND**.", "**Practice-led** (Candy, 2006): *'concerned with the nature of practice and leads to new knowledge that has operational significance for that practice'* → **new understanding of the practice itself**; breaks down barriers between traditional and creative research; **less concrete** than practice-based. E.g. **BRAND DESIGN FRAMEWORK**."], "img": null, "cap": null}, {"h": "Action research", "b": ["**Investigates and solves** a problem at the same time; practitioners **reflect during and after** their work.", "Two aims: to contribute **new practices** and **new knowledge, ideas and theories**.", "**Does not need** to start with a clear hypothesis/question – only the idea that practice **can be improved**. Ask: **What am I doing? Do I need to improve anything? If so, what? How do I improve it? Why should I improve it?**", "The topic lies in a **social practice that needs change**; it is **participatory**; it runs in a **spiral: planning → acting → observing → reflecting** (systematic and documented)."], "img": "17_cb25c7", "cap": null}, {"h": "Co-design", "b": ["Originated in **architectural design** – architects & end users collaborating → unlike rigid urban planning; a **deeper, more engaged** client–designer relationship.", "Action research must be: **participatory** · have a **democratic impulse** · **contribute to social change**.", "**Participatory research:** change can feel threatening → needs **trust and team spirit**; everyone **sees the need for change** and **takes part actively**; the approach is **continually negotiated**.", "**Democratic research:** everyone is **equal**; the researcher is a **facilitator of change**; results are **fed back** to participants to **validate** them.", "**Social contribution:** rich description of the context, includes **participants' perspectives** in the report, states the researcher's **bias** clearly; success is measured by **what was learned**."], "img": "17_7e3e9f", "cap": null}, {"h": "Data collection/analysis & reporting", "b": ["Collection & analysis are **interwoven with the design process**: **1. Problem identification → 2. Analysis of the problem → 3. Synthesis of possible solutions → 4. Execution of a design solution → 5. Production of the design → 6. Evaluation & revision**.", "Report: a **traditional thesis** (for academics; in-depth; technical) or a **case study** (for practitioners and the public; readable; visual). Designers must be **self-critical and systematic**; the artefact is central but a **written part** is needed for context & credibility.", "E.g. **Dream City Workshop – Nashville Youth Design Team (NYDT):** young people designed their **dream city** based on **young people's needs** rather than adults'."], "img": "17_ac4f1b", "cap": null}, {"h": "Strengths/weaknesses & summary", "b": ["Strengths: **solves real-world problems**, **immediate impact**, linked to **industry**, drives innovation, saves resources.", "Weaknesses: time-consuming, **limited theoretical contribution**, depends on **funding & the market**, **short-term**, **hard to generalise**, may be **biased**.", "Recap: practice-based → **the artefact**; practice-led → **the practice itself**; a **collaborative, cyclical** process (Meyer, 2000); **validated through practice** (Burns, 2000)."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **10 remaining images** from the Session 17 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "17_f1e6a4060f", "cap": "Slide 2 · Applied Research"}, {"img": "17_c758aa8dbf", "cap": "Slide 4 · Practice-based and practice-led research"}, {"img": "17_e5adb71770", "cap": "Slide 5 · Practice-based research is an ‘original investigation undertaken…"}, {"img": "17_03ea694cc5", "cap": "Slide 7 · Action research"}, {"img": "17_f36249a7ca", "cap": "Slide 11 · Action research Co-design"}, {"img": "17_ebc741a4c2", "cap": "Slide 13 · Action research Co-design"}, {"img": "17_fbe07bc20a", "cap": "Slide 14 · Action research Co-design"}, {"img": "17_ad287aba2d", "cap": "Slide 15 · Action research Co-design"}, {"img": "17_c8b3ce06ad", "cap": "Slide 19 · Action research"}, {"img": "17_622f21f81a", "cap": "Slide 19 · Action research"}]}]}, {"id": "s52", "t": "18 · UCD Research & UX Design", "sub": "UCD, UXD, combining qual + quant, innovation strategies", "cards": [{"h": "UCD & UXD", "b": ["**User-Centered Design research (UCD):** **empirical, human-centred** research where users are **involved throughout** the process. Includes: a **multidisciplinary team** · **problem identification** (needs, competitors) · **prototyping** (low → high fidelity) · **observation & usability testing** · **product review & iteration**.", "**User Experience Design (UXD):** a **core component of UCD**, covering **every interaction** with a product, service or environment (physical or digital); **test – feedback – iterate continuously, even after launch**."], "img": "52_ad244d", "cap": null}, {"h": "Combining qualitative + quantitative", "b": ["UCD usually **combines** qual & quant because they **complement** each other.", "**Qualitative = 'why'** (rich, contextual data, storytelling) · **Quantitative = 'what'** (numbers, statistical value).", "How it works: **qual finds hypotheses / pain points → quant verifies them** statistically; a feedback loop; results are both **user-centered** and **evidence-based**.", "E.g. a science cartoon for children aged 6–8: **focus groups** with children & parents (style, characters) + analysis of **viewing data** (episodes < 10 minutes)."], "img": "52_7aa170", "cap": null}, {"h": "3 innovation strategies", "b": ["**Breakthrough innovation:** a **new, superior** product that takes the company into a **new market category**; changes how customers interact – e.g. the **first iPhone**.", "**Incremental innovation:** **continuous improvement** of products/services/processes; keeps the **market stable** and **funds R&D** – e.g. improving the UI based on feedback.", "**Disruptive innovation:** reshapes a whole industry, creates **new markets**, targets **overlooked** people; turns **non-consumers into consumers**; **simple, cheap** solutions – e.g. **Airbnb vs hotels**."], "img": "52_60897f", "cap": null}, {"h": "How design research shapes strategy", "b": ["Quant is not only for usability – it also **reduces risk, validates assumptions and measures market fit** for each strategy.", "Business leaders prioritise **measurable results** → data-backed design (surveys, usage metrics, **A/B testing**) becomes a **strategic tool**.", "Breakthrough: **validate needs & prototype early** · Incremental: **feedback, post-launch observation, surveys** · Disruptive: understand **non-consumers** – surveys, **segmentation**, behavioural observation, finding **unmet/unconscious needs**."], "img": null, "cap": null}, {"h": "All images from the slides", "b": ["All **4 remaining images** from the Session 52 slides – click an image to enlarge it."], "img": null, "cap": null, "gal": [{"img": "52_7c525cc2e4", "cap": "Slide 10 · Definition: Introducing new and superior products that pivot a…"}, {"img": "52_bcc03ca331", "cap": "Slide 11 · Definition: Making ongoing improvements to existing products,…"}, {"img": "52_c14ea4a26d", "cap": "Slide 13 · Quantitative research isn’t just about usability—it plays a vital…"}, {"img": "52_7ede4553fd", "cap": "Slide 15 · Whether it’s testing a new concept (breakthrough) or refining an…"}]}]}];
const Q = [{"id": 0, "q": "Hypotheses are more relevant to which type of research, while research questions are more common in qualitative research?", "options": ["Ethnographic research", "Experimental research", "Theoretical research", "Applied research"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s17", "extra": false}, {"id": 1, "q": "The study and interpretation of IMAGES, FORMS, AND OBJECTS in visual and material culture is the definition of:", "options": ["Content Analysis", "Semiotics", "Visual Research", "Phenomenology"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s16", "extra": false}, {"id": 2, "q": "Cross-referencing research using multiple sources of evidence to establish credible, valid, and reliable research practice is called:", "options": ["Data Analysis", "Triangulation", "Multimethod Research", "Data Verification"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s05", "extra": false}, {"id": 3, "q": "Which term is broader in scope and encompasses both research methods and the logical reasoning behind their adoption?", "options": ["Research Method", "Research Strategy", "Research Methodology", "Research Technique"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s05", "extra": false}, {"id": 4, "q": "The Greek word \"Graphy\" (γραφή) in Ethnography means:", "options": ["Research", "Description or Writing", "Fieldwork", "Interpretation"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s07", "extra": false}, {"id": 5, "q": "The primary purpose of an Experimental Study is to:", "options": ["Develop a new theory from collected data", "Establish a cause-and-effect relationship between variables", "Provide a rich, descriptive picture of a complex situation", "Interpret cultural meanings and symbols"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s15", "extra": false}, {"id": 6, "q": "True/False: A Research Problem is the core issue such as a condition to be improved, a difficulty to be tackled, or a question in theory or practice to be examined and understood.", "options": ["True", "False"], "answer": 0, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s04", "extra": false}, {"id": 7, "q": "The primary use of Quantitative Research is for:", "options": ["Developing a new theory", "Testing or verifying an existing theory", "Subjective interpretation of human behavior", "Self-exploration"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s13", "extra": false}, {"id": 8, "q": "The type of ethnographic study where the researcher's own thoughts and perspectives from the social interaction form the central element is called:", "options": ["Cyber-ethnography", "Auto-ethnography", "Investigator Triangulation", "Participant Observation"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s08", "extra": false}, {"id": 9, "q": "When is qualitative research typically used?", "options": ["When the relevant theory base is robust", "When all variables are known and quantified", "When there is little information on the topic or variables are unknown", "As a final step to generalize findings to a large population"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s10", "extra": false}, {"id": 10, "q": "Due to constraints, contemporary ethnographic studies often follow a 'step-in-step-out' approach, which means the study duration is:", "options": ["Longer than usual (12-18 months)", "Shorter than usual", "Unconstrained by time", "Determined by funding only"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s07", "extra": false}, {"id": 11, "q": "\"You cannot understand good design, if you do not understand people\" is attributed to which industrial designer?", "options": ["Le Corbusier", "Marcel Breuer", "Dieter Rams", "Raymond Loewy"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 12, "q": "Which ethical mistake involves adjusting data without proper justification or recording, or presenting invented data?", "options": ["Data Misinterpretation", "Data Fabrication", "Data Omission", "Data Skewing"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s05", "extra": false}, {"id": 13, "q": "Which term is narrower in scope and focuses on the techniques and procedures used in solving research problems?", "options": ["Research Methodology", "Research Philosophy", "Research Method", "Research Approach"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s05", "extra": false}, {"id": 14, "q": "Ethnography is considered the core of which design approach?", "options": ["Technology-driven design", "Artist-centered design", "Human-centered design", "Economy-focused design"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s07", "extra": false}, {"id": 15, "q": "What is the purpose of Qualitative Research?", "options": ["To use numeric data to arrive at conclusions", "To construct a rich and meaningful picture of a complex situation", "To identify cause-and-effect relationships between variables", "To test or verify an existing theory"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s10", "extra": false}, {"id": 16, "q": "Design Thinking is widely accepted as the process of bringing together which two essential skills?", "options": ["Technical and managerial", "Creative and critical thinking", "Intuitive and artistic", "Economic and financial"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 17, "q": "In the 1960s, the design focus shifted from technology and form to consideration of what?", "options": ["Cost efficiency", "Mass communication", "Human needs and behavior", "Artistic expression"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 18, "q": "Which ethical principle requires that the benefits of the research justify any risks of harm or discomfort to participants?", "options": ["Justice", "Autonomy", "Non-Maleficence", "Beneficence"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s05", "extra": false}, {"id": 19, "q": "In ethnography, what is the main risk of a researcher becoming \"over-integrated\" in the culture being studied?", "options": ["The study will be too brief", "Loss of objectivity, leading to subjective and biased results", "Failure to gain access to a gatekeeper", "Running out of budget"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s08", "extra": false}, {"id": 21, "q": "Newly established design schools often reclassified themselves as art schools because design was firmly defined as a subset of:", "options": ["Science", "Technology", "Art", "Commerce"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 22, "q": "The main aim of the ethnographer is to conduct:", "options": ["Market analysis", "Statistical generalization", "Cultural interpretation", "Scientific experimentation"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s07", "extra": false}, {"id": 23, "q": "What is a key characteristic of Quantitative Research?", "options": ["Data collection and analysis evolve simultaneously", "It is independent from the researcher and uses objective observations", "It encourages exploration through open-ended questions", "It focuses on subjective interpretation of lived experiences"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s11", "extra": false}, {"id": 24, "q": "Which iconic designer is known as 'The Father of Streamlining' and 'The Father of Industrial Design'?", "options": ["Henry Dreyfuss", "Leonardo da Vinci", "Raymond Loewy", "Frank Lloyd Wright"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 25, "q": "What is cited as the biggest challenge for the adoption of research in design?", "options": ["Lack of funding", "Design being traditionally taught under art rather than science", "Difficulty in finding research participants", "Insufficient digital tools"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 26, "q": "Which visual research method examines how images create meaning by studying signs, especially in advertising?", "options": ["Compositional Interpretation", "Semiotics", "Cultural Context Analysis", "Observational Study"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s16", "extra": false}, {"id": 27, "q": "Design work in Europe and the US from the early 19th century through the first half of the 20th century initially began as a ______ activity.", "options": ["Trade", "Artistic", "Craft", "Engineering"], "answer": 0, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 28, "q": "Which research purpose should generally be avoided?", "options": ["Looking at a body of data that can contribute to a solution of a problem", "Gathering information just to learn something about a certain area (self-enlightenment)", "Consolidating and aligning two different fields of study", "Seeking to challenge existing theories"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s04", "extra": false}, {"id": 29, "q": "In the context of Industry 4.0, which demand is a detriment for designers who focus on technical execution and need detailed design briefs?", "options": ["Increased focus on aesthetics", "The need for strong discipline-specific knowledge", "Collaboration with other designers", "The demand for well-developed critical thinking skills and complex problem framing"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s02", "extra": false}, {"id": 30, "q": "According to the Oxford Dictionary, a 'system of methods used in a particular area of study or activity' is the definition of:", "options": ["Research Method", "Research Triangulation", "Research Methodology", "Research Proposal"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s06", "extra": false}, {"id": 31, "q": "What is the primary type of data used in Quantitative Research?", "options": ["Textual narratives", "Numeric data", "Subjective opinions", "Unverified anecdotes"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s13", "extra": false}, {"id": 32, "q": "Which type of qualitative research emphasizes personal experiences and subjective interpretations to uncover emotional responses to design?", "options": ["Case Study", "Historical Research", "Grounded Theory", "Phenomenology"], "answer": 3, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s12", "extra": false}, {"id": 33, "q": "Visual Culture emphasizes which of the following as essential, challenging a historical preference for text?", "options": ["Data Quantification", "Textual Analysis", "Visual Literacy", "Statistical Modeling"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s16", "extra": false}, {"id": 34, "q": "During the Second World War, new 'industrial' designers were tasked with focusing on:", "options": ["Market Research", "Human factors and ergonomics", "Product distribution", "Artistic refinement"], "answer": 1, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 35, "q": "In a research proposal, the Research Methods and Methodologies section gets a content distribution of:", "options": ["1/64", "2/64", "3/16", "1/16"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s06", "extra": false}, {"id": 36, "q": "Which of the following is a benefit of incorporating research into the design process?", "options": ["Prioritizes self-exploration", "Encourages competition", "Challenges assumptions and identifies opportunities", "Focuses exclusively on aesthetics"], "answer": 2, "src": "Quizlet: 40 questions RMD301 (set B)", "note": "", "ls": "s03", "extra": false}, {"id": 456, "q": "The word 'research' (RE + SEARCH) implies that:", "options": ["One must observe again and again to gain insight of a phenomenon", "Research is done only once", "Research means searching the internet", "Research avoids scientific procedure"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 01: RE (again) + SEARCH → repeated observation to understand a phenomenon.", "ls": "s01", "extra": false}, {"id": 457, "q": "What is the main aim of research?", "options": ["To find out the truth which has not been discovered yet", "To make products beautiful", "To sell more goods", "To copy existing designs"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 01: 'The main aim of research is to find out the truth which has not been discovered as yet.'", "ls": "s01", "extra": false}, {"id": 458, "q": "The purpose of conducting research in the context of design is to:", "options": ["Inform designers about their practice or help them make informed design decisions", "Replace creative work", "Write longer reports", "Avoid working with users"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 01 – Summary.", "ls": "s01", "extra": false}, {"id": 459, "q": "What is the minimum Final Exam score required to pass RMD301?", "options": ["3", "4", "5", "6"], "answer": 1, "src": "Written from the teacher's slides", "note": "Completion criteria: Final Exam ≥ 4, attendance > 80%.", "ls": "s01", "extra": false}, {"id": 460, "q": "The approval of a research proposal confirms that:", "options": ["The researcher understands the problem and has a clear plan to proceed", "The research is already finished", "The budget is unlimited", "No ethics approval is needed"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 06.", "ls": "s06", "extra": false}, {"id": 461, "q": "In the research proposal structure, 'Stakeholders' answers which question?", "options": ["Who will benefit from or be affected by this research?", "What will be researched?", "Why is there a gap?", "How long will it take?"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 06.", "ls": "s06", "extra": false}, {"id": 462, "q": "Which three appendixes does a research proposal include?", "options": ["Glossary of key terms, Budget, Timetable", "Survey, Interview, Photos", "References, Index, Abstract", "Results, Discussion, Conclusion"], "answer": 0, "src": "Written from the teacher's slides", "note": "Appendix 1 Glossary · 2 Budget · 3 Timetable.", "ls": "s06", "extra": false}, {"id": 463, "q": "Which two sections of a research proposal carry the largest content distribution (3/16 each)?", "options": ["Knowledge gap and Research methods & methodologies", "Title and Research question", "Budget and Timetable", "Stakeholders and Implications"], "answer": 0, "src": "Written from the teacher's slides", "note": "Knowledge gap 3/16, Methods & methodologies 3/16.", "ls": "s06", "extra": false}, {"id": 464, "q": "Raymond Madden (2010) defines ethnography as:", "options": ["An in-depth, systematic study about groups of people by observing or participating in their lives", "A statistical survey of a population", "A review of past literature", "A lab experiment"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 07.", "ls": "s07", "extra": false}, {"id": 465, "q": "Cyber-ethnography is:", "options": ["Studying social relations and behaviours in online social networks and communities", "Studying the researcher's own thoughts", "A lab experiment with computers", "Counting images in media"], "answer": 0, "src": "Written from the teacher's slides", "note": "Reeves et al., 2008.", "ls": "s07", "extra": false}, {"id": 466, "q": "Which three things should ethnographers pay particular attention to when conducting research?", "options": ["Type of communication, level of integration, duration of study", "Budget, sample size, statistics", "Colour, layout, typography", "Hypothesis, prediction, test"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 07.", "ls": "s07", "extra": false}, {"id": 467, "q": "Ethnography originated from which field?", "options": ["Anthropology", "Engineering", "Marketing", "Statistics"], "answer": 0, "src": "Written from the teacher's slides", "note": "Rooted in anthropology (the study of tribal/rural societies).", "ls": "s07", "extra": false}, {"id": 468, "q": "What is the correct order of the six steps before gathering ethnographic data?", "options": ["Select a community → Identify a site → Identify community leaders → Gain access → Establish rapport → Identify key informants", "Gain access → Select a community → Identify informants → Identify site", "Identify informants → Establish rapport → Select community", "Identify leaders → Select community → Gain access → Identify site"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08: 6 steps.", "ls": "s08", "extra": false}, {"id": 469, "q": "Why is it hard to conduct ethnographic research in a familiar environment?", "options": ["It is hard to maintain objectivity and sufficient detachment", "It is too expensive", "Participants refuse to talk", "There is no gatekeeper"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08, step 2.", "ls": "s08", "extra": false}, {"id": 470, "q": "'Key informants' are people who:", "options": ["Provide relevant information and insights and facilitate contacts with other helpful individuals", "Fund the research", "Act as research supervisors", "Are always community leaders"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08, step 6.", "ls": "s08", "extra": false}, {"id": 471, "q": "Which interview type is rigid and most suitable for a survey in a quantitative study?", "options": ["Structured interview", "In-depth interview", "Oral history", "Focus group"], "answer": 0, "src": "Written from the teacher's slides", "note": "Structured interview.", "ls": "s08", "extra": false}, {"id": 472, "q": "Which interview type asks people about personal experiences and memories of their past in a narrative format?", "options": ["Oral history", "Structured interview", "Semi-structured interview", "Focus group"], "answer": 0, "src": "Written from the teacher's slides", "note": "Oral history.", "ls": "s08", "extra": false}, {"id": 473, "q": "When observing people, the two main domains to observe are:", "options": ["Structures & settings, and behaviours & interactions", "Prices and products", "Colours and fonts", "Hypotheses and variables"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08 – Observing people.", "ls": "s08", "extra": false}, {"id": 474, "q": "Cultural probes are mainly used to:", "options": ["Obtain inspirational responses from people, inspiring 'design for pleasure'", "Measure statistical significance", "Replace interviews", "Test hypotheses in a lab"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08.", "ls": "s08", "extra": false}, {"id": 475, "q": "Who delivered the cultural probes for the elderly (postcards, maps, disposable camera, photo album, media diary)?", "options": ["Bill Gaver, Tony Dunne and Elena Pacenti", "Glaser and Strauss", "Husserl and Heidegger", "Jean Kilbourne"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 08.", "ls": "s08", "extra": false}, {"id": 476, "q": "An informed consent form tells the participant about:", "options": ["The nature of the study, the risks involved and their right to quit at any time", "Only the researcher's salary", "The final results", "Nothing, it is just a signature"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 477, "q": "After consent is granted, how many copies should be kept, and by whom?", "options": ["Three: researcher, institution, participant", "One: researcher only", "Two: researcher and supervisor", "None"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 478, "q": "For participants under 18 or developmentally disabled adults, consent must come from:", "options": ["Parents or legal guardians", "The researcher", "The school canteen", "Nobody"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 479, "q": "Deception in research may only be used when:", "options": ["It is justified by significant value, does not affect willingness to participate, no alternative exists, and participants are debriefed immediately", "The researcher wants faster results", "Participants are children", "It saves money"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 480, "q": "Debriefing gives participants the opportunity to:", "options": ["Learn the true purpose, know the results and ask questions", "Get paid more", "Change the data", "Become researchers"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 481, "q": "In ANONYMITY:", "options": ["No one, not even the researcher, knows the participants' personal data", "The researcher knows identities but does not reveal them", "Only the institution knows identities", "Participants' names are published"], "answer": 0, "src": "Written from the teacher's slides", "note": "Anonymity ≠ Confidentiality.", "ls": "s09", "extra": false}, {"id": 482, "q": "The three steps of ethnographic data analysis are:", "options": ["Describe → Categorize → Interpret", "Code → Theme → Report", "Plan → Act → Reflect", "Segment → Compare → Describe"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 483, "q": "Which section has the largest weight in an ethnographic report?", "options": ["Analysis of the Group (20%)", "Introduction (12%)", "Description of the Setting (10%)", "Conclusion (14%)"], "answer": 0, "src": "Written from the teacher's slides", "note": "Analysis of the Group 20%, Context 19%.", "ls": "s09", "extra": false}, {"id": 484, "q": "Which type of case study acts as a starting point and precursor to large-scale investigations?", "options": ["Exploratory", "Descriptive", "Explanatory", "Intrinsic"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 485, "q": "Which type of case study explains cause-effect relationships and produces definitive results?", "options": ["Explanatory", "Exploratory", "Descriptive", "Comparative"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 486, "q": "What are the three principles of organizing case-study data collection?", "options": ["Multiple sources of evidence, formation of a database, chain of evidence", "Hypothesis, test, result", "Sample, survey, statistics", "Plan, act, reflect"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 488, "q": "Who is considered the father of modern phenomenology?", "options": ["Edmund Husserl", "Martin Heidegger", "Barney Glaser", "John Berger"], "answer": 0, "src": "Written from the teacher's slides", "note": "Husserl – Logical Investigations (1900–01).", "ls": "s11", "extra": false}, {"id": 489, "q": "Phenomenology differs from ethnography mainly because it focuses on:", "options": ["Individuals rather than groups", "Statistics rather than words", "The past rather than the present", "Images rather than people"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 490, "q": "How are participants usually selected in phenomenological research?", "options": ["Purposeful sampling of people with direct experience of the phenomenon", "Random sampling of a large population", "Stratified quota sampling", "Only the researcher's friends"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 491, "q": "How many participants should a focus group have?", "options": ["Between five and eight participants", "Exactly two participants", "At least 50 participants", "Only one participant"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11: 5–8 people, 1.5–3 hours.", "ls": "s11", "extra": false}, {"id": 492, "q": "What is the first step of analysing phenomenological data?", "options": ["Data segmentation", "Data categorization", "Comparison of data", "Description of findings"], "answer": 0, "src": "Written from the teacher's slides", "note": "Segmentation → Categorization → Comparison → Description.", "ls": "s11", "extra": false}, {"id": 493, "q": "Design history focuses on the ____, while trend forecasting focuses on the ____.", "options": ["past; future", "future; past", "present; past", "future; present"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 494, "q": "The Mini car's design being affected by the 1956 Suez Canal crisis illustrates considering:", "options": ["Historical time and historical space", "Sampling", "Coding", "Deception"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 495, "q": "Le Corbusier's original drawings and models are an example of:", "options": ["Primary sources", "Secondary sources", "Archival surveys", "Meta-analysis"], "answer": 0, "src": "Written from the teacher's slides", "note": "Primary sources = original materials.", "ls": "s11", "extra": false}, {"id": 496, "q": "What are the three steps for analysing historical data?", "options": ["Explain the context → Establish the validity of the facts → Identify causation and motives", "Collect → Code → Theorize", "Describe → Categorize → Interpret", "Observe → Hypothesize → Test"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 497, "q": "Grounded theory was developed by:", "options": ["Barney Glaser and Anselm Strauss", "Husserl and Heidegger", "Leedy and Ormrod", "Gaver and Dunne"], "answer": 0, "src": "Written from the teacher's slides", "note": "While studying terminally ill patients.", "ls": "s12", "extra": false}, {"id": 498, "q": "In grounded theory, theories are built:", "options": ["Inductively, emerging from data rather than existing frameworks", "Deductively from an existing hypothesis", "Only from literature", "From statistics only"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 12.", "ls": "s12", "extra": false}, {"id": 499, "q": "Which coding step finds connections between codes to form broader categories?", "options": ["Axial coding", "Open coding", "Selective coding", "Random coding"], "answer": 0, "src": "Written from the teacher's slides", "note": "Open → Axial → Selective.", "ls": "s12", "extra": false}, {"id": 500, "q": "Which coding step combines categories into a storyline that leads to a theory?", "options": ["Selective coding", "Open coding", "Axial coding", "Data cleaning"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 12.", "ls": "s12", "extra": false}, {"id": 501, "q": "Grounded theory is criticised as 'washy-wishy' because:", "options": ["Some consider it inappropriate to ignore the existing literature", "It uses too many numbers", "It is too fast", "It needs no data"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 12 – weakness.", "ls": "s12", "extra": false}, {"id": 502, "q": "Which list matches the nine hallmarks of good qualitative research?", "options": ["Purpose, Disclosure, Rigor, Open-mindedness, Completeness, Coherence, Persuasiveness, Usefulness, Consensus", "Validity, Reliability, Sampling, Mean, Median", "Plan, Act, Observe, Reflect", "Icon, Index, Symbol"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 12.", "ls": "s12", "extra": false}, {"id": 503, "q": "Field studies (external setting) improve which type of validity?", "options": ["External validity", "Internal validity", "Content validity", "Face validity"], "answer": 0, "src": "Written from the teacher's slides", "note": "Field → external; Lab → internal.", "ls": "s13", "extra": false}, {"id": 504, "q": "'Stratification' in sampling means:", "options": ["Key characteristics (gender, age, income…) are represented proportionally", "Selecting only one group", "Increasing question numbers", "Removing outliers"], "answer": 0, "src": "Written from the teacher's slides", "note": "E.g. 60% women – 40% men.", "ls": "s13", "extra": false}, {"id": 505, "q": "An observational study:", "options": ["Systematically observes and records without manipulating variables", "Manipulates independent variables", "Only uses interviews", "Builds a new theory from codes"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 13/15.", "ls": "s13", "extra": false}, {"id": 506, "q": "What is the first step of the six-step questionnaire procedure?", "options": ["Define the purpose of the questionnaire", "Pre-test the questionnaire", "Outline the distribution", "Prepare the questions"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 507, "q": "Which question type asks participants to prioritise items (1 = most important)?", "options": ["Ranking question", "Dichotomous question", "Scale question", "Open-ended question"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 508, "q": "Which question type gives only two options such as Yes/No?", "options": ["Dichotomous", "Checklist", "Ranking", "Scale"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 509, "q": "Online surveys risk which kind of bias?", "options": ["Self-selection bias", "Interviewer bias", "Confirmation bias only", "No bias"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 510, "q": "Adding 'Other (please specify)' follows which survey principle?", "options": ["Clear and exhaustive options", "Brevity", "Accessibility", "Pilot testing"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 511, "q": "Which survey principle is about testing the survey with a small group before distributing it?", "options": ["Pilot testing", "Consistency", "Brevity", "Effective design"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 14.", "ls": "s14", "extra": false}, {"id": 512, "q": "A usability lab with one-way glass and hidden cameras is an example of:", "options": ["A lab-based experiment", "A real-world experiment", "An oral history", "Content analysis"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 15.", "ls": "s15", "extra": false}, {"id": 513, "q": "Google Analytics collecting user behaviour data without researcher interference is an example of:", "options": ["An observational study", "An experimental study", "A focus group", "Grounded theory"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 15.", "ls": "s15", "extra": false}, {"id": 514, "q": "Mean, median and mode belong to:", "options": ["Descriptive statistics", "Inferential statistics", "Semiotics", "Thematic analysis"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 15.", "ls": "s15", "extra": false}, {"id": 515, "q": "T-tests and ANOVA belong to:", "options": ["Inferential statistics", "Descriptive statistics", "Data cleaning", "Coding"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 15.", "ls": "s15", "extra": false}, {"id": 516, "q": "A survey response showing an age of 200 years should be caught by:", "options": ["Anomaly detection", "Pilot testing", "Stratification", "Debriefing"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 15 – data quality.", "ls": "s15", "extra": false}, {"id": 517, "q": "In the 7-step hallmark of good quantitative research, what comes right after 'Hypothesis'?", "options": ["Prediction", "Test", "Observation", "Positive results"], "answer": 0, "src": "Written from the teacher's slides", "note": "Observation → Question → Hypothesis → Prediction → Test → Negative/Positive.", "ls": "s15", "extra": false}, {"id": 518, "q": "Visual connoisseurship is also called:", "options": ["The 'Good Eye' principle", "The 'Best Light' principle", "Capitalist realism", "Coding sheet"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 519, "q": "The main limitation of compositional interpretation is that it:", "options": ["Ignores socially specific ways of seeing and experiencing things", "Needs too many images", "Is too quantitative", "Has no vocabulary"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 520, "q": "Katy Parry's study of UK press photos of the 2003 Iraq invasion is an example of:", "options": ["Quantitative content analysis", "Semiotics", "Visual connoisseurship", "Phenomenology"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 521, "q": "Unlike content analysis, semiotics:", "options": ["Requires relatively few resources and does not need a large number of images, but requires high topic knowledge", "Needs thousands of images", "Is purely statistical", "Needs no knowledge"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 522, "q": "In Peirce's semiotics, an ICON relates to its object by:", "options": ["Visual resemblance", "Direct connection", "Cultural convention", "Statistics"], "answer": 0, "src": "Written from the teacher's slides", "note": "Icon – resemblance; Index – connection; Symbol – convention.", "ls": "s16", "extra": false}, {"id": 523, "q": "Which advertising format (Leiss et al., 1997) focuses on explaining the product and its utility and was popular at the turn of the 20th century?", "options": ["Product-information format", "Product-image format", "Personalized format", "Lifestyle format"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 524, "q": "Which advertising format links products to desirable lifestyles and social groups?", "options": ["Lifestyle format", "Product-information format", "Product-image format", "Personalized format"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 525, "q": "Jean Kilbourne's 'Killing Us Softly' series critiques:", "options": ["Gender stereotypes in advertising", "Race in video games", "Architecture", "Typography"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 526, "q": "Culturographic analysis studies audience reactions by using:", "options": ["Interviews and ethnographic observations", "Only statistics", "Only semiotics", "Eye tracking only"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 16.", "ls": "s16", "extra": false}, {"id": 527, "q": "Basic research asks 'Is it true?', while applied research asks:", "options": ["'Does it work?'", "'Why is it beautiful?'", "'Who paid for it?'", "'How many?'"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 528, "q": "Which statement about action research is correct?", "options": ["It does not necessarily need to begin with a clearly defined hypothesis or research question", "It always starts with a fixed hypothesis", "It is never participatory", "It avoids changing practice"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 529, "q": "Co-design was first introduced in:", "options": ["Architectural design", "Advertising", "Statistics", "Military planning"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 530, "q": "In democratic research, the researcher works as a:", "options": ["Facilitator of change, consulting participants as equals", "Boss who decides alone", "Silent observer", "Statistician"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 531, "q": "Which is a weakness of applied research?", "options": ["Limited theoretical contribution and challenges in generalization", "Practical problem solving", "Immediate impact", "Industry relevance"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 532, "q": "The Dream City Workshop (Nashville Youth Design Team) places emphasis on:", "options": ["The needs and preferences of young people rather than adults", "Statistics of city budgets", "Adults' preferences", "Architects only"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 17.", "ls": "s17", "extra": false}, {"id": 533, "q": "UCD research is described as:", "options": ["A human-focused experimental approach where users are actively involved throughout the design process", "A purely statistical approach without users", "Only visual styling", "A one-time test after launch"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 52.", "ls": "s52", "extra": false}, {"id": 534, "q": "UXD is positioned as:", "options": ["A core component of UCD covering all aspects of a user's interaction with a company", "Only interface colours", "A marketing technique", "Unrelated to UCD"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 52.", "ls": "s52", "extra": false}, {"id": 535, "q": "When combining methods, qualitative research explores the ____ and quantitative research measures the ____.", "options": ["'why'; 'what'", "'what'; 'why'", "'how much'; 'who'", "'when'; 'where'"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 52.", "ls": "s52", "extra": false}, {"id": 536, "q": "Which innovation strategy aims to turn non-consumers into consumers?", "options": ["Disruptive innovation", "Incremental innovation", "Breakthrough innovation", "Product-information format"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 52 – Airbnb.", "ls": "s52", "extra": false}, {"id": 537, "q": "Which innovation strategy maintains market stability and funds R&D?", "options": ["Incremental innovation", "Breakthrough innovation", "Disruptive innovation", "Radical design"], "answer": 0, "src": "Written from the teacher's slides", "note": "Session 52.", "ls": "s52", "extra": false}, {"id": 123, "q": "What is the main principle of human-centered design in Dieter Rams' view?", "options": ["Designers should balance people's needs with their own creative preferences.", "Designers should place people's needs at the centre of decisions.", "Designers should place visual quality before people's practical requirements.", "Designers should develop solutions mainly according to technological possibilities.", "Designers should focus equally on appearance, function, and production efficiency."], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 125, "q": "How should designers understand people's needs when developing human-centred solutions?", "options": ["By relying mainly on intuition developed through professional design experience.", "By studying visual preferences before investigating people's broader social contexts.", "By researching what people want, need, feel, and experience.", "By comparing people's preferences with established principles of visual design.", "By observing people's behavior without investigating their personal experiences."], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 126, "q": "How can designers gain a better understanding of people and their contexts?", "options": ["By depending only on popular opinions.", "By conducting their own research and studying socio-cultural and socio-economic contexts.", "By avoiding information about users and their environments.", "By focusing highly on the appearance of a product."], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "CORRECTED: the original file says A ('depending only on popular opinions') – clearly wrong. Correct: research people yourself and study their socio-cultural and socio-economic contexts.", "ls": "s02", "extra": true}, {"id": 127, "q": "Why must designers consider environmental and political impacts of their work?", "options": ["Designers must ensure every project satisfies existing political expectations.", "Environmental concerns generally determine which design solutions become successful.", "Social responsibility mainly protects designers from criticism after production.", "Design decisions can influence people's lives within wider social contexts.", "None are correct"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 128, "q": "How should designers respond to new and emerging technologies affecting people's lives?", "options": ["Adopting technologies whenever they improve production speed and efficiency.", "Evaluating how technologies influence people before designing appropriate solutions.", "Allowing technological possibilities to determine the final design direction.", "Prioritizing technological innovation over social and environmental considerations.", "All are correct", "None are correct"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 129, "q": "What responsibility should designers demonstrate in contemporary design practice?", "options": ["Accountability for the consequences of their decisions.", "Originality regardless of their solutions' social consequences.", "Technical expertise before considering users' experiences.", "Visual creativity through increasingly complex design outcomes.", "Efficiency by minimizing research during development."], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 130, "q": "How does research help designers reduce personal biases and preconceptions?", "options": ["Allowing designers to remove personal judgment from design decisions.", "Encouraging designers to follow users' opinions without critical analysis.", "Helping designers replace creative judgment with objective measurements.", "Allowing designers to establish universal preferences among different users.", "Encouraging designers to compare their assumptions with different perspectives."], "answer": 4, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 131, "q": "What should designers ultimately aim to create through research-informed design?", "options": ["Solutions that achieve practical performance through efficient research and production.", "Solutions that are visually attractive, functional, sustainable, meaningful, and appropriate.", "Solutions that prioritize user satisfaction while maintaining designers' creative independence.", "Solutions that achieve practical performance through efficient research and production.", "All are correct"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 132, "q": "What mainly characterizes the technological direction of the 4.0 Industrial Revolution?", "options": ["Applying information technology mainly to traditional forms of mechanical production", "Expanding electrical systems to support mass productions", "Combines cyber-physical systems with advanced automations", "Improving manufacturing systems without connecting physical technologies digitally."], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 133, "q": "Why is Industry 4.0 associated with cyber-physical systems?", "options": ["They eliminate human involvement from every production decision.", "They focus exclusively on increasing mechanical production speed.", "They replace information technology with traditional manufacturing methods.", "They connect digital technologies with physical industrial processes."], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 134, "q": "How are Internet of Things technologies transforming contemporary industrial activities?", "options": ["Connecting physical objects through digital communication networks.", "Separating manufacturing equipment from information systems.", "Reducing the need for data-driven business decisions.", "Limiting automation to isolated factory machines only."], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s04", "extra": true}, {"id": 135, "q": "Why has data analytics become important in Industry 4.0?", "options": ["It removes the need for strategic organizational planning.", "It guarantees identical productivity results across every industry.", "It supports informed decisions through analysis of collected data.", "It limits business intelligence to historical production records."], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s04", "extra": true}, {"id": 136, "q": "What does human-centred design require designers to understand about the 4.0 technologies?", "options": ["Who they design for and why transformation matters.", "How to maximize automation without considering user needs.", "Which technologies can completely replace human judgment.", "Why production speed should always outweigh social concerns."], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 137, "q": "How can Industry 4.0 technologies affect business performance?", "options": ["They mainly increase production costs and reduce operational flexibility.", "They can improve productivity, flexibility, quality, and profitability.", "They prioritize technological novelty over measurable organizational performance", "They improve productivity while eliminating all implementation challenges.", "None are correct"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 138, "q": "What abilities will become increasingly important in newly created jobs?", "options": ["Technical programming and mechanical maintenance skills", "Judgement, decision-making, and interpersonal management abilities", "Repetitive task performance and operational accuracy", "Financial reporting and standardized administrative procedures", "None are correct"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 139, "q": "Why will managing people and resources become valuable?", "options": ["Organizations will eliminate most responsibilities involving teamwork", "Automation will reduce the importance of organizational leadership", "New positions will require coordination amid workplace disruptions", "Employees will increasingly perform independent technical activities", "All are correct", "None are correct"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 140, "q": "How can workers develop competitive advantages in changing environments?", "options": ["Specializing exclusively in one technical profession", "Avoiding transitions between different occupational responsibilities", "Prioritizing formal qualifications over workplace adaptability", "Moving between jobs and adapting to new environments"], "answer": 3, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 141, "q": "What does the passage identify as an increasingly important soft skill?", "options": ["Memorizing standardized procedures across industrial departments", "Managing financial resources through automated systems", "Demonstrating critical inquiry and complex problem-solving abilities", "Operating mechanical equipment without external assistance"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 142, "q": "What does resilience mean in the context of future employment?", "options": ["Maintaining identical responsibilities throughout one's career", "Adapting effectively when workplaces experience significant disruption", "Avoiding professional changes caused by emerging technologies", "Developing technical expertise without responding to uncertainty"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 143, "q": "How many people could potentially be displaced by automation by 2030?", "options": ["100–200 million individuals worldwide", "200–300 million individuals worldwide", "400–800 million individuals worldwide", "800–1,000 million individuals worldwide"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 144, "q": "Why might displaced workers need additional education or training?", "options": ["Maintain their original occupations without professional changes", "Develop skills relevant to emerging employment opportunities", "Replace workplace experience with academic qualifications", "Avoid working in technology-related industrial environments"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 145, "q": "What proportion of employees may require significant reskilling or upskilling?", "options": ["Less than one-quarter of employees worldwide", "Approximately one-third of employees worldwide", "More than half of employees worldwide", "Nearly all employees across different economic sectors"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 146, "q": "How are companies responding to employees' changing skill requirements?", "options": ["Most organizations have established identical retraining strategies", "Companies increasingly recognize the importance of employee development", "Businesses generally reduce training to prioritize automation investments", "Employers focus exclusively on recruiting external technical specialists"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 147, "q": "What does the passage suggest about companies' retraining decisions?", "options": ["All companies intend to retrain existing employees", "Most companies have rejected employee development programs", "Some companies remain uncertain or unlikely to retrain employees", "Companies prioritize retraining only workers in technical occupations"], "answer": 2, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 148, "q": "Why might workers need to acquire skills during changing jobs?", "options": ["Job responsibilities increasingly require continuous professional adaptation", "Employers expect workers to maintain fixed occupational knowledge", "Automation reduces the importance of learning new competencies", "Changing jobs generally eliminates the need for further training"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 149, "q": "How are displaced workers increasingly addressing employment challenges?", "options": ["Avoiding higher education and professional retraining", "Entering universities to develop emerging occupational knowledge", "Returning exclusively to traditional manufacturing occupations", "Replacing formal education with short-term workplace experience"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 150, "q": "What employment arrangement may increase as skill gaps develop?", "options": ["Permanent employment within a single organizational department", "External consulting, contracting, freelancing, and temporary work", "Government employment with standardized long-term responsibilities", "Traditional employment based on fixed technical specialization"], "answer": 1, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 151, "q": "Why does Industry 4.0 increase the importance of lifelong learning?", "options": ["Technological change requires workers to continually develop relevant skills", "Industrial automation eliminates the need for formal education", "Professional development becomes unnecessary after initial employment", "Digital transformation reduces the variety of workplace responsibilities"], "answer": 0, "src": "Class review file (Groups 1 & 2)", "note": "", "ls": "s02", "extra": true}, {"id": 152, "q": "Why must contemporary education change to meet Industry 4.0 requirements?", "options": ["Modern industries re
