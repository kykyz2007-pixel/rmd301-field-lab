, "ls": "s03", "extra": false}, {"id": 12, "q": "Which ethical mistake involves adjusting data without proper justification or recording, or presenting invented data?", "options": ["Data Misinterpretation", "Data Fabrication", "Data Omission", "Data Skewing"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s05", "extra": false}, {"id": 13, "q": "Which term is narrower in scope and focuses on the techniques and procedures used in solving research problems?", "options": ["Research Methodology", "Research Philosophy", "Research Method", "Research Approach"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s05", "extra": false}, {"id": 14, "q": "Ethnography is considered the core of which design approach?", "options": ["Technology-driven design", "Artist-centered design", "Human-centered design", "Economy-focused design"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s07", "extra": false}, {"id": 15, "q": "What is the purpose of Qualitative Research?", "options": ["To use numeric data to arrive at conclusions", "To construct a rich and meaningful picture of a complex situation", "To identify cause-and-effect relationships between variables", "To test or verify an existing theory"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s10", "extra": false}, {"id": 16, "q": "Design Thinking is widely accepted as the process of bringing together which two essential skills?", "options": ["Technical and managerial", "Creative and critical thinking", "Intuitive and artistic", "Economic and financial"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 17, "q": "In the 1960s, the design focus shifted from technology and form to consideration of what?", "options": ["Cost efficiency", "Mass communication", "Human needs and behavior", "Artistic expression"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 18, "q": "Which ethical principle requires that the benefits of the research justify any risks of harm or discomfort to participants?", "options": ["Justice", "Autonomy", "Non-Maleficence", "Beneficence"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s05", "extra": false}, {"id": 19, "q": "In ethnography, what is the main risk of a researcher becoming \"over-integrated\" in the culture being studied?", "options": ["The study will be too brief", "Loss of objectivity, leading to subjective and biased results", "Failure to gain access to a gatekeeper", "Running out of budget"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s08", "extra": false}, {"id": 21, "q": "Newly established design schools often reclassified themselves as art schools because design was firmly defined as a subset of:", "options": ["Science", "Technology", "Art", "Commerce"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 22, "q": "The main aim of the ethnographer is to conduct:", "options": ["Market analysis", "Statistical generalization", "Cultural interpretation", "Scientific experimentation"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s07", "extra": false}, {"id": 23, "q": "What is a key characteristic of Quantitative Research?", "options": ["Data collection and analysis evolve simultaneously", "It is independent from the researcher and uses objective observations", "It encourages exploration through open-ended questions", "It focuses on subjective interpretation of lived experiences"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s11", "extra": false}, {"id": 24, "q": "Which iconic designer is known as 'The Father of Streamlining' and 'The Father of Industrial Design'?", "options": ["Henry Dreyfuss", "Leonardo da Vinci", "Raymond Loewy", "Frank Lloyd Wright"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 25, "q": "What is cited as the biggest challenge for the adoption of research in design?", "options": ["Lack of funding", "Design being traditionally taught under art rather than science", "Difficulty in finding research participants", "Insufficient digital tools"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 26, "q": "Which visual research method examines how images create meaning by studying signs, especially in advertising?", "options": ["Compositional Interpretation", "Semiotics", "Cultural Context Analysis", "Observational Study"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s16", "extra": false}, {"id": 27, "q": "Design work in Europe and the US from the early 19th century through the first half of the 20th century initially began as a ______ activity.", "options": ["Trade", "Artistic", "Craft", "Engineering"], "answer": 0, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 28, "q": "Which research purpose should generally be avoided?", "options": ["Looking at a body of data that can contribute to a solution of a problem", "Gathering information just to learn something about a certain area (self-enlightenment)", "Consolidating and aligning two different fields of study", "Seeking to challenge existing theories"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s04", "extra": false}, {"id": 29, "q": "In the context of Industry 4.0, which demand is a detriment for designers who focus on technical execution and need detailed design briefs?", "options": ["Increased focus on aesthetics", "The need for strong discipline-specific knowledge", "Collaboration with other designers", "The demand for well-developed critical thinking skills and complex problem framing"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s02", "extra": false}, {"id": 30, "q": "According to the Oxford Dictionary, a 'system of methods used in a particular area of study or activity' is the definition of:", "options": ["Research Method", "Research Triangulation", "Research Methodology", "Research Proposal"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s06", "extra": false}, {"id": 31, "q": "What is the primary type of data used in Quantitative Research?", "options": ["Textual narratives", "Numeric data", "Subjective opinions", "Unverified anecdotes"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s13", "extra": false}, {"id": 32, "q": "Which type of qualitative research emphasizes personal experiences and subjective interpretations to uncover emotional responses to design?", "options": ["Case Study", "Historical Research", "Grounded Theory", "Phenomenology"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s12", "extra": false}, {"id": 33, "q": "Visual Culture emphasizes which of the following as essential, challenging a historical preference for text?", "options": ["Data Quantification", "Textual Analysis", "Visual Literacy", "Statistical Modeling"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s16", "extra": false}, {"id": 34, "q": "During the Second World War, new 'industrial' designers were tasked with focusing on:", "options": ["Market Research", "Human factors and ergonomics", "Product distribution", "Artistic refinement"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 35, "q": "In a research proposal, the Research Methods and Methodologies section gets a content distribution of:", "options": ["1/64", "2/64", "3/16", "1/16"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s06", "extra": false}, {"id": 36, "q": "Which of the following is a benefit of incorporating research into the design process?", "options": ["Prioritizes self-exploration", "Encourages competition", "Challenges assumptions and identifies opportunities", "Focuses exclusively on aesthetics"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cô)", "note": "", "ls": "s03", "extra": false}, {"id": 37, "q": "What is the main purpose of research?", "options": ["To reach agreement among designers", "To discover something previously unknown", "To gather personal opinions", "To turn ideas into products"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s01", "extra": false}, {"id": 38, "q": "What are Research Methods in Design (RMD)?", "options": ["Aesthetic principles used in design", "A set of rules to create a perfect product", "The specific approaches designers use to collect, analyze data, and interpret its meaning", "A design process guided purely by intuition"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s01", "extra": false}, {"id": 39, "q": "Why do designers conduct research?", "options": ["To produce academic documents for students", "To create creative artworks", "To make products look more aesthetic", "To inform their design practice or help them make well-reasoned design decisions"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s01", "extra": false}, {"id": 40, "q": "Which of the following is NOT considered a suitable research problem?", "options": ["A core issue that needs improvement", "A problem whose answer can only be \"yes\" or \"no\"", "A difficulty that needs to be addressed", "A theoretical or practical question that needs to be examined"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s04", "extra": false}, {"id": 41, "q": "In a Research Statement, what does \"Limit\" refer to?", "options": ["The constraints or limitations that may affect the scope or outcomes of the research", "What will be included in the research", "Expected research outcomes", "The main objective of the research effort"], "answer": 0, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s04", "extra": false}, {"id": 42, "q": "With the rise of AI and ML in Industry 4.0, designers are predicted to shift from creators/producers to which new role?", "options": ["Programmer", "Curator", "Marketer", "Data analyst"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s02", "extra": false}, {"id": 43, "q": "Which is a soft skill becoming more important in a tech-dominated world?", "options": ["Programming", "Machine operation", "Accounting", "Critical thinking, empathy, creativity, ethics, and communication"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s02", "extra": false}, {"id": 44, "q": "Which collaboration style requires a fusion of disciplines where designers cross professional boundaries and adopt ways of working from other fields?", "options": ["Intradisciplinary Design", "Interdisciplinary Design", "Multidisciplinary Design", "Transdisciplinary Design"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s02", "extra": false}, {"id": 45, "q": "According to Problem-Based Learning, what are students expected to do?", "options": ["Follow one fixed design process", "Focus only on showing personal strengths", "Develop their own design brief by conducting exploratory research", "Rely on individual guidance from the instructor"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s02", "extra": false}, {"id": 46, "q": "What is the main purpose of a Literature Review?", "options": ["To collect new data through surveys", "To look at previous findings and identify gaps in knowledge", "To establish a causal relationship", "To create a new theory from data"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s04", "extra": false}, {"id": 47, "q": "Which type of literature review statistically synthesizes results from several studies that answer the same research question?", "options": ["Theoretical Review", "Historical Review", "Meta-Analysis", "Thematic Review"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s04", "extra": false}, {"id": 48, "q": "Which ethical mistake involves presenting someone else's work or data as your own?", "options": ["Data Fabrication", "Elimination of Data", "Over-exploitation of Data", "Plagiarism"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s05", "extra": false}, {"id": 49, "q": "Which core ethical principle requires that participants are not exploited and that research benefits are fairly distributed and accessible?", "options": ["Respect", "Beneficence", "Merit and Integrity", "Justice"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s05", "extra": false}, {"id": 50, "q": "Comparing multiple sources of evidence to increase credibility, validity, and reliability is called:", "options": ["Validity Assessment", "Multimethod Research", "Triangulation", "Thematic Analysis"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s15", "extra": false}, {"id": 51, "q": "What is Ethnography?", "options": ["Quantitative research using numerical data", "Research focusing on individual lived experiences", "In-depth, systematic study of groups by observing or participating in their daily lives", "Historical research of past events"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s07", "extra": false}, {"id": 52, "q": "Which research approach is considered the core of Human-Centered Design?", "options": ["Quantitative Research", "Applied Research", "Ethnographic Research", "Historical Research"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s17", "extra": false}, {"id": 53, "q": "In ethnography, who is the influential person with social status who helps researchers gain access to the site and community?", "options": ["Key Informant", "Participant", "Gatekeeper", "Facilitator"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s08", "extra": false}, {"id": 54, "q": "Which is NOT good ethnography, even if the researcher actively participates in daily activities?", "options": ["Maintaining a critical stance", "Providing an independent reflection on observations", "Becoming a member of the group to the point of losing objectivity", "Keeping personal distance"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s07", "extra": false}, {"id": 55, "q": "Cultural Probes are typically designed to inspire:", "options": ["Design for utility", "Design for pleasure", "Design for profit", "Design for science"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s08", "extra": false}, {"id": 56, "q": "In Confidentiality, who knows the participant's personal data but does not disclose their identity?", "options": ["No one", "Only the participant", "The researcher and investigator", "The public"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s09", "extra": false}, {"id": 57, "q": "Which of the following is required in a Case Study?", "options": ["Using only quantitative data", "Focusing on one single independent variable", "Collecting and analyzing data from multiple sources to gain deep understanding", "Studying only past events"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s10", "extra": false}, {"id": 58, "q": "What main question does Phenomenology try to answer?", "options": ["How often does this behavior occur?", "What is the causal relationship between two variables?", "What past events led to this situation?", "What is it like to do or experience something?"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s11", "extra": false}, {"id": 59, "q": "What does Historical Research focus on?", "options": ["Predicting future sales", "Explaining past events, trends, and developments to understand their impact today", "Developing new theories from user data", "Measuring consumer attitudes"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s11", "extra": false}, {"id": 60, "q": "The goal of Grounded Theory is to:", "options": ["Test existing theories", "Use established frameworks to explain data", "Develop theory inductively from collected data", "Prove causal relationships"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s12", "extra": false}, {"id": 61, "q": "What is the correct order of Coding in Grounded Theory?", "options": ["Axial → Open → Selective", "Open → Axial → Selective", "Selective → Axial → Open", "Axial → Selective → Open"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "ĐÃ SỬA: Quizlet ghi C (sai). Thứ tự đúng: Open coding → Axial coding → Selective coding (slide Nhóm 3: mã hóa mở → mã hóa trục → …).", "ls": "s12", "extra": false}, {"id": 62, "q": "What is Quantitative Research?", "options": ["Deep research using narrative data", "Experimental research using numerical data", "Research that builds new theories", "Research always influenced by researcher bias"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s15", "extra": false}, {"id": 63, "q": "Research in Controlled Lab Environments improves which type of validity?", "options": ["External Validity", "Internal Validity (isolating causal relationships)", "Reliability", "Generalization"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s15", "extra": false}, {"id": 64, "q": "Quantitative Observational Studies describe patterns and behaviors by measuring which two elements?", "options": ["Lived experiences and cultural meanings", "Frequency (how often) and conditions under which it occurs", "Internal and external validity", "Subjectivity and objectivity"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s11", "extra": false}, {"id": 65, "q": "Which question type allows participants to choose multiple answers?", "options": ["Dichotomous", "Single Selection", "Multi-Selection / Checklist", "Ranking"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s14", "extra": false}, {"id": 66, "q": "Likert Scale and Semantic Differential Scale are examples of:", "options": ["Single-choice Questions", "Ranking Questions", "Open Questions", "Scale Questions"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s14", "extra": false}, {"id": 67, "q": "Visual Research studies and interprets which elements?", "options": ["Numerical data and statistics", "Personal narratives and lived experiences", "Images, forms, and objects in visual and material culture", "Historical records"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s16", "extra": false}, {"id": 68, "q": "Which visual analysis method is a quantitative approach involving counting and summarizing phenomena in images or text?", "options": ["Compositional Interpretation", "Semiotics", "Visual Connoisseurship", "Content Analysis"], "answer": 3, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s16", "extra": false}, {"id": 69, "q": "In Semiotics, which type of sign has a direct relationship to its object (e.g., smoke indicating fire)?", "options": ["Symbol", "Index", "Icon", "Variable"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s16", "extra": false}, {"id": 70, "q": "Which applied research approach uses a creative artefact as the central part of the investigation?", "options": ["Practice-led Research", "Action Research", "Practice-based Research", "Ethnographic Research"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s17", "extra": false}, {"id": 71, "q": "Action Research is a cyclical process consisting of which steps?", "options": ["Act, Observe, Reflect, Plan", "Observe, Plan, Act, Reflect", "Plan, Act, Observe, Reflect", "Reflect, Plan, Observe, Act"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s17", "extra": false}, {"id": 72, "q": "Which innovation strategy introduces new and superior products and shifts a company into a new market category (e.g., the first iPhone)?", "options": ["Incremental Innovation", "Breakthrough Innovation", "Disruptive Innovation", "Product-based Innovation"], "answer": 1, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s52", "extra": false}, {"id": 73, "q": "Which strategy targets non-consumers with simple, affordable solutions to create new markets?", "options": ["Incremental Innovation", "Breakthrough Innovation", "Disruptive Innovation", "Product-based Innovation"], "answer": 2, "src": "Quizlet: 40 CÂU RMD301 (cá)", "note": "", "ls": "s52", "extra": false}, {"id": 74, "q": "Which of the following is a characteristic of qualitative research?", "options": ["Focuses on numbers and statistics", "Uses questionnaires and surveys", "Focuses on users' emotions and behaviors", "Analyzes numerical data"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 75, "q": "When should the quantitative research method be used?", "options": ["When deeply analyzing user behavior in a natural context", "When exploring in-depth factors from a small sample", "When performing statistical analysis from a large sample", "When surveying participants' emotions"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s13", "extra": false}, {"id": 76, "q": "Which qualitative method is used to understand user behavior through direct conversation?", "options": ["In-depth interview", "Behavioral observation", "Focus group", "User diary"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 77, "q": "True or false: \"Qualitative research primarily analyzes numerical data, including surveys.\"", "options": ["True", "False", "Partially true", "Cannot determine"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 78, "q": "Which of the following is NOT a form of qualitative data analysis?", "options": ["Thematic analysis", "Regression analysis", "Data coding", "Content analysis"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 79, "q": "In writing a scientific paper, which section should clearly describe the research methods used?", "options": ["Abstract", "Introduction", "Methodology", "Conclusion"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s05", "extra": false}, {"id": 80, "q": "What is the correct definition of \"Quantitative Research\"?", "options": ["Collects non-numerical data", "Uses data and statistics for analysis", "Combines qualitative and quantitative", "Interviewing user groups"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s13", "extra": false}, {"id": 81, "q": "What does \"sampling\" mean in research?", "options": ["Selecting participants from a population for research", "Analyzing data with software", "Using samples to estimate results", "Describing participant behavior"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "ĐÃ SỬA: Quizlet ghi C. Theo slide Nhóm 5 (Quantitative): Sampling = chọn người tham gia từ một population → đáp án A.", "ls": "s13", "extra": false}, {"id": 82, "q": "How should the \"Results\" section in a scientific paper be presented?", "options": ["Summarize data analysis results", "Interpret results using past studies", "Present unverified hypotheses", "Cite related research"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "Phần so sánh với nghiên cứu trước thuộc Discussion, không phải Results.", "ls": "s15", "extra": false}, {"id": 83, "q": "True or false: \"Questions in a deep interview should be open-ended and have no right or wrong answers.\"", "options": ["True", "False", "May be true in some cases", "Not sure"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s08", "extra": false}, {"id": 84, "q": "What is the main objective of using mixed methods in research?", "options": ["To increase the length of the study", "To combine the strengths of both qualitative and quantitative methods", "To avoid using statistical data", "To shorten the data collection process"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 85, "q": "Which type of research is suitable for uncovering user problems that were previously unknown?", "options": ["Quantitative research", "Qualitative research", "Statistical analysis", "Big data analytics"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 87, "q": "Which type of question is NOT suitable for qualitative research?", "options": ["Open-ended questions", "Multiple-choice questions", "Emotion-based questions", "Behavior-exploring questions"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 88, "q": "Which technique is commonly used in qualitative analysis?", "options": ["Data coding", "Regression analysis", "Mean calculation", "Data normalization"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s12", "extra": false}, {"id": 90, "q": "What is the purpose of the \"Introduction\" in a research paper?", "options": ["Presenting data", "Stating research problems and objectives", "Analyzing results", "Listing references"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s04", "extra": false}, {"id": 91, "q": "What is a quality assessment criterion in qualitative research?", "options": ["Generalizability", "Reliability", "Probability", "Sampling error"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "Gần đúng nhất trong 4 lựa chọn. Từ chuẩn của định tính là Trustworthiness / Rigour.", "ls": "s10", "extra": false}, {"id": 93, "q": "Which of the following is a step in the basic research process?", "options": ["Writing financial reports", "Designing book covers", "Data collection and analysis", "Sending promotional emails"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 94, "q": "Which section in a scientific paper presents the results of surveys, observations, or experiments?", "options": ["Introduction", "Literature Review", "Findings / Results", "References"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s04", "extra": false}, {"id": 95, "q": "When writing a research report, tables and images must:", "options": ["Be added at the end of the document", "Not require captions", "Be numbered and clearly captioned", "Only be used if there's no text"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 96, "q": "What is a key characteristic of semi-structured interviews?", "options": ["No specific questions", "Predefined questions but flexible", "Multiple choice only", "Interview through a survey form"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s08", "extra": false}, {"id": 100, "q": "Which data collection method produces quantitative results?", "options": ["In-depth interviews", "Structured questionnaires", "Field notes", "Focus group discussion"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s14", "extra": false}, {"id": 101, "q": "In scientific research, which method is commonly used to test hypotheses?", "options": ["Qualitative research", "Case study", "Experimental research", "Focus group"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s13", "extra": false}, {"id": 102, "q": "What should be the first step in user research?", "options": ["Analyzing statistical data", "Conducting online surveys", "Defining goals and research problem", "Designing prototypes"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s04", "extra": false}, {"id": 103, "q": "The main difference between active and passive observers in observation research is:", "options": ["The level of involvement in the research context", "Number of observers", "Type of questionnaire used", "Duration of observation"], "answer": 0, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s14", "extra": false}, {"id": 105, "q": "Which type of research is commonly used to find relationships between two variables?", "options": ["Descriptive", "Case Study", "Correlational", "Historical"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 106, "q": "What is an advantage of qualitative research?", "options": ["Ability to analyze large datasets", "In-depth analysis of personal experiences", "Results are easy to quantify", "High replicability"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 107, "q": "In quantitative research, what is an \"independent variable\"?", "options": ["Variable measured when others change", "Variable used to control interference", "Variable that causes changes", "Variable unrelated to the study"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "ĐÃ SỬA: Quizlet ghi A (sai – A là biến phụ thuộc). Biến độc lập = biến được thao tác, GÂY RA thay đổi → C.", "ls": "s15", "extra": false}, {"id": 109, "q": "Which statement is true about in-depth interviews?", "options": ["Includes closed-ended questions only", "Always includes quantitative surveys", "Allows exploration of personal insights", "Used only in experimental research"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s15", "extra": false}, {"id": 111, "q": "What is the purpose of a \"User Persona\" in research?", "options": ["Analyze quantitative data", "Predict user behavior", "Describe a typical user profile", "Design product prototypes"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s13", "extra": false}, {"id": 112, "q": "Which statement is true about \"Design Thinking\"?", "options": ["A rigid linear process", "Irrelevant to users", "Focused on creative problem-solving", "Based entirely on statistical data"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s03", "extra": false}, {"id": 113, "q": "Which UX/UI research model is used to understand user needs and behaviors?", "options": ["SWOT", "Double Diamond", "Five Forces", "PESTEL"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s52", "extra": false}, {"id": 114, "q": "How many phases are there in the Double Diamond model?", "options": ["2", "3", "4", "5"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "Discover – Define – Develop – Deliver.", "ls": "s02", "extra": false}, {"id": 115, "q": "Which of the following is NOT a qualitative research method?", "options": ["In-depth interview", "Participant observation", "A/B testing", "Content analysis"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s10", "extra": false}, {"id": 116, "q": "A characteristic of academic research papers is:", "options": ["Written in an emotional style", "No need to cite sources", "Structured and logical format", "Use of casual language"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 119, "q": "What academic issue is in this excerpt: \"Design is the most important thing ever (Nguyen, 2022). Everyone loves it.\"", "options": ["Correct APA citation", "Subjective statement without evidence", "Missing author's name", "No error"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 120, "q": "The standard structure of an academic paper often includes:", "options": ["Introduction, body, conclusion", "Title, reflection, conclusion", "Abstract, Introduction, Methods, Results, Discussion", "Summary, Review, Feedback"], "answer": 2, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 121, "q": "In user research, an \"insight\" is usually:", "options": ["A general comment", "A repeated, implicit observation", "A product description", "A sales pitch"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s02", "extra": false}, {"id": 122, "q": "What is the role of Ethics in research?", "options": ["Identify target markets", "Ensure transparent and respectful processes", "Optimize project cost", "Boost social media engagement"], "answer": 1, "src": "Quizlet: rmd301 50 câu", "note": "", "ls": "s05", "extra": false}, {"id": 456, "q": "According to the course slides, 'research' (RE + SEARCH) implies that:", "options": ["One must observe again and again to gain insight of a phenomenon", "Research is done only once", "Research means searching the internet", "Research avoids scientific procedure"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 01: RE (again) + SEARCH → quan sát lặp lại để hiểu hiện tượng.", "ls": "s01", "extra": false}, {"id": 457, "q": "What is the main aim of research according to the course introduction?", "options": ["To find out the truth which has not been discovered yet", "To make products beautiful", "To sell more goods", "To copy existing designs"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 01: 'The main aim of research is to find out the truth which has not been discovered as yet.'", "ls": "s01", "extra": false}, {"id": 458, "q": "The purpose of conducting research in the context of design is to:", "options": ["Inform designers about their practice or help them make informed design decisions", "Replace creative work", "Write longer reports", "Avoid working with users"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 01 – Summary.", "ls": "s01", "extra": false}, {"id": 459, "q": "What is the minimum Final Exam score required to pass RMD301?", "options": ["3", "4", "5", "6"], "answer": 1, "src": "Claude soạn theo slide cô", "note": "Completion criteria: Final Exam ≥ 4, đi học > 80%.", "ls": "s01", "extra": false}, {"id": 460, "q": "According to the slides, the approval of a research proposal confirms that:", "options": ["The researcher understands the problem and has a clear plan to proceed", "The research is already finished", "The budget is unlimited", "No ethics approval is needed"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 06.", "ls": "s06", "extra": false}, {"id": 461, "q": "In the research proposal structure, 'Stakeholders' answers which question?", "options": ["Who will benefit from or be affected by this research?", "What will be researched?", "Why is there a gap?", "How long will it take?"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 06.", "ls": "s06", "extra": false}, {"id": 462, "q": "Which three appendixes does a research proposal include?", "options": ["Glossary of key terms, Budget, Timetable", "Survey, Interview, Photos", "References, Index, Abstract", "Results, Discussion, Conclusion"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Appendix 1 Glossary · 2 Budget · 3 Timetable.", "ls": "s06", "extra": false}, {"id": 463, "q": "Which two sections of a research proposal carry the largest content distribution (3/16 each)?", "options": ["Knowledge gap and Research methods & methodologies", "Title and Research question", "Budget and Timetable", "Stakeholders and Implications"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Knowledge gap 3/16, Methods & methodologies 3/16.", "ls": "s06", "extra": false}, {"id": 464, "q": "Raymond Madden (2010) defines ethnography as:", "options": ["An in-depth, systematic study about groups of people by observing or participating in their lives", "A statistical survey of a population", "A review of past literature", "A lab experiment"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 07.", "ls": "s07", "extra": false}, {"id": 465, "q": "Cyber-ethnography is:", "options": ["Studying social relations and behaviours in online social networks and communities", "Studying the researcher's own thoughts", "A lab experiment with computers", "Counting images in media"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Reeves et al., 2008.", "ls": "s07", "extra": false}, {"id": 466, "q": "Which three things should ethnographers pay particular attention to when conducting research?", "options": ["Type of communication, level of integration, duration of study", "Budget, sample size, statistics", "Colour, layout, typography", "Hypothesis, prediction, test"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 07.", "ls": "s07", "extra": false}, {"id": 467, "q": "Ethnography originated from which field?", "options": ["Anthropology", "Engineering", "Marketing", "Statistics"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Gốc từ anthropology (nghiên cứu xã hội bộ lạc/nông thôn).", "ls": "s07", "extra": false}, {"id": 468, "q": "What is the correct order of the six steps before gathering ethnographic data?", "options": ["Select a community → Identify a site → Identify community leaders → Gain access → Establish rapport → Identify key informants", "Gain access → Select a community → Identify informants → Identify site", "Identify informants → Establish rapport → Select community", "Identify leaders → Select community → Gain access → Identify site"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08: 6 steps.", "ls": "s08", "extra": false}, {"id": 469, "q": "Why is it hard to conduct ethnographic research in a familiar environment?", "options": ["It is hard to maintain objectivity and sufficient detachment", "It is too expensive", "Participants refuse to talk", "There is no gatekeeper"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08, step 2.", "ls": "s08", "extra": false}, {"id": 470, "q": "'Key informants' are people who:", "options": ["Provide relevant information and insights and facilitate contacts with other helpful individuals", "Fund the research", "Act as research supervisors", "Are always community leaders"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08, step 6.", "ls": "s08", "extra": false}, {"id": 471, "q": "Which interview type is rigid and most suitable for a survey in a quantitative study?", "options": ["Structured interview", "In-depth interview", "Oral history", "Focus group"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Structured interview.", "ls": "s08", "extra": false}, {"id": 472, "q": "Which interview type asks people about personal experiences and memories of their past in a narrative format?", "options": ["Oral history", "Structured interview", "Semi-structured interview", "Focus group"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Oral history.", "ls": "s08", "extra": false}, {"id": 473, "q": "When observing people, the two main domains to observe are:", "options": ["Structures & settings, and behaviours & interactions", "Prices and products", "Colours and fonts", "Hypotheses and variables"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08 – Observing people.", "ls": "s08", "extra": false}, {"id": 474, "q": "Cultural probes are mainly used to:", "options": ["Obtain inspirational responses from people, inspiring 'design for pleasure'", "Measure statistical significance", "Replace interviews", "Test hypotheses in a lab"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08.", "ls": "s08", "extra": false}, {"id": 475, "q": "Who delivered the cultural probes for the elderly (postcards, maps, disposable camera, photo album, media diary)?", "options": ["Bill Gaver, Tony Dunne and Elena Pacenti", "Glaser and Strauss", "Husserl and Heidegger", "Jean Kilbourne"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 08.", "ls": "s08", "extra": false}, {"id": 476, "q": "An informed consent form tells the participant about:", "options": ["The nature of the study, the risks involved and their right to quit at any time", "Only the researcher's salary", "The final results", "Nothing, it is just a signature"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 477, "q": "After consent is granted, how many copies should be kept, and by whom?", "options": ["Three: researcher, institution, participant", "One: researcher only", "Two: researcher and supervisor", "None"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 478, "q": "For participants under 18 or developmentally disabled adults, consent must come from:", "options": ["Parents or legal guardians", "The researcher", "The school canteen", "Nobody"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 479, "q": "Deception in research may only be used when:", "options": ["It is justified by significant value, does not affect willingness to participate, no alternative exists, and participants are debriefed immediately", "The researcher wants faster results", "Participants are children", "It saves money"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 480, "q": "Debriefing gives participants the opportunity to:", "options": ["Learn the true purpose, know the results and ask questions", "Get paid more", "Change the data", "Become researchers"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 481, "q": "In ANONYMITY:", "options": ["No one, not even the researcher, knows the participants' personal data", "The researcher knows identities but does not reveal them", "Only the institution knows identities", "Participants' names are published"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Anonymity ≠ Confidentiality.", "ls": "s09", "extra": false}, {"id": 482, "q": "The three steps of ethnographic data analysis are:", "options": ["Describe → Categorize → Interpret", "Code → Theme → Report", "Plan → Act → Reflect", "Segment → Compare → Describe"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 09.", "ls": "s09", "extra": false}, {"id": 483, "q": "Which section has the largest weight in an ethnographic report?", "options": ["Analysis of the Group (20%)", "Introduction (12%)", "Description of the Setting (10%)", "Conclusion (14%)"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Analysis of the Group 20%, Context 19%.", "ls": "s09", "extra": false}, {"id": 484, "q": "Which type of case study acts as a starting point and precursor to large-scale investigations?", "options": ["Exploratory", "Descriptive", "Explanatory", "Intrinsic"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 485, "q": "Which type of case study explains cause-effect relationships and produces definitive results?", "options": ["Explanatory", "Exploratory", "Descriptive", "Comparative"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 486, "q": "What are the three principles of organizing case-study data collection?", "options": ["Multiple sources of evidence, formation of a database, chain of evidence", "Hypothesis, test, result", "Sample, survey, statistics", "Plan, act, reflect"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 10.", "ls": "s10", "extra": false}, {"id": 488, "q": "Who is considered the father of modern phenomenology?", "options": ["Edmund Husserl", "Martin Heidegger", "Barney Glaser", "John Berger"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Husserl – Logical Investigations (1900–01).", "ls": "s11", "extra": false}, {"id": 489, "q": "Phenomenology differs from ethnography mainly because it focuses on:", "options": ["Individuals rather than groups", "Statistics rather than words", "The past rather than the present", "Images rather than people"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 490, "q": "How are participants usually selected in phenomenological research?", "options": ["Purposeful sampling of people with direct experience of the phenomenon", "Random sampling of a large population", "Stratified quota sampling", "Only the researcher's friends"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 491, "q": "According to the teacher's slides, a focus group should have:", "options": ["Between five and eight participants", "Exactly two participants", "At least 50 participants", "Only one participant"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11: 5–8 người, 1,5–3 giờ.", "ls": "s11", "extra": false}, {"id": 492, "q": "What is the first step of analysing phenomenological data?", "options": ["Data segmentation", "Data categorization", "Comparison of data", "Description of findings"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Segmentation → Categorization → Comparison → Description.", "ls": "s11", "extra": false}, {"id": 493, "q": "Design history focuses on the ____, while trend forecasting focuses on the ____.", "options": ["past; future", "future; past", "present; past", "future; present"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 494, "q": "The Mini car's design being affected by the 1956 Suez Canal crisis illustrates considering:", "options": ["Historical time and historical space", "Sampling", "Coding", "Deception"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 495, "q": "Le Corbusier's original drawings and models are an example of:", "options": ["Primary sources", "Secondary sources", "Archival surveys", "Meta-analysis"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Primary = tư liệu gốc.", "ls": "s11", "extra": false}, {"id": 496, "q": "What are the three steps for analysing historical data?", "options": ["Explain the context → Establish the validity of the facts → Identify causation and motives", "Collect → Code → Theorize", "Describe → Categorize → Interpret", "Observe → Hypothesize → Test"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 11.", "ls": "s11", "extra": false}, {"id": 497, "q": "Grounded theory was developed by:", "options": ["Barney Glaser and Anselm Strauss", "Husserl and Heidegger", "Leedy and Ormrod", "Gaver and Dunne"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Khi nghiên cứu bệnh nhân giai đoạn cuối.", "ls": "s12", "extra": false}, {"id": 498, "q": "In grounded theory, theories are built:", "options": ["Inductively, emerging from data rather than existing frameworks", "Deductively from an existing hypothesis", "Only from literature", "From statistics only"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 12.", "ls": "s12", "extra": false}, {"id": 499, "q": "Which coding step finds connections between codes to form broader categories?", "options": ["Axial coding", "Open coding", "Selective coding", "Random coding"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Open → Axial → Selective.", "ls": "s12", "extra": false}, {"id": 500, "q": "Which coding step combines categories into a storyline that leads to a theory?", "options": ["Selective coding", "Open coding", "Axial coding", "Data cleaning"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 12.", "ls": "s12", "extra": false}, {"id": 501, "q": "Grounded theory is criticised as 'washy-wishy' because:", "options": ["Some consider it inappropriate to ignore the existing literature", "It uses too many numbers", "It is too fast", "It needs no data"], "answer": 0, "src": "Claude soạn theo slide cô", "note": "Session 12 – weakness.", "ls": "s12", "extra": false}, {"id": 502, "q": "Which list matches the nine hallmarks of good qualitative research?", "options": ["Purpose, Disclosure, Rigor, Open-mindedness, Completeness, Coherence  Styling", "Strategic Appreciation or Appreciate the Context"], "answer": 3, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 221, "q": "Why did Moss's team avoid describing the initial situation immediately as a 'problem'?", "options": ["They wanted to understand the context and imagine a desired future before framing the problem", "They believed problems do not exist in military work", "They were not allowed to conduct research", "They wanted to skip the analysis phase"], "answer": 0, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 222, "q": "How did Moss define the eventual problem in relation to the design process?", "options": ["It was identical to the initial prompt", "It was the gap between the current reality and the desired future", "It was whatever solution the team preferred", "It was the first idea proposed by leadership"], "answer": 1, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 223, "q": "What term did Moss prefer for the issue that first triggered action?", "options": ["The prototype", "The final answer", "The prompt", "The style guide"], "answer": 2, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 224, "q": "When was the formal problem statement articulated?", "options": ["Before any research began", "Immediately after receiving the task", "Only after the final campaign ended", "After about 18 months of iterative research and learning"], "answer": 3, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 225, "q": "Who predetermined the issue or prompt assigned to USSOCOM?", "options": ["The Vice Chairman of the Joint Chiefs of Staff", "A private design consultancy", "The team's nuclear engineer", "A university research committee"], "answer": 0, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": tanding and help overcome bias", "To avoid comparing information across sources", "To reduce the need for synthesis", "To keep the project within a single discipline"], "answer": 0, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 234, "q": "What function did the team's large-format strategic-appreciation visualization serve?", "options": ["It replaced all research with a single image", "It acted as a synthesis document and shared systemic understanding", "It served only as a presentation decoration", "It was used to assign military ranks"], "answer": 1, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 235, "q": "How did the team try to fill gaps in its understanding?", "options": ["By ignoring unanswered questions", "By relying on one source only", "By seeking stakeholder feedback and commissioning targeted primary research", "By reducing the number of experts involved"], "answer": 2, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 236, "q": "Why could external organizations such as consultancies or universities become involved?", "options": ["They replaced the entire design team", "They were responsible only for visual design", "They were used to avoid evidence-based analysis", "They could be contracted to conduct specific research needed to fill knowledge gaps"], "answer": 3, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 237, "q": "Why did Moss's team draw on fields such as political science, sociology, economics, engineering, and law?", "options": ["To synthesize multiple perspectives into a systemic interpretation", "To prove that one discipline was always correct", "To keep research methods identical across all topics", "To avoid studying technical issues"], "answer": 0, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s05", "extra": true}, {"id": 238, "q": "How did Moss describe the team's method of combining individual learning into a collective interpretation?", "options": ["A standardized multiple-choice test", "Reflective discourse supported by a systems-map visualization", "A single analyst's private report", "An automated scoring system"], "answer": 1, "src": "File ôn tập chung (folder cô – Nhóm 1&2)", "note": "", "ls": "s03", "extra": true}, {"id": 239, "q": "Theo Moss, các mô hình lý thuyết được sử dụng trong nghiên cứu, đâu là phát biểu chính xác nhất về phương pháp tiếp cận của họ?", "options": ["Dựa hoàn toàn vào khoa học chính trị để phân tích và giải thích các vấn đề kỹ thuật như công nghệ hạt nhân.", "Tổng hợp các góc nhìn từ nhiều lĩnh vực đa dạng (như khoa học chính trị, tâm lý học, vật lý, luật...) thành một góc nhìn hệ thống và vận dụng nghiên cứu liên ngành (transdisciplinary research).", "Từ chối sử dụng các phương pháp phân tích tình báo của CIA và DIA vì cho rằng chúng không áp dụng được cho hệ thống phức tạp.", "Xây dựng một mô hình lý thuyết duy nhất và cố định cho mọi loại hình nghiên cứu mà không áp dụng kiến thức từ các ngành khoa học xã hội.", "Chỉ tập trung vào tâm lý học phân tích tình báo theo cuốn sách duy nhất của Richards Heuer xuất bản năm 1999."], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s02", "extra": true}, {"id": 241, "q": "Theo Moss, thách thức mà họ đã trải qua trong quá trình nghiên cứu là gì?", "options": ["Mất nhiều thời gian để thu thập thông tin tình báo do sự thiếu hụt nhân lực trong bộ phận J5.", "Phương pháp thiết kế gây cảm giác không thoải mái và là sự thay đổi căn bản so với quy trình lập kế hoạch truyền thống của quân đội.", "Sự can thiệp quá sâu của Tư lệnh vào giai đoạn đánh giá bối cảnh ban đầu.", "Quân đội hoàn toàn từ chối việc thành lập các đội nhóm làm việc đa chức năng.", "Việc chia sẻ thông tin tình báo ra cộng đồng bị hủy bỏ hoàn toàn do chính sách bảo mật."], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 242, "q": "Theo Moss, sự khác biệt của nhóm thiết kế, điểm cốt lõi làm nên sự khác biệt và ưu điểm lớn nhất của nhóm họ là gì?", "options": ["Tất cả các thành viên đều đóng góp bình đẳng vào sự hiểu biết chung, tận dụng trí tuệ, kinh nghiệm và góc nhìn đa dạng của mọi người thay vì để cộng đồng tình báo độc quyền nắm giữ \"nhận thức\".", "Chỉ có các chuyên gia tình báo mới được truy cập vào nguồn thông tin mật nhằm đảm bảo quy trình đánh giá độ tin cậy diễn ra chính xác.", "Nhóm quyết định loại bỏ hoàn toàn các thành viên không thuộc chuyên ngành tình báo để tránh tình trạng thiếu kỹ năng phân tích.", "Quy trình làm việc hạn chế tối đa việc sử dụng các nguồn thông tin rộng rãi nhằm tránh gây rối loạn cho các thành viên khác.", "Các thành viên ngoài ngành tình báo hoàn toàn chịu trách nhiệm chính trong việc đưa ra quyết định thay cho nhà phân tích tình báo."], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 243, "q": "Theo Moss, những hạn chế (limitations) gặp phải trong quá trình nghiên cứu, phát biểu nào sau đây phản ánh chính xác nhất các thách thức mà họ đã đối mặt?", "options": ["Việc xin quyền truy cập bảo mật cho đối tác bên ngoài, vấn đề kinh phí nghiên cứu, giới hạn công suất của các cơ quan tình báo, cùng với việc vượt qua thiên vị và tư duy cá nhân.", "Việc thuộc về USSOCOM là hạn chế lớn nhất làm cho nhóm thiết kế không thể áp dụng vào môi trường hoạt động thực tế.", "Chính phủ có khả năng nghiên cứu hoàn hảo trong kỷ nguyên thông tin nên nhóm hoàn toàn không cần mua dữ liệu hay phân tích sẵn từ bên ngoài.", "Các cơ quan sản xuất tình báo luôn ưu tiên tuyệt đối cho công việc của nhóm thiết kế bất kể bối cảnh chiến tranh kép (dual-war environment).", "Nhóm từ chối làm việc với tất cả các tổ chức chưa qua kiểm duyệt an ninh (uncleared organizations) để tránh phải tìm giải pháp linh hoạt."], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s04", "extra": true}, {"id": 244, "q": "Theo Moss, việc xử lý các góc nhìn mới và phát hiện bất ngờ trong quá trình nghiên cứu, nhóm của ông đã áp dụng quy trình nào để tiếp cận chúng?", "options": ["Tạm dừng đánh giá chiến lược tổng thể để phát triển cơ hội cụ thể (CONOP), cùng tư duy qua đối thoại và tổ chức các buổi hình thành ý tưởng chính thức với các chuyên gia.", "Loại bỏ hoàn toàn các phát hiện bất ngờ để tránh làm chệch hướng lộ trình đánh giá chiến lược ban đầu của hệ thống lớn.", "Áp dụng ngay các phương pháp hình thành ý tưởng thiết kế truyền thống theo quy chuẩn thay vì trao đổi thảo luận nhóm.", "Từ chối hợp tác với Cộng đồng quan tâm (CoI) vì quy mô của họ quá lớn và mang tính chất cồng kềnh, không đồng nhất.", "Chuyển giao toàn bộ việc theo dõi mối quan hệ và truyền thông cho một cơ quan hành chính bên ngoài tự xử lý."], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 245, "q": "Theo Moss, những góc nhìn/phát hiện giá trị nhất (most valuable insights) thu được, đâu là phát biểu chính xác nhất?", "options": ["Mặc dù không thể thảo luận về các góc nhìn cụ thể, ông đã phát triển một mô hình tư duy hệ thống dựa trên lý thuyết mạng giúp mở rộng góc nhìn và tăng đáng kể các yếu tố cân nhắc mục tiêu.", "Moss đã trình bày chi tiết toàn bộ các phát hiện tình báo quan trọng nhất mà nhóm thu thập được trong suốt quá trình nghiên cứu.", "Nhóm đã áp dụng trí tuệ nhân tạo để thay thế hoàn toàn mô hình tư duy hệ thống trong việc xác định các mục tiêu chiến lược.", "Moss từ chối trả lời và khẳng định rằng công việc của họ không mang lại bất kỳ mô hình tư duy hay kết quả hữu ích nào.", "Mô hình mới giúp thu hẹp phạm vi góc nhìn để nhóm chỉ tập trung vào một mục tiêu duy nhất thay vì mở rộng xem xét."], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 246, "q": "Theo Moss, việc đánh giá kết quả cuối cùng (end results) của công việc họ làm, đâu là khẳng định chính xác nhất?", "options": ["Về bản chất không có kết quả cuối cùng, vì đây là một nỗ lực liên tục trong môi trường chính trị - xã hội toàn cầu đầy biến động, khiến công việc không bao giờ kết thúc.", "Kết quả cuối cùng được đánh giá dựa trên mức độ hoàn thành các chỉ tiêu đo lường cố định do cấp trên đề ra từ ban đầu.", "Công việc sẽ lập tức kết thúc và được đánh giá ngay khi hợp đồng với đối tác hoàn tất.", "Môi trường chính trị - xã hội mang tính ổn định cao, giúp cho việc đánh giá kết quả diễn ra nhanh chóng và chính xác.", "Đánh giá kết quả cuối cùng là nhiệm vụ riêng biệt được chuyển giao hoàn toàn cho bộ phận kiểm định độc lập."], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 247, "q": "Theo tài liệu, lĩnh vực thiết kế hiện nay đang trở nên tập trung nhiều hơn vào điều gì?", "options": ["Tạo ra các sản phẩm có tính thẩm mỹ cao", "Lắng nghe, đặt câu hỏi, thấu hiểu và xây dựng những khả năng mới", "Tuân thủ các nguyên tắc thiết kế truyền thống", "Giảm sự tham gia của các lĩnh vực khác vào thiết kế"], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 249, "q": "Ví dụ về Raymond Loewy trong tài liệu nhằm minh họa điều gì?", "options": ["Nhà thiết kế chỉ nên chuyên môn hóa vào một lĩnh vực duy nhất", "Design practice có thể bao gồm nhiều lĩnh vực và dự án khác nhau", "Thiết kế chỉ phát triển mạnh trong lĩnh vực thời trang", "Các nhà thiết kế trong quá khứ không có ảnh hưởng đến xã hội"], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 250, "q": "Vì sao các nhà thiết kế ngày nay cần mở rộng kiến thức liên ngành?", "options": ["Vì các lĩnh vực khác đang thay thế hoàn toàn thiết kế", "Vì tất cả nhà thiết kế đều phải trở thành kỹ sư", "Vì thiết kế không còn cần đến kỹ năng chuyên môn", "Vì các vấn đề mà doanh nghiệp và xã hội đối mặt ngày càng phức tạp"], "answer": 3, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 251, "q": "Một công ty muốn giảm lượng rác thải và đồng thời tạo ra bao bì thân thiện với người dùng. Dựa trên nội dung tài liệu, cách tiếp cận nào phù hợp nhất?", "options": ["Kết hợp kiến thức từ nhiều lĩnh vực để hiểu vấn đề và phát triển giải pháp mới", "Chỉ tập trung làm bao bì đẹp hơn", "Chỉ nghiên cứu chi phí sản xuất", "Sử dụng một quy tắc thiết kế cố định cho mọi sản phẩm"], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 252, "q": "Nội dung nào sau đây KHÔNG được tài liệu đề cập như một ví dụ về những đóng góp tích cực của nhà thiết kế?", "options": ["Phát triển các sản phẩm và quy trình tiết kiệm năng lượng", "Tạo ra môi trường thân thiện với con người", "Khuyến khích sự tham gia chính trị", "Tập trung loại bỏ hoàn toàn yếu tố công nghệ trong thiết kế"], "answer": 3, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 253, "q": "Theo tài liệu, design practice đã thay đổi như thế nào so với trước đây?", "options": ["Thiết kế hiện nay hoàn toàn dựa trên một bộ nguyên tắc cố định", "Nhà thiết kế hiện nay chỉ làm việc với sản phẩm vật lý", "Khái niệm về thiết kế và vai trò của nhà thiết kế đã thay đổi đáng kể", "Nhà thiết kế ngày nay chỉ tập trung vào trang trí"], "answer": 2, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 254, "q": "Điểm khác biệt nào được tài liệu nhấn mạnh giữa designers với architects và engineers?", "options": ["Designers luôn làm việc độc lập", "Designers không nhất thiết làm việc dựa trên một tập hợp các nguyên tắc và quy tắc cố định", "Designers không cần có kỹ năng chuyên môn", "Designers không giải quyết các vấn đề thực tế"], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 3", "note": "", "ls": "s03", "extra": true}, {"id": 255, "q": "Tại sao tài liệu cho rằng design ngày càng trở thành một cách tư duy được tìm kiếm trong nhiều lĩnh vực?", "options": ["Vì thiết kế chỉ tạo ra các sản phẩm đẹp hơn", "Vì thiết kế có khả năng hỗ trợ giải quyế ate for the research problem", "Use the methods that require the least amount of preparation", "Select methods that are most commonly used in the research field", "Include as many methods as possible to strengthen the research"], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 5", "note": "", "ls": "s05", "extra": true}, {"id": 315, "q": "Why does a researcher need to clearly explain their methodology?", "options": ["To demonstrate that the research is properly planned", "To make the research accessible to every audience", "To reduce the amount of data collected during research", "To ensure that the research uses familiar methods", "To avoid discussing limitations in the research process"], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 5", "note": "", "ls": "s05", "extra": true}, {"id": 316, "q": "A communication designer is developing a new energy drink brand for young adults. Based on the text, why would combining field observation, interviews, and questionnaires be useful?", "options": ["Each method can reveal different aspects of the target audience", "Multiple methods can eliminate the need for literature review", "Different methods can guarantee completely objective findings", "Using several methods can reduce the need for participant selection", "Multiple methods can ensure that all consumers share the same habits"], "answer": 0, "src": "Câu hỏi ôn tập – Nhóm 5", "note": "", "ls": "s14", "extra": true}, {"id": 317, "q": "In the text, how is the book Research for Designers conceptualized for a beginner researcher?", "options": ["As a strict legal framework for academic publishing", "As an instruction manual that directs you on which tools to use for common problems", "As a substitute for conducting literature reviews and fieldwork", "As a fixed set of pre-determined answers for commercial design challenges"], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 5", "note": "", "ls": "s04", "extra": true}, {"id": 318, "q": "A researcher presents a project to a group of people wh es are not allowed to access university research.", "Researchers are required to sell all IP immediately."], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 6", "note": "", "ls": "s04", "extra": true}, {"id": 353, "q": "What distinguishes well-established universities that can bring research into the corporate sector?", "options": ["They avoid working with industry to preserve academic independence.", "They have strong research infrastructures and established connections with industry.", "They focus only on teaching rather than research.", "They eliminate all administrative procedures.", "They commercialize every research project they produce."], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 6", "note": "", "ls": "s04", "extra": true}, {"id": 354, "q": "What does the Design Innovation Research Group at the University of Sydney investigate?", "options": ["Only traditional manufacturing techniques", "The history of architecture and urban planning", "Design methods, implementation techniques, and strategies for integrating design into innovation practices", "University admission and student assessment systems", "Methods for replacing academic research with commercial research"], "answer": 2, "src": "Câu hỏi ôn tập – Nhóm 6", "note": "", "ls": "s04", "extra": true}, {"id": 355, "q": "What is the core requirement of the \"Beneficence\" principle regarding research?", "options": ["The research must guarantee financial benefits to all participants.", "The likely benefit of the research must justify any risks of harm or discomfort to participants.", "The research should completely eliminate any risks, regardless of the benefits.", "The benefits must exclusively serve the wider community, not the participants."], "answer": 1, "src": "Câu hỏi ôn tập – Nhóm 6", "note": "", "ls": "s05", "extra": true}, {"id": 356, "q": "According to the text, which of the following is NOT a responsibility of researchers regarding beneficence?", "options": ["Designing the research to minimize the risks
