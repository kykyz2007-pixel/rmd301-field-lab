function show() {
  window.scrollTo(0, 0);
  const it = G.items[G.i], q = it.q, n = G.items.length, exam = G.m === "exam";
  const tiles = it.order.map((oi, k) => {
    let cls = "t" + k;
    if (!exam && it.pick !== null) cls += oi === q.answer ? " right" : oi === it.pick ? " wrong" : " dim";
    if (exam && it.pick === oi) cls += " pick";
    return `<button class="tile ${cls}" data-o="${oi}"><span class="sh">${SH[k]}</span>${esc(q.options[oi])}</button>`;
  }).join("");
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Exit">✕</button><div class="bar"><i style="width:${(G.i / n) * 100}%"></i></div><span class="score">${exam ? `${G.i + 1}/${n}` : `${G.right} correct · ${G.i + 1}/${n}`}</span>${exam ? `<span class="timer" id="tm">${fmt(G.left)}</span>` : ""}</div>
    <div class="qbox"><div class="meta">${esc(LN[q.ls].t)} · ${esc(q.src)}${q.note && q.note.startsWith("CORRECTED") ? " · CORRECTED" : ""}</div><div class="q">${esc(q.q)}</div></div>
    <div class="streak">${!exam && G.streak >= 3 ? `${G.streak} in a row!` : ""}</div>
    <div class="tiles">${tiles}</div>
    <div class="fb" id="fb"></div>
    ${exam ? `<div class="row"><button class="btn" id="pv" ${G.i === 0 ? "disabled" : ""}>← Previous</button><div class="spacer"></div><button class="btn ink" id="nx">${G.i === n - 1 ? "Submit" : "Next →"}</button></div><div class="qgrid">${G.items.map((x, k) => `<button data-j="${k}" class="${x.pick !== null ? "done" : ""} ${k === G.i ? "cur" : ""}">${k + 1}</button>`).join("")}</div>` : ""}`;
  bindHome();
  let armed = false;
  $("#bk").onclick = () => { if (exam && !armed) { armed = true; $("#bk").textContent = "?"; $("#bk").title = "Click again to exit"; return; } stop(); G = null; go("quizHome"); };
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => choose(+b.dataset.o, b));
  if (exam) {
    $("#nx").onclick = () => { if (G.i === n - 1) submit(); else { G.i++; show(); } };
    $("#pv").onclick = () => { if (G.i > 0) { G.i--; show(); } };
    app.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { G.i = +b.dataset.j; show(); });
  }
  if (!exam && it.pick !== null) feedback(it);
  document.onkeydown = e => {
    const k = e.key.toUpperCase(); const ix = SH.indexOf(k) >= 0 ? SH.indexOf(k) : "123456".indexOf(e.key);
    const ts = app.querySelectorAll(".tile"); if (ix >= 0 && ix < ts.length) { ts[ix].click(); return; }
    if (e.key === "Enter" || e.key === "ArrowRight") { const b = $("#go") || $("#nx"); if (b) b.click(); }
    if (e.key === "ArrowLeft" && exam) { const b = $("#pv"); if (b) b.click(); }
  };
}
function choose(oi, el) {
  const it = G.items[G.i];
  if (G.m === "exam") { SFX.click(); it.pick = oi; if (G.i < G.items.length - 1) G.i++; show(); return; }
  if (it.pick !== null) return;
  it.pick = oi; const ok = oi === it.q.answer; record(it.q, ok);
  if (ok) { G.right++; G.streak++; G.best = Math.max(G.best, G.streak); SFX.ok(G.streak); if (G.streak >= 3 && G.streak % 3 === 0) SFX.streak(); const r = el.getBoundingClientRect(); const d = document.createElement("div"); d.className = "pop"; d.textContent = "+1"; d.style.left = (r.right - 50) + "px"; d.style.top = r.top + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
  else { G.streak = 0; SFX.bad(); }
  show();
}
function feedback(it) {
  const q = it.q, ok = it.pick === q.answer, fb = $("#fb");
  const warn = q.note && /^(CORRECTED|WARNING)/.test(q.note);
  fb.className = "fb show " + (ok ? "good" : "bad");
  fb.innerHTML = `<div class="say">${ok ? "Correct!" : "Wrong"}</div>${ok ? "" : `<div class="a">Answer: <b>${esc(q.options[q.answer])}</b></div>`}${q.note ? (warn ? `<div class="warn">${esc(q.note)}</div>` : `<div class="x">${esc(q.note)}</div>`) : ""}<div class="row"><button class="btn pri" id="go">${G.i === G.items.length - 1 ? "See results" : "Next →"}</button></div>`;
  $("#go").onclick = () => { if (G.i >= G.items.length - 1) finish(); else { G.i++; show(); } };
}
function submit() {
  const left = G.items.filter(x => x.pick === null).length;
  if (left && !G.sure) { G.sure = true; $("#nx").textContent = `${left} unanswered – click again to submit`; return; }
  finish();
}
function finish() {
  stop(); document.onkeydown = null;
  if (G.m === "exam") { G.items.forEach(it => record(it.q, it.pick === it.q.answer)); G.right = G.items.filter(it => it.pick === it.q.answer).length; }
  const n = G.items.length, pct = G.right / n, ten = (Math.round(pct * 100) / 10).toFixed(1);
  setTimeout(() => SFX.result(pct), 150);
  const gr = pct >= .9 ? "A+" : pct >= .8 ? "A" : pct >= .65 ? "B" : pct >= .4 ? "C" : "F";
  const miss = G.items.filter(it => it.pick !== it.q.answer);
  const weak = {}; miss.forEach(it => weak[it.q.ls] = (weak[it.q.ls] || 0) + 1);
  const weakL = Object.entries(weak).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k);
  const m = G.m, ids = G.ids;
  app.innerHTML = header() + page(`<div style="text-align:center">
      <div class="grade"><svg viewBox="0 0 140 140"><ellipse cx="70" cy="70" rx="62" ry="54" fill="none" stroke="#d7372b" stroke-width="4" transform="rotate(-12 70 70)"/></svg>${gr}</div>
      <div class="hand">${pct >= .8 ? "Great – keep it up!" : pct >= .5 ? "Not bad – review your mistakes to lock it in." : "Re-read the lessons and try again."}</div>
      <div class="stats"><div class="stat"><b>${G.right}/${n}</b><span>correct</span></div><div class="stat"><b>${ten}</b><span>out of 10</span></div>${m !== "exam" ? `<div class="stat"><b>${G.best || 0}</b><span>best streak</span></div>` : ""}<div class="stat"><b>${Math.max(1, Math.round((Date.now() - G.t0) / 60000))}′</b><span>time</span></div></div>
      <div class="row" style="justify-content:center"><button class="btn pri" id="ag">Try again</button>${weakL.length ? `<button class="btn" id="rd">Re-read: ${esc(LN[weakL[0]].t.replace(/^\d+ · /, ""))}</button>` : ""}<button class="btn" id="hq">Back to Quiz</button></div></div>
    ${miss.length ? `<div class="sec">Review ${miss.length} wrong answers</div><div class="rev">${miss.map(it => `<div class="rv"><b>${esc(it.q.q)}</b><div class="me">${it.pick === null ? "(left blank)" : "Your answer: " + esc(it.q.options[it.pick])}</div><div class="ok">Correct: ${esc(it.q.options[it.q.answer])}</div>${it.q.note ? `<div class="ex">${esc(it.q.note)}</div>` : ""}<div class="ex">${esc(LN[it.q.ls].t)}</div></div>`).join("")}</div>` : ""}`);
  G = null; bindHome();
  $("#ag").onclick = () => startQuiz(m, ids);
  $("#hq").onclick = () => go("quizHome");
  const rd = $("#rd"); if (rd) rd.onclick = () => go("lesson", { id: weakL[0], i: 0 });
}

// ---------- KEY TERMS ----------
function terms() {
  location.hash = "terms";
  S.known = S.known || [];
  const total = Object.values(GL).flat().length;
  const render = (qs = "") => {
    const f = qs.trim().toLowerCase();
    return LESSONS.filter(l => GL[l.id]).map(l => {
      const items = GL[l.id].filter(x => !f || (x.t + " " + x.d).toLowerCase().includes(f));
      if (!items.length) return "";
      return `<div class="tgroup"><h4>${esc(l.t)}</h4>${items.map(x => `<div class="term ${S.known.includes(x.t) ? "known" : ""}"><b>${esc(x.t)}${x.vi ? `<em class="vi">(${esc(x.vi)})</em>` : ""}</b><span>${esc(x.d)}</span></div>`).join("")}</div>`;
    }).join("") + (() => { const ps = (GL.people || []).filter(x => !f || (x.t + " " + x.d).toLowerCase().includes(f)); return ps.length ? `<div class="tgroup"><h4>👤 People &amp; names</h4>${ps.map(x => `<div class="term ${S.known.includes(x.t + "|" + x.ls) ? "known" : ""}"><b>${esc(x.t)}</b><span>${esc(x.d)} <i style="color:var(--ink2)">(${esc(LN[x.ls].t.split(" · ")[0])})</i></span></div>`).join("")}</div>` : ""; })() || `<p class="fchint">No term matches.</p>`;
  };
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Back to home">←</button><div class="hudt">Key Terms<small>${total} terms & names · ${S.known.length} marked as known</small></div></div>` +
    page(`<div class="row"><button class="btn pri" id="fcAll">Flashcards: all ${total}</button><button class="btn" id="fcNew">Only ones I don't know yet (${Math.max(0, total - S.known.length)})</button><button class="btn" id="fcPpl">People &amp; names only (${(GL.people || []).length})</button><button class="btn sm" id="fcSel">Selected lessons only</button></div>
    <input class="tsearch" id="ts" placeholder="Search a term or meaning…" aria-label="Search terms">
    <div id="tl">${render()}</div>`);
  bindHome(); $("#bk").onclick = () => go("home");
  $("#ts").oninput = e => { $("#tl").innerHTML = render(e.target.value); };
  const all = () => LESSONS.flatMap(l => (GL[l.id] || []).map(x => ({ ...x, ls: l.id }))).concat((GL.people || []).map(x => ({ ...x, p: 1 })));
  const key = x => x.p ? x.t + "|" + x.ls : x.t;
  $("#fcAll").onclick = () => go("cards", all());
  $("#fcNew").onclick = () => { const a = all().filter(x => !S.known.includes(key(x))); if (!a.length) return toast("You know them all! Use 'Flashcards: all' to review."); go("cards", a); };
  $("#fcPpl").onclick = () => go("cards", all().filter(x => x.p));
  $("#fcSel").onclick = () => { const a = all().filter(x => S.sel.includes(x.ls)); if (!a.length) return toast("No lessons selected in the Quiz section."); go("cards", a); };
}
function cards(list) {
  location.hash = "cards";
  const deck = shuffle(list.slice()); let i = 0, again = [], got = 0;
  const draw = () => {
    if (i >= deck.length) {
      if (again.length) { deck.push(...shuffle(again)); again = []; }
      else { SFX.result(1); app.innerHTML = header() + page(`<div style="text-align:center"><div class="hand" style="font-size:30px;margin:10px 0">Deck done! 🎉</div><p>${got} terms marked as known.</p><div class="row" style="justify-content:center"><button class="btn pri" id="toQz">Start a quiz</button><button class="btn" id="bt">Back to Key Terms</button></div></div>`); bindHome(); $("#toQz").onclick = () => go("quizHome"); $("#bt").onclick = () => go("terms"); return; }
    }
    const x = deck[i];
    app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Back to Key Terms">←</button><div class="bar"><i style="width:${(i / deck.length) * 100}%"></i></div><span class="score">${i + 1}/${deck.length}</span></div>` +
      page(`<div class="fc" id="fc"><div class="in"><div class="face front"><small>${x.p ? "👤 " : ""}${esc(LN[x.ls].t)}</small><b>${esc(x.t)}</b>${x.vi ? `<em class="vi" style="font-size:16px;margin-top:6px">(${esc(x.vi)})</em>` : ""}<p class="fchint" style="margin-top:14px">${x.p ? "Who is this / what are they known for?" : "Say the meaning in your head, then tap to flip"}</p></div><div class="face back"><small>${esc(x.t)}</small><span>${esc(x.d)}</span></div></div></div>
      <div class="row" style="justify-content:center"><button class="btn" id="ag">↺ Again</button><button class="btn pri" id="ok">✓ Got it</button></div>
      <p class="fchint">Keys: Space = flip · ← Again · → Got it</p>`);
    bindHome();
    $("#bk").onclick = () => go("terms");
    const fc = $("#fc"); const flip = () => { fc.classList.toggle("flip"); SFX.page(); };
    fc.onclick = flip;
    const nextCard = ok => { if (ok) { got++; S.known = S.known || []; const k = x.p ? x.t + "|" + x.ls : x.t; if (!S.known.includes(k)) { S.known.push(k); save(); } SFX.ok(1); } else { again.push(x); SFX.bad(); } i++; draw(); };
    $("#ag").onclick = () => nextCard(false); $("#ok").onclick = () => nextCard(true);
    document.onkeydown = e => { if (e.key === " ") { e.preventDefault(); flip(); } if (e.key === "ArrowRight") nextCard(true); if (e.key === "ArrowLeft") nextCard(false); };
  };
  draw();
}

// ---------- METHODS GUIDE ----------
function methods() {
  location.hash = "methods";
  const groups = [...new Set(MT.methods.map(m => m.g))];
  const card = m => `<details class="mcard"><summary><b>${esc(m.n)}${m.vi ? `<em class="vi">(${esc(m.vi)})</em>` : ""}</b><span>${esc(m.one)}</span></summary><dl class="mbody">
    <dt>Key question it answers</dt><dd>${esc(m.ask)}</dd>
    <dt>Use it when</dt><dd>${esc(m.use)}</dd>
    <dt>How it works</dt><dd>${esc(m.how)}</dd>
    <dt>Spot it in a question – signal words</dt><dd class="spot">${m.spot.map(s => `<i>${esc(s)}</i>`).join("")}</dd>
    <dt>Don't confuse it</dt><dd class="vs">${esc(m.vs)}</dd>
    ${m.ppl ? `<dt>People / examples</dt><dd>${esc(m.ppl)}</dd>` : ""}
    <dt>Lesson</dt><dd><button class="btn sm" data-gl="${m.ls}">Open ${esc(LN[m.ls].t)}</button></dd></dl></details>`;
  const cmp = `<table class="cmp"><tr><th></th><th>Qualitative (định tính)</th><th>Quantitative (định lượng)</th></tr>
    <tr><td>Data</td><td>Words, images, stories</td><td>Numbers, statistics</td></tr>
    <tr><td>Asks</td><td>WHY / HOW – meaning, motives</td><td>WHAT / HOW MANY – measure, cause & effect</td></tr>
    <tr><td>Sample</td><td>Small, purposeful</td><td>Large, random / representative</td></tr>
    <tr><td>Setting</td><td>Natural settings, flexible</td><td>Field (external validity) or lab (internal validity)</td></tr>
    <tr><td>Theory</td><td>BUILDS new theory</td><td>TESTS / verifies existing theory</td></tr>
    <tr><td>Researcher</td><td>Subjective, interpretive</td><td>Objective, independent</td></tr>
    <tr><td>Tools</td><td>In-depth & semi-structured interviews, focus groups, observation, documents</td><td>Surveys (closed, Likert), experiments, structured observation, analytics</td></tr>
    <tr><td>Analysis</td><td>Coding, themes (collect & analyse at the same time)</td><td>Mean/median/mode, t-test, ANOVA, correlation</td></tr>
    <tr><td>Weakness</td><td>Subjective, hard to generalise, time-consuming</td><td>Misses the 'why', less depth</td></tr></table>`;
  app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Back to home">←</button><div class="hudt">Methods Guide<small>Tap a method to open it · ${MT.drill.length} scenario questions in the drill</small></div></div>` +
    page(`<div class="row"><button class="btn pri" id="dr10">"Which method?" drill · 10</button><button class="btn" id="drAll">Drill all ${MT.drill.length}</button><button class="btn sm" id="opAll">Open all</button></div>
    <div class="mgroup"><h4>Qualitative vs Quantitative – at a glance</h4>${cmp}</div>
    ${groups.map(g => `<div class="mgroup"><h4>${esc(g)}</h4>${MT.methods.filter(m => m.g === g).map(card).join("")}</div>`).join("")}`);
  bindHome(); $("#bk").onclick = () => go("home");
  $("#dr10").onclick = () => go("drill", 10); $("#drAll").onclick = () => go("drill", MT.drill.length);
  $("#opAll").onclick = () => { const all = app.querySelectorAll("details.mcard"); const open = [...all].some(d => !d.open); all.forEach(d => d.open = open); $("#opAll").textContent = open ? "Close all" : "Open all"; };
  app.querySelectorAll("details.mcard").forEach(d => d.addEventListener("toggle", () => { if (d.open) SFX.page(); }));
  app.querySelectorAll("[data-gl]").forEach(b => b.onclick = () => go("lesson", { id: b.dataset.gl, i: 0 }));
}
function drill(n) {
  location.hash = "drill";
  const items = shuffle(MT.drill).slice(0, n).map(x => ({ ...x, o: shuffle(x.o), pick: null }));
  let i = 0, right = 0, streak = 0;
  const findM = a => MT.methods.find(m => a.toLowerCase().startsWith(m.n.toLowerCase().split(" (")[0].split(" /")[0]) || m.n.toLowerCase().startsWith(a.toLowerCase().split(" (")[0]));
  const draw = () => {
    if (i >= items.length) { SFX.result(right / items.length); app.innerHTML = header() + page(`<div style="text-align:center"><div class="hand" style="font-size:30px;margin:10px 0">${right}/${items.length} correct</div><p>${right / items.length >= .8 ? "You can spot the methods – go do the quiz!" : "Open the Methods Guide cards you missed, then try again."}</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Drill again</button><button class="btn" id="bm">Back to Methods Guide</button><button class="btn" id="toQz">Go to Quiz</button></div></div>`); bindHome(); $("#again").onclick = () => go("drill", n); $("#bm").onclick = () => go("methods"); $("#toQz").onclick = () => go("quizHome"); return; }
    const x = items[i];
    app.innerHTML = header() + `<div class="hud"><button class="back" id="bk" aria-label="Back to Methods Guide">✕</button><div class="bar"><i style="width:${(i / items.length) * 100}%"></i></div><span class="score">${right} correct · ${i + 1}/${items.length}</span></div>
      <div class="qbox"><div class="meta">Which method / term is this?</div><div class="q">${esc(x.s)}</div></div>
      <div class="tiles">${x.o.map((o, k) => `<button class="tile t${k}" data-o="${k}"><span class="sh">${SH[k]}</span>${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    bindHome(); $("#bk").onclick = () => go("methods");
    app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      if (x.pick !== null) return; x.pick = +b.dataset.o; const ok = x.o[x.pick] === x.a;
      if (ok) { right++; streak++; SFX.ok(streak); if (streak >= 3 && streak % 3 === 0) SFX.streak(); } else { streak = 0; SFX.bad(); }
      app.querySelectorAll("[data-o]").forEach(t => { const v = x.o[+t.dataset.o]; t.classList.add(v === x.a ? "right" : (+t.dataset.o === x.pick ? "wrong" : "dim")); });
      const m = findM(x.a), fb = $("#fb"); const base = x.a.split(" (")[0].toLowerCase(); const gt = !m && Object.values(GL).flat().find(g => g.t.toLowerCase().startsWith(base) || base.startsWith(g.t.toLowerCase().split(" (")[0])); fb.className = "fb show " + (ok ? "good" : "bad");
      fb.innerHTML = `<div class="say">${ok ? "Correct!" : "Wrong"}</div>${ok ? "" : `<div class="a">Answer: <b>${esc(x.a)}</b></div>`}${m ? `<div class="x"><b>${esc(m.n)}${m.vi ? ` (${esc(m.vi)})` : ""}:</b> ${esc(m.one)}<br><i>Clue words:</i> ${esc(m.spot.slice(0, 3).join(" · "))}</div>` : gt ? `<div class="x"><b>${esc(gt.t)}${gt.vi ? ` (${esc(gt.vi)})` : ""}:</b> ${esc(gt.d)}</div>` : ""}<div class="row"><button class="btn pri" id="go">${i === items.length - 1 ? "See results" : "Next →"}</button></div>`;
      $("#go").onclick = () => { i++; draw(); };
    });
  };
  draw();
}
function toast(msg) { const d = document.createElement("div"); d.className = "fb show bad"; Object.assign(d.style, { position: "fixed", left: "50%", bottom: "24px", transform: "translateX(-50%)", zIndex: 60, maxWidth: "90vw" }); d.innerHTML = `<div class="a">${esc(msg)}</div>`; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

const h = location.hash.slice(1);
if (h === "lessons") go("lessons"); else if (h.startsWith("lesson-") && LN[h.slice(7)]) go("lesson", { id: h.slice(7), i: 0 }); else if (h === "quiz") go("quizHome"); else if (h === "terms" || h === "cards") go("terms"); else if (h === "methods" || h === "drill") go("methods"); else go("home");
</script>
</body>
